    <noscript><div class="noscript"><h1>法律・罰金</h1><p>PDが扱うゲーム内の法律、罰金、刑期、インパウンドの基準を検索できます。</p><p>最終更新 2026-11-02</p><nav><a href="../">NicoGura | にこぐら 公式ルール・参加ガイド</a> / <a href="../rules/">公式ルール</a> / <a href="../join/">参加方法</a> / <a href="../server/">サーバー情報</a> / <a href="../mods/">MOD・グリッチ</a> / <a href="../character/">キャラクター</a> / <a href="../economy/">経済・料金</a> / <a href="../crime/">犯罪RP</a> / <a href="../law/">法律・罰金</a> / <a href="../guides/">にこぐらガイド</a> / <a href="../pd/">PD・警察</a> / <a href="../ems/">EMS・救急</a> / <a href="../mechanic/">メカニック</a> / <a href="../shops/">店舗</a> / <a href="../lifejobs/">Life Job</a> / <a href="../gangs/">ギャング</a> / <a href="../faq/">よくある質問</a> / <a href="../contact/">お問い合わせ</a></nav><section id="penalties-basic-fines"><h2>ゲーム内法律・基本罰金と保護観察</h2><p>ゲーム内の犯罪には、PDによる対応、罰金、保護観察、押収、インパウンドなどがあります。サーバールール違反に対する運営の対応とは区別します。</p><table><caption>基本罰金と保護観察</caption><thead><tr><th>罪状</th><th>罰金</th><th>保護観察時間</th><th>適用条件・補足</th></tr></thead><tbody><tr><td data-label="罪状">銃刀法違反</td><td data-label="罰金">1,500,000円</td><td data-label="保護観察時間">5分</td><td data-label="適用条件・補足">犯罪時に武器を所持していた場合に適用</td></tr><tr><td data-label="罪状">誘拐拉致監禁罪</td><td data-label="罰金">1,500,000円</td><td data-label="保護観察時間">—</td><td data-label="適用条件・補足">—</td></tr><tr><td data-label="罪状">NPC殺人罪</td><td data-label="罰金">2,500,000円</td><td data-label="保護観察時間">5分</td><td data-label="適用条件・補足">—</td></tr><tr><td data-label="罪状">プレイヤー殺人・未遂罪</td><td data-label="罰金">10,000,000円</td><td data-label="保護観察時間">10分</td><td data-label="適用条件・補足">—</td></tr><tr><td data-label="罪状">窃盗罪</td><td data-label="罰金">1,000,000円</td><td data-label="保護観察時間">10分</td><td data-label="適用条件・補足">車両窃盗に適用</td></tr><tr><td data-label="罪状">重窃盗罪</td><td data-label="罰金">50,000,000円</td><td data-label="保護観察時間">60分</td><td data-label="適用条件・補足">公務員の窃盗に適用</td></tr><tr><td data-label="罪状">公務執行妨害罪</td><td data-label="罰金">2,000,000円</td><td data-label="保護観察時間">5分</td><td data-label="適用条件・補足">—</td></tr><tr><td data-label="罪状">テロ罪</td><td data-label="罰金">5,000,000,000円</td><td data-label="保護観察時間">12時間</td><td data-label="適用条件・補足">警察署襲撃など</td></tr><tr><td data-label="罪状">汚職収賄罪</td><td data-label="罰金">5,000,000,000円</td><td data-label="保護観察時間">60分</td><td data-label="適用条件・補足">—</td></tr><tr><td data-label="罪状">業務妨害罪</td><td data-label="罰金">1,000,000,000円</td><td data-label="保護観察時間">60分</td><td data-label="適用条件・補足">店舗オーナーと応相談</td></tr><tr><td data-label="罪状">逃走補助罪</td><td data-label="罰金">逃走補助をした犯罪の半額</td><td data-label="保護観察時間">30分</td><td data-label="適用条件・補足">個人医のみ適用</td></tr><tr><td data-label="罪状">セクハラ / カスハラ / パワハラ / 暴言</td><td data-label="罰金">10,000,000,000円</td><td data-label="保護観察時間">1日</td><td data-label="適用条件・補足">—</td></tr><tr><td data-label="罪状">公然わいせつ罪</td><td data-label="罰金">100円</td><td data-label="保護観察時間">24時間</td><td data-label="適用条件・補足">—</td></tr><tr><td data-label="罪状">詐欺罪</td><td data-label="罰金">25,000,000円</td><td data-label="保護観察時間">15分</td><td data-label="適用条件・補足">—</td></tr></tbody></table><p>適用された罪状、金額、保護観察時間はPDの説明を確認してください。表の「—」は時間や補足の指定がない欄で、独自の時間を補うものではありません。</p><p>プレイヤー本人へのハラスメントなどは、サーバールール違反として運営が対応する場合もあります。</p></section>
<section id="penalties-heist-fines"><h2>Heistの罰金と保護観察</h2><table><caption>Heistの罰金と保護観察</caption><thead><tr><th>分類</th><th>罰金</th><th>保護観察時間</th></tr></thead><tbody><tr><td data-label="分類">小型</td><td data-label="罰金">1,400,000円</td><td data-label="保護観察時間">15分</td></tr><tr><td data-label="分類">準中型チェイス</td><td data-label="罰金">7,000,000円</td><td data-label="保護観察時間">30分</td></tr><tr><td data-label="分類">準中型撃ち合い</td><td data-label="罰金">12,000,000円</td><td data-label="保護観察時間">30分</td></tr><tr><td data-label="分類">中型</td><td data-label="罰金">40,000,000円</td><td data-label="保護観察時間">45分</td></tr><tr><td data-label="分類">大型</td><td data-label="罰金">80,000,000円</td><td data-label="保護観察時間">60分</td></tr></tbody></table><p>適用された分類と処分は、PDの説明を確認してください。サーバールール違反への警告・キック・BANなどは、運営が対応します。</p></section>
<section id="penalties-impound"><h2>インパウンドの回収料金と待機</h2><table><caption>インパウンドの回収料金と押収時間</caption><thead><tr><th>区分</th><th>料金</th><th>押収時間</th></tr></thead><tbody><tr><td data-label="区分">一般</td><td data-label="料金">500,000円</td><td data-label="押収時間">0分</td></tr><tr><td data-label="区分">犯罪</td><td data-label="料金">1,000,000円</td><td data-label="押収時間">0分</td></tr></tbody></table><p>回収区分と料金を確認して手続きを進めてください。</p></section>
<section id="law-police-station-attack"><h2>警察署襲撃の定義と対象範囲</h2><p>警察署に対して、武力または車両などを用いて攻撃し、警察業務などを妨害する行為を、警察署襲撃とします。</p><p>本署・砂漠署・北署の対象範囲は、以下の赤枠を確認してください。</p><figure class="rule-image"><a href="../assets/law-police-main.png" target="_blank" rel="noopener noreferrer"><img src="../assets/law-police-main.png" alt="本署の警察署襲撃対象範囲（赤枠）" loading="lazy" decoding="async" style="max-width:100%;height:auto"></a><figcaption>本署の対象範囲</figcaption></figure><figure class="rule-image"><a href="../assets/law-police-sandy.png" target="_blank" rel="noopener noreferrer"><img src="../assets/law-police-sandy.png" alt="砂漠署の警察署襲撃対象範囲（赤枠）" loading="lazy" decoding="async" style="max-width:100%;height:auto"></a><figcaption>砂漠署の対象範囲</figcaption></figure><figure class="rule-image"><a href="../assets/law-police-paleto.png" target="_blank" rel="noopener noreferrer"><img src="../assets/law-police-paleto.png" alt="北署の警察署襲撃対象範囲（赤枠）" loading="lazy" decoding="async" style="max-width:100%;height:auto"></a><figcaption>北署の対象範囲</figcaption></figure></section>
<section id="weapons-crime-use"><h2>銃刀法違反の適用条件</h2><p>犯罪時に武器を所持していた場合は、銃刀法違反の対象になります。罰金と保護観察時間は「ゲーム内法律・基本罰金と保護観察」を確認してください。</p><p>武器を使う場面でも、RP上の理由のない攻撃や殺害は禁止です。</p></section>
<section id="pending-penalty-times"><h2>ゲーム内の処分を確認するとき</h2><p>ゲーム内法律の罰金や保護観察は、街の犯罪RPに対するPDの対応です。基本罰金・保護観察と、Heistの罰金・保護観察を確認してください。</p><p>処分を受けたときは、適用された罪状、支払う金額、保護観察時間の説明を確認しましょう。分からない点はPDへ尋ねて大丈夫です。</p><p>サーバールール違反への警告・キック・BANなどは運営が対応します。ゲーム内で罰金を支払ったことだけで、ルール違反への運営対応が終わるわけではありません。</p></section>
<section id="pd-community-service"><h2>社会奉仕活動について</h2><p>NicoGuraには、プリズンに代わる、拘束されない社会奉仕活動の制度があります。期間中は犯罪などが制限されます。</p><p>適用された期間や制限の内容は、PDの説明を確認してください。罪状ごとの保護観察時間は「法律と罰金」で確認できます。</p></section><p><a href="https://discord.gg/Fzhhp34JJy">公式Discord</a> / <a href="https://x.com/NicoGura0810">公式X</a></p><p>検索・保存機能にはJavaScriptを有効にしてください。</p></div></noscript>
