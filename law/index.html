    <noscript><div class="noscript"><h1>法律・罰金</h1><p>PDが扱うゲーム内の法律、罰金、刑期、インパウンドの基準を検索できます。</p><p>最終更新 2026-10-10</p><nav><a href="../">NicoGura | にこぐら 公式ルール・参加ガイド</a> / <a href="../rules/">公式ルール</a> / <a href="../join/">参加方法</a> / <a href="../character/">キャラクター</a> / <a href="../economy/">経済・料金</a> / <a href="../crime/">犯罪RP</a> / <a href="../law/">法律・罰金</a> / <a href="../guides/">街ガイド</a> / <a href="../pd/">PD・警察</a> / <a href="../ems/">EMS・救急</a> / <a href="../mechanic/">メカニック</a> / <a href="../shops/">店舗</a> / <a href="../lifejobs/">Life Job</a> / <a href="../gangs/">ギャング</a> / <a href="../faq/">よくある質問</a> / <a href="../contact/">お問い合わせ</a></nav><section><h2>銃刀法違反と武器の所持</h2><p>武器を犯罪に使用した時点で、銃刀法違反の対象になります。罰金は1,500,000円、刑務は5分です。所持のみは無罪です。</p><p>武器を使う場面でも、RP上の理由のない攻撃や殺害は禁止です。相手のRPや街の生活を大切にして遊びましょう。</p></section>
<section><h2>ゲーム内法律・基本罰金と刑務</h2><p>犯罪RPをすること自体はNicoGuraのゲームコンテンツです。ゲーム内の法律違反には、PD対応、罰金、刑務、押収、インパウンドなどがあります。</p><table><caption>ゲーム内法律・基本罰金と刑務</caption><thead><tr><th>罪状</th><th>罰金</th><th>刑務</th><th>補足</th></tr></thead><tbody><tr><td data-label="罪状">銃刀法違反</td><td data-label="罰金">1,500,000円</td><td data-label="刑務">5分</td><td data-label="補足">犯罪利用をした時点。所持のみは無罪。</td></tr><tr><td data-label="罪状">誘拐拉致監禁罪</td><td data-label="罰金">1,500,000円</td><td data-label="刑務">0分</td><td data-label="補足"></td></tr><tr><td data-label="罪状">NPC殺人罪</td><td data-label="罰金">2,500,000円</td><td data-label="刑務">5分</td><td data-label="補足"></td></tr><tr><td data-label="罪状">プレイヤー殺人・未遂罪</td><td data-label="罰金">10,000,000円</td><td data-label="刑務">10分</td><td data-label="補足"></td></tr><tr><td data-label="罪状">窃盗罪</td><td data-label="罰金">1,000,000円</td><td data-label="刑務">10分</td><td data-label="補足"></td></tr><tr><td data-label="罪状">重窃盗罪</td><td data-label="罰金">1,000,000,000円</td><td data-label="刑務">60分</td><td data-label="補足"></td></tr><tr><td data-label="罪状">公務執行妨害罪</td><td data-label="罰金">2,000,000円</td><td data-label="刑務">5分</td><td data-label="補足"></td></tr><tr><td data-label="罪状">テロ罪</td><td data-label="罰金">100,000,000円</td><td data-label="刑務">12時間</td><td data-label="補足"></td></tr><tr><td data-label="罪状">汚職収賄罪</td><td data-label="罰金">100,000,000円</td><td data-label="刑務">60分</td><td data-label="補足"></td></tr><tr><td data-label="罪状">業務妨害罪</td><td data-label="罰金">10,000,000～100,000,000円</td><td data-label="刑務">60分</td><td data-label="補足">店舗オーナーと応相談。</td></tr><tr><td data-label="罪状">逃走補助罪</td><td data-label="罰金">報酬金額（1人）の半額</td><td data-label="刑務">30分</td><td data-label="補足">個人医のみ適用。</td></tr><tr><td data-label="罪状">セクハラ / カスハラ / パワハラ / 暴言</td><td data-label="罰金">10,000,000,000円</td><td data-label="刑務">1日</td><td data-label="補足"></td></tr></tbody></table><p>業務妨害罪の金額は、掲載範囲で店舗オーナーと相談します。逃走補助罪は個人医のみ適用です。適用された罪状や金額、刑務時間はPDに説明を確認してください。</p><p>RP上の対立・口論と、プレイヤー本人への攻撃は区別します。プレイヤーへのハラスメントなど、サーバールール違反は運営対応の対象にもなります。</p></section>
<section><h2>ゲーム内の処分を確認するとき</h2><p>ゲーム内法律の罰金や刑務は、街の犯罪RPに対するPDの対応です。基本罰金・刑務と、Heistの罰金・刑務を確認してください。</p><p>処分を受けたときは、適用された罪状、支払う金額、刑務時間の説明を確認しましょう。分からない点はPDへ尋ねて大丈夫です。</p><p>サーバールール違反への警告・キック・BANなどは運営が対応します。ゲーム内で罰金を支払ったことだけで、ルール違反への運営対応が終わるわけではありません。</p></section>
<section><h2>Heistのゲーム内罰金・刑務</h2><table><caption>Heist基準のゲーム内罰金・刑務</caption><thead><tr><th>分類</th><th>罰金</th><th>刑務</th></tr></thead><tbody><tr><td data-label="分類">小型強盗</td><td data-label="罰金">1,400,000円</td><td data-label="刑務">15分</td></tr><tr><td data-label="分類">準中型チェイス</td><td data-label="罰金">7,000,000円</td><td data-label="刑務">30分</td></tr><tr><td data-label="分類">準中型撃ち合い</td><td data-label="罰金">12,000,000円</td><td data-label="刑務">30分</td></tr><tr><td data-label="分類">中型ヘイスト</td><td data-label="罰金">40,000,000円</td><td data-label="刑務">45分</td></tr><tr><td data-label="分類">大型ヘイスト</td><td data-label="罰金">80,000,000円</td><td data-label="刑務">60分</td></tr></tbody></table><p>ゲーム内犯罪に対するPDの罰金・刑務です。適用された分類と処分の説明を確認してください。</p><p>サーバールール違反への警告・キック・BANなどは、運営が対応します。</p></section>
<section><h2>インパウンドの回収料金と待機</h2><table><caption>インパウンド</caption><thead><tr><th>回収区分</th><th>料金</th><th>待機</th></tr></thead><tbody><tr><td data-label="回収区分">一般回収</td><td data-label="料金">500,000円</td><td data-label="待機">0分</td></tr><tr><td data-label="回収区分">犯罪回収</td><td data-label="料金">1,000,000円</td><td data-label="待機">30分</td></tr></tbody></table><p>回収区分と料金、待機時間を確認して手続きを進めてください。</p></section><p><a href="https://discord.gg/Fzhhp34JJy">公式Discord</a> / <a href="https://x.com/NicoGura0810">公式X</a></p><p>検索・保存機能にはJavaScriptを有効にしてください。</p></div></noscript>
