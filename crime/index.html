    <noscript><div class="noscript"><h1>犯罪RP</h1><p>犯罪RPの考え方、規模ごとの基準報酬、犯罪一覧。みんなが楽しめるシーンを大切にしましょう。</p><p>最終更新 2026-10-10</p><nav><a href="../">NicoGura | にこぐら 公式ルール・参加ガイド</a> / <a href="../rules/">公式ルール</a> / <a href="../join/">参加方法</a> / <a href="../character/">キャラクター</a> / <a href="../economy/">経済・料金</a> / <a href="../crime/">犯罪RP</a> / <a href="../law/">法律・罰金</a> / <a href="../guides/">街ガイド</a> / <a href="../pd/">PD・警察</a> / <a href="../ems/">EMS・救急</a> / <a href="../mechanic/">メカニック</a> / <a href="../shops/">店舗</a> / <a href="../lifejobs/">Life Job</a> / <a href="../gangs/">ギャング</a> / <a href="../faq/">よくある質問</a> / <a href="../contact/">お問い合わせ</a></nav><section><h2>犯罪の公開報酬基準</h2><table><caption>犯罪の基準報酬</caption><thead><tr><th>分類</th><th>基準条件</th><th>1人の報酬</th></tr></thead><tbody><tr><td data-label="分類">小型</td><td data-label="基準条件">1人報酬基準</td><td data-label="1人の報酬">8,000,000円</td></tr><tr><td data-label="分類">準中型チェイス</td><td data-label="基準条件">1人報酬基準</td><td data-label="1人の報酬">15,000,000円</td></tr><tr><td data-label="分類">準中型撃ち合い</td><td data-label="基準条件">6人時・1人あたり</td><td data-label="1人の報酬">35,000,000円</td></tr><tr><td data-label="分類">中型</td><td data-label="基準条件">8人時・1人あたり</td><td data-label="1人の報酬">70,000,000円</td></tr><tr><td data-label="分類">大型</td><td data-label="基準条件">15人時・1人あたり</td><td data-label="1人の報酬">120,000,000円</td></tr></tbody></table><p>この表は基準報酬の案内です。「6人時」「8人時」「15人時」は報酬の基準条件であり、参加上限や開始に必要な人数を決めるものではありません。</p><p>犯罪を計画するときは、種類の一覧とゲーム内法律の罰金・刑務も確認しましょう。</p></section>
<section><h2>犯罪・Heistの種類</h2><table><caption>犯罪一覧</caption><thead><tr><th>分類</th><th>犯罪・Heist</th></tr></thead><tbody><tr><td data-label="分類">小型</td><td data-label="犯罪・Heist">コンビニ強盗、ATM強盗、空き巣</td></tr><tr><td data-label="分類">準中型チェイス</td><td data-label="犯罪・Heist">フリーカ強盗、現金両替強盗、クレーン強盗、ブースティング A / S</td></tr><tr><td data-label="分類">準中型撃ち合い</td><td data-label="犯罪・Heist">コインランドリー、ヴァンジェリコ、列車強盗、パージ強盗</td></tr><tr><td data-label="分類">中型</td><td data-label="犯罪・Heist">客船、飛行場襲撃、ボブキャット、パレト、貨物船強盗、ヒューマンラボ、美術館強盗、金庫強盗</td></tr><tr><td data-label="分類">大型</td><td data-label="犯罪・Heist">アーティファクト、ユニオンヘイスト、カジノヘイスト、パシフィック、マウンテン・ボルト、アンダーグラウンド・ヘイスト、警察署襲撃、メイズバンク</td></tr><tr><td data-label="分類">PDなし犯罪</td><td data-label="犯罪・Heist">自動販売機強盗、ポストロッカー強盗、ブースティング D / C / B</td></tr></tbody></table><p>犯罪RPも街の遊び方の一つです。サーバールールを守りながら、仲間や警察とのシーンを楽しみましょう。</p></section>
<section><h2>犯罪・Heistを始める前に</h2><p>犯罪RPはNicoGuraのゲームコンテンツです。街の仲間と計画し、警察とのやり取りやシーンを楽しみましょう。</p><p>犯罪一覧で分類を確認し、公開報酬基準とゲーム内法律の罰金・刑務を読みましょう。開始に必要な参加人数やPD人数などは、ゲーム内の案内を確認してください。</p><p>報酬表の「6人時」「8人時」「15人時」は報酬の基準条件です。その数値だけで参加上限や開始条件を決めないでください。</p></section>
<section><h2>シーンから逃れるために退出しない</h2><p>警察対応、犯罪、戦闘、交渉、その他進行中のRPの結果を避けたり、不利な状況をリセットしたりする目的で、故意に退出・切断しないでください。</p><p>クラッシュ、回線落ち、FiveMエラーなどの不可抗力は区別します。可能であれば再接続してRPを続け、関係者へ状況を伝えてください。戻れない場合は、可能になった時点でDiscordの「お問い合わせ窓口」へ連絡してください。</p></section>
<section><h2>ダウン中に戦況を伝えて有利にしない</h2><p>自分がダウンしている間に戦況を共有し、生きている仲間を有利にしないでください。ゲーム内の会話や無線、外部VCなど、連絡手段にかかわらず同じです。</p><p>RP上自然な会話まで完全に禁止するものではありません。復帰直後に同じ戦闘へ戻ることについては「復帰直後に同じ戦闘へ戻らない」を確認してください。</p></section>
<section><h2>復帰直後に同じ戦闘へ戻らない</h2><p>蘇生や復帰を使って、同じ戦闘へ繰り返し参加しないでください。まず治療や身柄の扱いなど、その場の案内を確認してください。</p><p>クラッシュからの再接続は、ダウンからの復帰とは区別します。再開方法が分からない場合は運営へ相談してください。独自の待機時間や記憶喪失の条件をこの案内で追加するものではありません。</p></section>
<section><h2>関係のないシーンを不正に壊さない</h2><p>当事者とゲーム内での関わりがない場面へ、ゲーム外の情報を頼りに加勢したり、無関係な攻撃で結末を変えたりする行為は禁止です。</p><p>通りかかること、通常の通報や救護まで一律に禁止するものではありません。助けに入るときは、その場の安全とゲーム内での関わりを確認してください。</p></section>
<section><h2>案内された参加制限を確認しよう</h2><p>参加できる活動や適用期間など、実際に案内された制限の範囲を確認してください。制限を回避する目的で、別のアカウントや立場を使わないでください。</p><p>自分に適用される内容が分からない場合は、PDや運営へ確認してください。ここでは一律の期間や条件を設けていません。</p></section>
<section><h2>Heistの重複・リセットを悪用しない</h2><p>正常な進行から外れて二重に報酬を受け取ったり、失敗や制限を不正に消したりしないでください。不具合に気づいたら追加利用を止め、Discordの「お問い合わせ窓口」へ状況を報告してください。</p></section><p><a href="https://discord.gg/Fzhhp34JJy">公式Discord</a> / <a href="https://x.com/NicoGura0810">公式X</a></p><p>検索・保存機能にはJavaScriptを有効にしてください。</p></div></noscript>
