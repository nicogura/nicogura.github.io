    <noscript><div class="noscript"><h1>犯罪RP</h1><p>犯罪RPの考え方、規模ごとの基準報酬、犯罪一覧。みんなが楽しめるシーンを大切にしましょう。</p><p>最終更新 2026-11-02</p><nav><a href="../">NicoGura | にこぐら 公式ルール・参加ガイド</a> / <a href="../rules/">公式ルール</a> / <a href="../join/">参加方法</a> / <a href="../server/">サーバー情報</a> / <a href="../mods/">MOD・グリッチ</a> / <a href="../character/">キャラクター</a> / <a href="../economy/">経済・料金</a> / <a href="../crime/">犯罪RP</a> / <a href="../law/">法律・罰金</a> / <a href="../guides/">にこぐらガイド</a> / <a href="../pd/">PD・警察</a> / <a href="../ems/">EMS・救急</a> / <a href="../mechanic/">メカニック</a> / <a href="../shops/">店舗</a> / <a href="../lifejobs/">Life Job</a> / <a href="../gangs/">ギャング</a> / <a href="../faq/">よくある質問</a> / <a href="../contact/">お問い合わせ</a></nav><section id="crime-scene-conduct"><h2>犯罪シーン中の共通ルール</h2><ul><li>チェイス中に車両をガレージへ入れないでください。</li><li>犯罪シーン中は、車両・ヘリを修理しないでください。</li><li>ヘイストネットワークから参加していない人が、後からシーンへ参加することは禁止です。</li><li>終了した犯罪シーンへ復帰しないでください。</li></ul></section>
<section id="crime-current-list"><h2>犯罪カテゴリ・参加人数</h2><table><caption>犯罪カテゴリ・参加人数</caption><thead><tr><th>分類</th><th>犯罪名・区分</th><th>犯罪者側</th><th>PD側</th><th>補足</th></tr></thead><tbody><tr><td data-label="分類">小型</td><td data-label="犯罪名・区分">通常</td><td data-label="犯罪者側">2人</td><td data-label="PD側">2～3人</td><td data-label="補足"></td></tr><tr><td data-label="分類">小型</td><td data-label="犯罪名・区分">ATM</td><td data-label="犯罪者側">1人</td><td data-label="PD側">2～3人</td><td data-label="補足"></td></tr><tr><td data-label="分類">準中型（チェイス）</td><td data-label="犯罪名・区分">通常</td><td data-label="犯罪者側">1～2人</td><td data-label="PD側">2～4人</td><td data-label="補足"></td></tr><tr><td data-label="分類">準中型（チェイス）</td><td data-label="犯罪名・区分">クレーン強盗</td><td data-label="犯罪者側">2～3人</td><td data-label="PD側">3～4人</td><td data-label="補足"></td></tr><tr><td data-label="分類">準中型（チェイス）</td><td data-label="犯罪名・区分">現金交換所</td><td data-label="犯罪者側">1～2人</td><td data-label="PD側">2～4人</td><td data-label="補足"></td></tr><tr><td data-label="分類">準中型（撃ち合い）</td><td data-label="犯罪名・区分">通常</td><td data-label="犯罪者側">3～6人</td><td data-label="PD側">5～10人</td><td data-label="補足"></td></tr><tr><td data-label="分類">中型</td><td data-label="犯罪名・区分">通常</td><td data-label="犯罪者側">4～8人</td><td data-label="PD側">6～12人</td><td data-label="補足"></td></tr><tr><td data-label="分類">大型</td><td data-label="犯罪名・区分">通常</td><td data-label="犯罪者側">8～15人</td><td data-label="PD側">12～20人</td><td data-label="補足">ギャング限定</td></tr><tr><td data-label="分類">無人犯罪</td><td data-label="犯罪名・区分">通常</td><td data-label="犯罪者側">1人</td><td data-label="PD側">0人</td><td data-label="補足"></td></tr></tbody></table><p>犯罪は表の人数の範囲内で行ってください。犯罪者側の人数とPD側の人数を混同しないようにしてください。</p></section>
<section id="crime-helicopter-limits"><h2>犯罪シーンのヘリ台数</h2><table><caption>犯罪者側のヘリ最大台数</caption><thead><tr><th>分類・犯罪</th><th>最大台数</th></tr></thead><tbody><tr><td data-label="分類・犯罪">小型</td><td data-label="最大台数">使用不可</td></tr><tr><td data-label="分類・犯罪">準中型（チェイス）</td><td data-label="最大台数">使用不可</td></tr><tr><td data-label="分類・犯罪">準中型（撃ち合い）</td><td data-label="最大台数">1台</td></tr><tr><td data-label="分類・犯罪">密輸バージ</td><td data-label="最大台数">4台</td></tr><tr><td data-label="分類・犯罪">中型</td><td data-label="最大台数">2台</td></tr><tr><td data-label="分類・犯罪">空母襲撃・海上油田・貨物船強盗</td><td data-label="最大台数">5台</td></tr><tr><td data-label="分類・犯罪">大型</td><td data-label="最大台数">3台</td></tr></tbody></table><p>PD側は、犯罪者側のヘリ台数に1台を加えた台数まで使用できます。</p><p>密輸バージ・空母襲撃・海上油田・貨物船強盗は、通常の分類より3台多い上限です。表の台数は1事件の最大台数であり、犯罪者側はこの上限を超えないでください。</p></section>
<section id="crime-scene-colors"><h2>犯罪シーンではカラーを揃える</h2><p>犯罪シーンでは、服装と車両のカラーを揃えてください。盗難車も対象です。</p><p>近似色や、黒・白・グレーの使用は認められません。カラーの判断に迷う場合は、PDへ確認してください。</p></section>
<section id="crime-scene-end"><h2>犯罪シーンが終了する条件</h2><p>PDを振り切ってから5分が経過すると、犯罪シーンの終了とみなします。</p><ul><li>PDのサイレンが聞こえず、PDヘリも見えなくなった状態。</li><li>服装や車両などから、犯人と断定できなくなった状態。</li></ul><p>PDが犯人を見失ってから10分以内の現行犯逮捕については、「すべての犯罪で有効な対応」も確認してください。シーンの終了と現行犯逮捕の条件は別に定めています。</p></section>
<section id="crime-chase-demands"><h2>チェイス犯罪で有効な対応</h2><p>人質の解放条件として要求できる内容は、最大2項目までです。人質がNPCでもプレイヤーでも、条件は変わりません。</p><p>要求によってチェイスそのものが成立しなくなる場合などは、PD側が要求を断ることができます。ルールだけを機械的に適用せず、お互いが楽しめるよう、その場の雰囲気や状況を大切にしてください。</p><h3>PDが要求を断ることができる例</h3><ul><li>犯人側が高速車両を使っているのに、PD側へ「自転車のみ使用可能」と要求する場合。正常なチェイスが成立しないため、PDは断ることができます。</li><li>犯人側がニトロを使えるのに、PD側へ「ニトロ使用禁止」と要求する場合。直線を走るだけで一方的に逃走できてしまうため、PDは断ることができます。</li></ul></section>
<section id="crime-chase-attack-window"><h2>チェイス犯罪のアタック禁止時間</h2><table><caption>車両の取得方法とアタック禁止時間</caption><thead><tr><th>車両</th><th>アタック禁止時間</th></tr></thead><tbody><tr><td data-label="車両">プレイヤー所有車（借りた車両を含む）</td><td data-label="アタック禁止時間">1分</td></tr><tr><td data-label="車両">盗難車両</td><td data-label="アタック禁止時間">3分</td></tr></tbody></table><p>この時間を超える要求はできません。ただし、クレーン強盗はアタック禁止時間に加えて2分まで要求できます。</p><h3>PDが定めるラインより上位のチェイス犯罪</h3><ul><li>ネタ犯罪は禁止です。</li><li>アタック禁止時間は1分です。</li><li>有人・無人を問わず、同じ条件を適用します。</li></ul></section>
<section id="crime-common-response"><h2>すべての犯罪で有効な対応</h2><h3>犯罪現場周辺での職務質問</h3><p>PDは、犯罪現場周辺にいる住民に職務質問を行うことができます。職務質問を受けた方は、応じる必要があります。</p><h3>犯人を見失った後の現行犯逮捕</h3><p>PDが犯人を一度見失った場合でも、見失ってから10分以内であれば、現行犯として逮捕することができます。</p></section>
<section id="crime-bug-response"><h2>犯罪中に不具合が発生した場合</h2><p>不具合などで犯罪の進行が不可能になった場合は、速やかにPDへ連絡し、シーンを一時中断してください。</p><p>PDが現場へ向かい、不具合の状況を確認したうえで、リセットできるか判断します。</p><p>進行不能と判断された事件では、状況確認のために犯罪者側へボディカメラの提出を求める場合があります。</p><p>リセット前に「不具合リセット前の選択」を確認してください。</p></section>
<section id="crime-bug-options"><h2>不具合リセット前の選択</h2><p>不具合リセットを行う前に、PDは犯罪者側へ今後の進行を確認してください。犯罪者側は、次のいずれかを選択します。</p><h3>① リセットして再実行</h3><p>不具合リセット後、同じ犯罪を最初から再度実行します。この選択をした場合は、必ず同じ犯罪を実行してください。</p><h3>② そのまま続行</h3><ul><li>犯罪者側から、金品を所持している想定となる1〜2名を選出します。</li><li>PDから開始の連絡があった後、指定された時間を「回収フェーズ」とします。</li><li>回収フェーズ中、選出された対象者はその場で手を上げて待機してください。</li><li>指定時間が終了した後は「逃走フェーズ」となり、逃走して構いません。</li></ul><h3>③ 中断</h3><p>その犯罪を中断します。中断後は、他の犯罪者が同じ犯罪を実行できる状態にしてください。</p><p>一度リセットして再実行した後に再び不具合が発生した場合は、②そのまま続行・③中断のどちらかを選択してください。</p><p>不具合があった犯罪の成功後に補填を申請する場合は、チケットを発行し、ボディカメラを提出してください。ボディカメラの提出がない場合は補填できません。</p></section>
<section id="crime-bug-recurrence"><h2>再度不具合が発生した場合</h2><p>一度不具合リセットを行い、再実行後に再び不具合が発生した場合は、「そのまま続行」か「中断」のどちらかを選択してください。各選択の進め方は「不具合リセット前の選択」を確認してください。</p><p>2回目以降は、再度リセットして最初からやり直す選択はできません。</p></section>
<section id="crime-restart-window"><h2>再起動前後の犯罪について</h2><table><caption>再起動前後の犯罪禁止時間</caption><thead><tr><th>再起動の種類</th><th>犯罪禁止時間・確認事項</th></tr></thead><tbody><tr><td data-label="再起動の種類">定期再起動</td><td data-label="犯罪禁止時間・確認事項">前30分 / サーバー再開後30分</td></tr><tr><td data-label="再起動の種類">緊急再起動</td><td data-label="犯罪禁止時間・確認事項">サーバー再開後15分</td></tr><tr><td data-label="再起動の種類">その他の再起動</td><td data-label="犯罪禁止時間・確認事項">街からのアナウンスを確認</td></tr></tbody></table><h3>定期再起動</h3><p>定期再起動の30分前から再起動まで、およびサーバー再開後30分間は、犯罪行為を禁止します。新たな犯罪の開始だけでなく、この時間帯に犯罪行為を続けることも禁止です。</p><p>再起動時間をまたぐ可能性が高い犯罪も行わないでください。開始できる時刻でも、再起動前の犯罪禁止時間にかからないか、事前に確認しましょう。</p><h3>緊急再起動</h3><p>緊急再起動の場合は、サーバー再開後15分間、犯罪行為を禁止します。緊急再起動は予告なしに発生する場合があります。</p><h3>その他の再起動・個別の案内</h3><p>メンテナンス、臨時再起動、特殊な再起動等については、街からのアナウンスを確認してください。</p><p>運営から個別の犯罪開始時刻が案内された場合は、その案内を優先してください。最新情報は公式Discordの「街からのお知らせ」等で確認できます。</p></section>
<section id="crime-combat-log"><h2>シーンから逃れるために退出しない</h2><p>警察対応、犯罪、戦闘、交渉、その他進行中のRPの結果を避けたり、不利な状況をリセットしたりする目的で、故意に退出・切断しないでください。</p><p>クラッシュ、回線落ち、FiveMエラーなどの不可抗力は区別します。可能であれば再接続してRPを続け、関係者へ状況を伝えてください。戻れない場合は、可能になった時点でDiscordの「お問い合わせ窓口」へ連絡してください。</p></section>
<section id="crime-down-information"><h2>ダウン中に戦況を伝えて有利にしない</h2><p>自分がダウンしている間に戦況を共有し、生きている仲間を有利にしないでください。ゲーム内の会話や無線、外部VCなど、連絡手段にかかわらず同じです。</p><p>RP上自然な会話まで完全に禁止するものではありません。復帰直後に同じ戦闘へ戻ることについては「復帰直後に同じ戦闘へ戻らない」を確認してください。</p></section>
<section id="crime-rejoin-combat"><h2>ゾンビ行為をしない</h2><p>ダウンから蘇生・復帰した後、同じ戦闘へ戻って再参加する行為は禁止です。治療や身柄の扱いは、その場の案内に従ってください。</p><p>クラッシュからの再接続は、ダウンからの復帰と区別します。再開方法が分からない場合は運営へ相談してください。</p></section>
<section id="crime-third-party"><h2>関係のないシーンを不正に壊さない</h2><p>当事者とゲーム内での関わりがない場面へ、ゲーム外の情報を頼りに加勢したり、無関係な攻撃で結末を変えたりする行為は禁止です。</p><p>通りかかること、通常の通報や救護まで一律に禁止するものではありません。助けに入るときは、その場の安全とゲーム内での関わりを確認してください。</p></section>
<section id="crime-probation"><h2>案内された参加制限を確認しよう</h2><p>社会奉仕・保護観察の期間中は、犯罪などが制限されます。参加できる活動と適用期間を確認し、制限に従ってください。</p><p>別のアカウントや立場を使って制限を回避しないでください。自分に適用される内容が分からない場合は、PDや運営へ確認してください。</p></section>
<section id="heist-duplicate"><h2>Heistの重複・リセットを悪用しない</h2><p>報酬が二重に取れた場合や、本来の挙動と異なる結果になった場合は、追加利用を止め、チケットでお問い合わせください。事実を隠さないでください。</p><p>報酬や進行を不正に重複させたり、失敗や制限を不正なリセットで消したりする行為は禁止です。</p><p>PDの確認を受けた正規の不具合対応は、不正なリセットと区別します。「犯罪中に不具合が発生した場合」を確認してください。</p></section>
<section id="vehicles-crime-banned"><h2>犯罪禁止車両を犯罪に利用しない</h2><p>車両に乗ったときに「犯罪禁止車両」と表示される車両を、犯罪に利用することは禁止です。</p></section>
<section id="vehicles-job-crime"><h2>JOB専用車両を犯罪に利用しない</h2><p>PD・EMS・タクシー・バスなど、JOB専用として用意されている車両を犯罪行為に利用することは禁止します。</p><p>対象は、JOBの業務用として用意された専用車両です。通常の市販車や個人所有車まで、このルールで一律に禁止するものではありません。</p></section>
<section id="vehicles-emergency-use"><h2>PD・EMS専用車両を無断で使用・窃盗しない</h2><p>PD・EMS専用車両を、権限のない市民が無断で使用・窃盗する行為は禁止します。</p><p>PD・EMSの緊急車両や公務用車両を、単なる移動手段として無断利用することも禁止です。</p></section>
<section id="crime-cruise-control"><h2>犯罪シーン中のクルーズコントロール禁止</h2><p>犯罪シーン中にクルーズコントロールを使用することは禁止です。</p></section>
<section id="pending-crime-conditions"><h2>犯罪・Heistを始める前に</h2><p>犯罪RPはNicoGuraのゲームコンテンツです。街の仲間と計画し、警察とのやり取りやシーンを楽しみましょう。</p><p>「犯罪カテゴリ・参加人数」で犯罪側の最低人数・最大人数を確認し、公開報酬基準とゲーム内法律の罰金・保護観察を読みましょう。その他の開始条件は、ゲーム内の案内を確認してください。</p><p>報酬表の「6人時」「8人時」「15人時」は報酬の基準条件です。犯罪側の参加人数は「犯罪カテゴリ・参加人数」の一覧を確認してください。</p></section>
