    <noscript><div class="noscript"><h1>EMS・救急</h1><p>治療、蘇生、搬送と救急対応を担うEMS。困ったときの案内と治療料金をまとめています。</p><p>最終更新 2026-10-13</p><nav><a href="../">NicoGura | にこぐら 公式ルール・参加ガイド</a> / <a href="../rules/">公式ルール</a> / <a href="../join/">参加方法</a> / <a href="../server/">サーバー情報</a> / <a href="../mods/">MOD・グリッチ</a> / <a href="../character/">キャラクター</a> / <a href="../economy/">経済・料金</a> / <a href="../crime/">犯罪RP</a> / <a href="../law/">法律・罰金</a> / <a href="../guides/">街ガイド</a> / <a href="../pd/">PD・警察</a> / <a href="../ems/">EMS・救急</a> / <a href="../mechanic/">メカニック</a> / <a href="../shops/">店舗</a> / <a href="../lifejobs/">Life Job</a> / <a href="../gangs/">ギャング</a> / <a href="../faq/">よくある質問</a> / <a href="../contact/">お問い合わせ</a></nav><section><h2>ダウンしたら救護要請を送ろう</h2><p>ダウン画面でGキーを押すと救護要請を送れます。キー割り当てを変更している場合は、対応するキーを使ってください。画面の受付通知を確認しましょう。</p><p>EMSは治療・蘇生・搬送・救急対応を担当します。現場の安全確認が必要なこともあるため、案内を待ち、分かる範囲で状況を伝えてください。</p><p>EMS不在時にはNPC救急などを利用できる場合があります。利用方法はゲーム内の案内を確認してください。</p></section>
<section><h2>EMSの救急対応について</h2><p>EMSは治療、蘇生、搬送、救急対応を担当します。現場の状況を確認し、安全を確保しながら対応します。</p><p>医療サービスの種類と料金を確認し、対応内容が分からないときは担当者に聞いてください。救護の権限や医療機能を不正な利益のために悪用する行為は禁止です。</p><p>治療や蘇生の後も、復帰直後に同じ戦闘へ戻って再参加する行為は禁止です。</p></section>
<section><h2>医療サービスの料金</h2><table><caption>医療サービス料金</caption><thead><tr><th>サービス</th><th>条件</th><th>価格</th></tr></thead><tbody><tr><td data-label="サービス">通常治療</td><td data-label="条件">負傷</td><td data-label="価格">300,000円</td></tr><tr><td data-label="サービス">院内蘇生</td><td data-label="条件">病院内</td><td data-label="価格">1,000,000円</td></tr><tr><td data-label="サービス">現場蘇生・搬送</td><td data-label="条件">救急現場</td><td data-label="価格">1,500,000円</td></tr><tr><td data-label="サービス">牢屋対応</td><td data-label="条件">犯罪対応</td><td data-label="価格">2,000,000円</td></tr><tr><td data-label="サービス">EMS不在時NPC治療</td><td data-label="条件">即時救済</td><td data-label="価格">1,000,000円</td></tr></tbody></table><p>治療の種類や対応場所が変わる場合は、担当者に内容と料金を確認してください。EMS不在時のNPC治療は、ゲーム内の利用案内に従ってください。</p></section>
<section><h2>包帯（EMS専売品）</h2><table><caption>包帯の価格と効果</caption><thead><tr><th>品目</th><th>価格</th><th>効果</th><th>販売区分</th></tr></thead><tbody><tr><td data-label="品目">包帯</td><td data-label="価格">250,000円</td><td data-label="効果">一時的な止血</td><td data-label="販売区分">EMS専売品</td></tr></tbody></table><p>包帯は完治ではありません。一時的に出血を抑えるもので、約3分程度で再び症状が出る場合があります。</p><p>怪我・症状を完治させるには、EMSによる治療を受けてください。</p></section>
<section><h2>鎮痛剤（EMS専売品）</h2><table><caption>鎮痛剤の価格と効果</caption><thead><tr><th>品目</th><th>価格</th><th>効果</th><th>販売区分</th></tr></thead><tbody><tr><td data-label="品目">鎮痛剤</td><td data-label="価格">250,000円</td><td data-label="効果">痛み・症状の一時的な緩和</td><td data-label="販売区分">EMS専売品</td></tr></tbody></table><p>鎮痛剤は完治ではありません。一時的に症状を緩和するもので、約3分程度で再び症状が出る場合があります。</p><p>怪我・症状を完治させるには、EMSによる治療を受けてください。</p></section>
<section><h2>IFAK（EMS専売品）</h2><table><caption>IFAKの価格と効果</caption><thead><tr><th>品目</th><th>価格</th><th>効果</th><th>販売区分</th></tr></thead><tbody><tr><td data-label="品目">IFAK</td><td data-label="価格">200,000円</td><td data-label="効果">体力25％回復のみ</td><td data-label="販売区分">EMS専売品</td></tr></tbody></table><p>IFAKは体力回復用の応急処置用品です。怪我や症状を完全に治療するものではありません。</p><p>怪我・症状を完治させるには、EMSによる治療を受けてください。</p></section>
<section><h2>PD・EMS専用車両を無断で使用・窃盗しない</h2><p>PD・EMS専用車両を、権限のない市民が無断で使用・窃盗する行為は禁止します。</p><p>PD・EMSの緊急車両や公務用車両を、単なる移動手段として無断利用することも禁止です。</p></section>
<section><h2>JOB専用車両を犯罪に利用しない</h2><p>PD・EMS・タクシー・バスなど、JOB専用として用意されている車両を犯罪行為に利用することは禁止します。</p><p>対象は、JOBの業務用として用意された専用車両です。通常の市販車や個人所有車まで、このルールで一律に禁止するものではありません。</p></section><p><a href="https://discord.gg/Fzhhp34JJy">公式Discord</a> / <a href="https://x.com/NicoGura0810">公式X</a></p><p>検索・保存機能にはJavaScriptを有効にしてください。</p></div></noscript>
