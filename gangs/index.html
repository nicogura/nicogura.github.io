    <noscript><div class="noscript"><h1>ギャング</h1><p>仲間と楽しむギャング活動。結成費用と、街の共通ルールを確認しましょう。</p><p>最終更新 2026-11-05</p><nav><a href="../">NicoGura | にこぐら 公式ルール・参加ガイド</a> / <a href="../rules/">公式ルール</a> / <a href="../join/">参加方法</a> / <a href="../server/">サーバー情報</a> / <a href="../mods/">MOD・グリッチ</a> / <a href="../character/">キャラクター</a> / <a href="../economy/">経済・料金</a> / <a href="../crime/">犯罪RP</a> / <a href="../law/">法律・罰金</a> / <a href="../guides/">にこぐらガイド</a> / <a href="../pd/">PD・警察</a> / <a href="../ems/">EMS・救急</a> / <a href="../mechanic/">メカニック</a> / <a href="../shops/">店舗</a> / <a href="../lifejobs/">Life Job</a> / <a href="../gangs/">ギャング</a> / <a href="../faq/">よくある質問</a> / <a href="../contact/">お問い合わせ</a></nav><section id="gang-establishment"><h2>ギャングの設立</h2><table><caption>ギャング設立</caption><thead><tr><th>項目</th><th>金額</th></tr></thead><tbody><tr><td data-label="項目">ギャング設立費</td><td data-label="金額">2,000,000,000円</td></tr></tbody></table><p>設立に関する相談は、公式Discordのチケットからお願いします。</p><p>現在、ギャングの設立申請は受け付けていません。募集再開の案内は、公式のお知らせを確認してください。</p></section>
<section id="gang-color-registration"><h2>ギャングカラーの登録相談</h2><p>ギャングカラーは設立時に運営へ登録します。服装、車両、装飾などで所属を分かりやすくしましょう。</p><table><caption>ギャングカラーと登録状況</caption><thead><tr><th>色名</th><th>HEX</th><th>登録状況</th><th>ギャング名</th></tr></thead><tbody><tr><td data-label="色名">赤</td><td data-label="HEX">—</td><td data-label="登録状況">運営へ確認</td><td data-label="ギャング名">—</td></tr><tr><td data-label="色名">青</td><td data-label="HEX">—</td><td data-label="登録状況">運営へ確認</td><td data-label="ギャング名">—</td></tr><tr><td data-label="色名">桃</td><td data-label="HEX">—</td><td data-label="登録状況">運営へ確認</td><td data-label="ギャング名">—</td></tr><tr><td data-label="色名">黄</td><td data-label="HEX">—</td><td data-label="登録状況">運営へ確認</td><td data-label="ギャング名">—</td></tr><tr><td data-label="色名">橙</td><td data-label="HEX">—</td><td data-label="登録状況">運営へ確認</td><td data-label="ギャング名">—</td></tr><tr><td data-label="色名">緑</td><td data-label="HEX">—</td><td data-label="登録状況">運営へ確認</td><td data-label="ギャング名">—</td></tr><tr><td data-label="色名">紫</td><td data-label="HEX">—</td><td data-label="登録状況">運営へ確認</td><td data-label="ギャング名">—</td></tr></tbody></table><p>色の正確なHEX、使用中・空きの状況、登録ギャング名は運営へ確認してください。「—」は未確認の項目です。</p><p>犯罪シーンでのカラーは、「犯罪シーンではカラーを揃える」に従ってください。</p></section>
<section id="affiliation-colors"><h2>ギャングカラーの登録と使い方</h2><p>ギャングカラーは設立時に運営へ登録してください。ギャング内のメインカラーは統一してください。</p><p>他ギャングの登録カラーを意図的に偽装したり、他ギャングになりすましたりしないでください。既存ギャングと識別しにくい色や、PD・EMSなどと誤認しやすい表現は避けてください。</p><p>犯罪シーン中は、登録カラーの有無にかかわらず、犯罪シーンのカラー統一規定に従ってください。</p></section>
<section id="crime-scene-colors"><h2>犯罪シーンではカラーを揃える</h2><p>犯罪シーンでは、服装と車両のカラーを揃えてください。盗難車も対象です。</p><p>近似色や、黒・白・グレーの使用は認められません。カラーの判断に迷う場合は、PDへ確認してください。</p></section>
<section id="crime-current-list"><h2>犯罪カテゴリ・参加人数</h2><table><caption>犯罪カテゴリ・参加人数</caption><thead><tr><th>分類</th><th>犯罪名・区分</th><th>犯罪者側</th><th>PD側</th><th>補足</th></tr></thead><tbody><tr><td data-label="分類">小型</td><td data-label="犯罪名・区分">通常</td><td data-label="犯罪者側">2人</td><td data-label="PD側">2～3人</td><td data-label="補足"></td></tr><tr><td data-label="分類">小型</td><td data-label="犯罪名・区分">ATM</td><td data-label="犯罪者側">1人</td><td data-label="PD側">2～3人</td><td data-label="補足"></td></tr><tr><td data-label="分類">準中型（チェイス）</td><td data-label="犯罪名・区分">通常</td><td data-label="犯罪者側">1～2人</td><td data-label="PD側">2～4人</td><td data-label="補足"></td></tr><tr><td data-label="分類">準中型（チェイス）</td><td data-label="犯罪名・区分">クレーン強盗</td><td data-label="犯罪者側">2～3人</td><td data-label="PD側">3～4人</td><td data-label="補足"></td></tr><tr><td data-label="分類">準中型（チェイス）</td><td data-label="犯罪名・区分">現金交換所</td><td data-label="犯罪者側">1～2人</td><td data-label="PD側">2～4人</td><td data-label="補足"></td></tr><tr><td data-label="分類">準中型（撃ち合い）</td><td data-label="犯罪名・区分">通常</td><td data-label="犯罪者側">3～6人</td><td data-label="PD側">5～10人</td><td data-label="補足"></td></tr><tr><td data-label="分類">中型</td><td data-label="犯罪名・区分">通常</td><td data-label="犯罪者側">4～8人</td><td data-label="PD側">6～12人</td><td data-label="補足"></td></tr><tr><td data-label="分類">大型</td><td data-label="犯罪名・区分">通常</td><td data-label="犯罪者側">8～15人</td><td data-label="PD側">12～20人</td><td data-label="補足">ギャング限定</td></tr><tr><td data-label="分類">無人犯罪</td><td data-label="犯罪名・区分">通常</td><td data-label="犯罪者側">1人</td><td data-label="PD側">0人</td><td data-label="補足"></td></tr></tbody></table><p>犯罪は表の人数の範囲内で行ってください。犯罪者側の人数とPD側の人数を混同しないようにしてください。</p></section><p><a href="https://discord.gg/Fzhhp34JJy">公式Discord</a> / <a href="https://x.com/NicoGura0810">公式X</a></p><p>検索・保存機能にはJavaScriptを有効にしてください。</p></div></noscript>
