    <noscript><div class="noscript"><h1>ギャング</h1><p>仲間と楽しむギャング活動。結成費用と、街の共通ルールを確認しましょう。</p><p>最終更新 2026-10-12</p><nav><a href="../">NicoGura | にこぐら 公式ルール・参加ガイド</a> / <a href="../rules/">公式ルール</a> / <a href="../join/">参加方法</a> / <a href="../server/">サーバー情報</a> / <a href="../mods/">MOD・グリッチ</a> / <a href="../character/">キャラクター</a> / <a href="../economy/">経済・料金</a> / <a href="../crime/">犯罪RP</a> / <a href="../law/">法律・罰金</a> / <a href="../guides/">街ガイド</a> / <a href="../pd/">PD・警察</a> / <a href="../ems/">EMS・救急</a> / <a href="../mechanic/">メカニック</a> / <a href="../shops/">店舗</a> / <a href="../lifejobs/">Life Job</a> / <a href="../gangs/">ギャング</a> / <a href="../faq/">よくある質問</a> / <a href="../contact/">お問い合わせ</a></nav><section><h2>ギャングの設立</h2><table><caption>ギャング設立</caption><thead><tr><th>項目</th><th>金額</th></tr></thead><tbody><tr><td data-label="項目">標準ギャング設立費</td><td data-label="金額">2,000,000,000円</td></tr></tbody></table><p>仲間と組織での活動や犯罪RPを楽しみたい方は、設立について運営へ相談してください。ギャング活動でも、相手が楽しめるライトRPとサーバールールを守りましょう。</p></section>
<section><h2>ギャングカラーの登録と使い方</h2><p>ギャングカラーは設立時に運営へ登録してください。登録カラーは、服装・車両・装飾などに使用できます。</p><h3>使用可能カラー</h3><table><caption>ギャングカラーと登録状況</caption><thead><tr><th>色名</th><th>HEX</th><th>登録状況</th><th>ギャング名</th></tr></thead><tbody><tr><td data-label="色名">赤</td><td data-label="HEX">—</td><td data-label="登録状況">運営へ確認</td><td data-label="ギャング名">—</td></tr><tr><td data-label="色名">青</td><td data-label="HEX">—</td><td data-label="登録状況">運営へ確認</td><td data-label="ギャング名">—</td></tr><tr><td data-label="色名">桃</td><td data-label="HEX">—</td><td data-label="登録状況">運営へ確認</td><td data-label="ギャング名">—</td></tr><tr><td data-label="色名">黄</td><td data-label="HEX">—</td><td data-label="登録状況">運営へ確認</td><td data-label="ギャング名">—</td></tr><tr><td data-label="色名">橙</td><td data-label="HEX">—</td><td data-label="登録状況">運営へ確認</td><td data-label="ギャング名">—</td></tr><tr><td data-label="色名">緑</td><td data-label="HEX">—</td><td data-label="登録状況">運営へ確認</td><td data-label="ギャング名">—</td></tr><tr><td data-label="色名">紫</td><td data-label="HEX">—</td><td data-label="登録状況">運営へ確認</td><td data-label="ギャング名">—</td></tr></tbody></table><p>上の7色は使用可能カラーです。各色の正確なHEX、使用中・空きの状況、登録しているギャング名は、設立時に運営へ確認してください。「—」は未確認の項目です。</p><h3>服装・車両での使い方</h3><p>ギャング内で使用するメインカラーは統一してください。サブカラーは自由です。</p><p>白・黒は使用禁止です。</p><ul><li>既存ギャングと識別しにくい色は避けてください。</li><li>他ギャングの登録カラーを意図的に偽装しないでください。他ギャングへのなりすましは禁止です。</li><li>PD・EMSなどの公務員と誤認しやすい表現は避けてください。</li><li>抗争や犯罪などでは、所属が分かるカラーの使い方を推奨します。</li></ul></section><p><a href="https://discord.gg/Fzhhp34JJy">公式Discord</a> / <a href="https://x.com/NicoGura0810">公式X</a></p><p>検索・保存機能にはJavaScriptを有効にしてください。</p></div></noscript>
