    <noscript><div class="noscript"><h1>サーバー情報</h1><p>日本時間の再起動時刻、基本定休日とメンテナンスのお知らせを確認できます。</p><p>最終更新 2026-10-12</p><nav><a href="../">NicoGura | にこぐら 公式ルール・参加ガイド</a> / <a href="../rules/">公式ルール</a> / <a href="../join/">参加方法</a> / <a href="../server/">サーバー情報</a> / <a href="../mods/">MOD・グリッチ</a> / <a href="../character/">キャラクター</a> / <a href="../economy/">経済・料金</a> / <a href="../crime/">犯罪RP</a> / <a href="../law/">法律・罰金</a> / <a href="../guides/">街ガイド</a> / <a href="../pd/">PD・警察</a> / <a href="../ems/">EMS・救急</a> / <a href="../mechanic/">メカニック</a> / <a href="../shops/">店舗</a> / <a href="../lifejobs/">Life Job</a> / <a href="../gangs/">ギャング</a> / <a href="../faq/">よくある質問</a> / <a href="../contact/">お問い合わせ</a></nav><section><h2>通常再起動の時刻</h2><p>ゲームサーバーの通常再起動は、日本時間（JST）の03:00・11:00・19:00の1日3回です。</p><table><caption>通常再起動</caption><thead><tr><th>通常再起動（JST）</th></tr></thead><tbody><tr><td data-label="通常再起動（JST）">03:00</td></tr><tr><td data-label="通常再起動（JST）">11:00</td></tr><tr><td data-label="通常再起動（JST）">19:00</td></tr></tbody></table><p>掲載している時刻は、ゲームサーバーを再起動するタイミングです。定休日や臨時メンテナンスの際は、公式Discordの「街からのお知らせ」等で最新の稼働情報を確認してください。</p></section>
<section><h2>街の基本定休日とメンテナンス</h2><p>NicoGuraでは、メンテナンス、新要素の追加、不具合修正、バランス調整のため、街の基本定休日を設けています。</p><table><caption>基本定休日</caption><thead><tr><th>開始（JST）</th><th>終了予定（JST）</th></tr></thead><tbody><tr><td data-label="開始（JST）">水曜日 03:00</td><td data-label="終了予定（JST）">木曜日 19:00</td></tr></tbody></table><p>この時間帯が基本の定期メンテナンス・街休止時間です。時刻は日本時間（JST）で、木曜日19:00から通常稼働を再開する予定です。</p><h3>大型調整・臨時メンテナンス</h3><p>大規模アップデートなどでは、月曜日〜火曜日を使用する場合があります。別の日程を案内する場合もあるため、公式Discordのアナウンスを確認してください。</p><p>臨時メンテナンスもあり得ます。最新の稼働情報は、公式Discordの「街からのお知らせ」等を確認してください。</p></section>
<section><h2>再起動前後の犯罪について</h2><table><caption>再起動前後の犯罪禁止時間</caption><thead><tr><th>再起動の種類</th><th>犯罪禁止時間・確認事項</th></tr></thead><tbody><tr><td data-label="再起動の種類">定期再起動</td><td data-label="犯罪禁止時間・確認事項">前30分 / サーバー再開後30分</td></tr><tr><td data-label="再起動の種類">緊急再起動</td><td data-label="犯罪禁止時間・確認事項">サーバー再開後15分</td></tr><tr><td data-label="再起動の種類">その他の再起動</td><td data-label="犯罪禁止時間・確認事項">街からのアナウンスを確認</td></tr></tbody></table><h3>定期再起動</h3><p>定期再起動の30分前から再起動まで、およびサーバー再開後30分間は、犯罪行為を禁止します。新たな犯罪の開始だけでなく、この時間帯に犯罪行為を続けることも禁止です。</p><p>再起動時間をまたぐ可能性が高い犯罪も行わないでください。開始できる時刻でも、再起動前の犯罪禁止時間にかからないか、事前に確認しましょう。</p><h3>緊急再起動</h3><p>緊急再起動の場合は、サーバー再開後15分間、犯罪行為を禁止します。緊急再起動は予告なしに発生する場合があります。</p><h3>その他の再起動・個別の案内</h3><p>メンテナンス、臨時再起動、特殊な再起動等については、街からのアナウンスを確認してください。</p><p>運営から個別の犯罪開始時刻が案内された場合は、その案内を優先してください。最新情報は公式Discordの「街からのお知らせ」等で確認できます。</p></section><p><a href="https://discord.gg/Fzhhp34JJy">公式Discord</a> / <a href="https://x.com/NicoGura0810">公式X</a></p><p>検索・保存機能にはJavaScriptを有効にしてください。</p></div></noscript>
