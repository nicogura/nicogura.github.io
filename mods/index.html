    <noscript><div class="noscript"><h1>MOD・グリッチ</h1><p>Citizen・Client MODの使用条件と、スピードブースト・グリッチロールなど移動グリッチのルール。</p><p>最終更新 2026-11-03</p><nav><a href="../">NicoGura | にこぐら 公式ルール・参加ガイド</a> / <a href="../rules/">公式ルール</a> / <a href="../join/">参加方法</a> / <a href="../server/">サーバー情報</a> / <a href="../mods/">MOD・グリッチ</a> / <a href="../character/">キャラクター</a> / <a href="../economy/">経済・料金</a> / <a href="../crime/">犯罪RP</a> / <a href="../law/">法律・罰金</a> / <a href="../guides/">にこぐらガイド</a> / <a href="../pd/">PD・警察</a> / <a href="../ems/">EMS・救急</a> / <a href="../mechanic/">メカニック</a> / <a href="../shops/">店舗</a> / <a href="../lifejobs/">Life Job</a> / <a href="../gangs/">ギャング</a> / <a href="../faq/">よくある質問</a> / <a href="../contact/">お問い合わせ</a></nav><section id="client-mod-policy"><h2>Citizen・Client側MODの使用条件</h2><p>Citizen・Client側MODは原則禁止です。例外的に使用を認める場合があるため、使用前に公式Discordのチケットで運営へお問い合わせください。</p><p>軽量化や見た目・音の変更であっても、自己判断で使用できる例外にはなりません。導入したいMODの内容を伝え、運営の回答を確認してください。</p></section>
<section id="client-mod-consultation"><h2>MODを相談するとき</h2><p>軽量化、Texture、Graphics、NVE・QuantV、ReShade、Sound Pack、Road Textureなど、導入したい変更の内容を運営に伝えてください。これらは使用を許可した一覧ではありません。</p><p>視認性・位置情報・戦闘性能に関わる変更は、何が変わるかも説明してください。草・木・建物・水の削除や透明化、霧や夜の明るさ、Crosshair・Overlay、Hitbox・Damage、Tracer・KillFX、画面比率、足音や銃声の変更などが該当します。</p><p>MOD等の導入は自己責任です。MOD等が原因のクラッシュ、表示不具合、データ破損、起動不能等について、運営は原則として補償しません。</p></section>
<section id="prohibited-exploit"><h2>バグ・複製を意図的に悪用しない</h2><p>資金・アイテム・報酬を複製したり、不正に取得したりする行為は禁止です。通常のプレイでは到達・発揮できない行為や挙動も悪用しないでください。</p><ul><li>グリッチロール、スピードブースト、無線撃ち。</li><li>ヘリのドアを開けた状態での走行など、通常想定されていない挙動の利用。</li></ul><p>不具合に気づいたら追加利用を止め、発生時刻や状況をチケットで報告してください。複製や重大な脆弱性の再現方法は公開・拡散しないでください。</p><p>偶然の不具合や操作ミスと、故意の悪用は区別します。</p></section>
<section id="movement-glitches"><h2>スピードブースト・グリッチロールとは</h2><p>ゲーム本来の想定を超える移動・回避の挙動を意図的に悪用し、有利になる行為は禁止です。</p><h3>スピードブースト（スピブ）</h3><p>移動・エイム・方向転換等を組み合わせ、ゲーム本来の想定を超える移動速度を得るために、移動挙動を意図的に悪用する行為です。</p><h3>グリッチロール（グリロ）</h3><p>ローリング等の挙動や同期処理を悪用し、通常ではない移動・回避を行って、戦闘上の優位性を得る行為です。</p><p>ローリングキャンセル、移動モーションキャンセル、同種の移動グリッチなども、想定外の挙動を意図的に反復利用して有利になる行為は禁止です。</p><p>偶然一度発生しただけの挙動まで、即ルール違反とはしません。禁止対象は意図的・反復的な利用です。</p><p>マクロ等を使ってスピブ・グリロを自動化する行為も禁止です。</p></section><p><a href="https://discord.gg/Fzhhp34JJy">公式Discord</a> / <a href="https://x.com/NicoGura0810">公式X</a></p><p>検索・保存機能にはJavaScriptを有効にしてください。</p></div></noscript>
