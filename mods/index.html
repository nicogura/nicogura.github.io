    <noscript><div class="noscript"><h1>MOD・グリッチ</h1><p>Citizen・Client MODの使用条件と、スピードブースト・グリッチロールなど移動グリッチのルール。</p><p>最終更新 2026-10-12</p><nav><a href="../">NicoGura | にこぐら 公式ルール・参加ガイド</a> / <a href="../rules/">公式ルール</a> / <a href="../join/">参加方法</a> / <a href="../server/">サーバー情報</a> / <a href="../mods/">MOD・グリッチ</a> / <a href="../character/">キャラクター</a> / <a href="../economy/">経済・料金</a> / <a href="../crime/">犯罪RP</a> / <a href="../law/">法律・罰金</a> / <a href="../guides/">街ガイド</a> / <a href="../pd/">PD・警察</a> / <a href="../ems/">EMS・救急</a> / <a href="../mechanic/">メカニック</a> / <a href="../shops/">店舗</a> / <a href="../lifejobs/">Life Job</a> / <a href="../gangs/">ギャング</a> / <a href="../faq/">よくある質問</a> / <a href="../contact/">お問い合わせ</a></nav><section><h2>スピードブースト・グリッチロールを使わない</h2><p>ゲーム本来の想定を超える移動・回避の挙動を意図的に悪用し、有利になる行為は禁止です。</p><h3>スピードブースト（スピブ）</h3><p>移動・エイム・方向転換等を組み合わせ、ゲーム本来の想定を超える移動速度を得るために、移動挙動を意図的に悪用する行為です。</p><h3>グリッチロール（グリロ）</h3><p>ローリング等の挙動や同期処理を悪用し、通常ではない移動・回避を行って、戦闘上の優位性を得る行為です。</p><p>ローリングキャンセル、移動モーションキャンセル、同種の移動グリッチなども、想定外の挙動を意図的に反復利用して有利になる行為は禁止です。</p><p>偶然一度発生しただけの挙動まで、即ルール違反とはしません。禁止対象は意図的・反復的な利用です。</p><p>マクロ等を使ってスピブ・グリロを自動化する行為も禁止です。</p></section>
<section><h2>Citizen・Client側MODの使用条件</h2><p>Citizen・Client側MODは原則禁止です。ただし、低スペックPCへの配慮や個人の見た目・音の好みを考慮し、ゲームプレイ上の優位性が一切生じないものに限り、例外的に使用できます。</p><h3>例外的に使用できる変更</h3><p>次の変更は、プレイ上の優位性がなく、下記の禁止条件に抵触しない範囲で使用できます。</p><ul><li>FPS改善を目的とする軽量化。</li><li>通常範囲のTexture軽量化。</li><li>見た目を綺麗にするGraphics MOD。</li><li>NVE / QuantV等のVisual系MOD。</li><li>ReShade等の色調変更。</li><li>Sound Pack。</li><li>Road Texture等。</li><li>その他、純粋な見た目・音の変更。</li></ul><h3>禁止される変更</h3><p>他のプレイヤーより、情報・視認性・戦闘等で有利になる変更は禁止です。軽量化や見た目・音の変更を目的としていても、次の条件に該当するものは使用できません。</p><ul><li>No Bush / No Tree / No Prop / No Mountain / No Waterなど、草・木・小道具・山・水等を消す変更。</li><li>水を透明にする変更。</li><li>SmokeやFogを消す変更。</li><li>障害物、建物、Objectを消す変更。</li><li>No Night、常時昼間化、夜を極端に明るくする設定。</li><li>敵だけ見やすくなる色調や、極端な視認性変更。</li><li>外部CrosshairやCombat用Overlay。</li><li>Hitbox変更、Ped Hitbox拡大、Damage変更。</li><li>Tracer等により、通常は得られない位置情報を取得する変更。</li><li>KillFX等により、壁越しなどの通常は得られない情報を取得する変更。</li><li>Stretched Resolution等で画面を意図的に変形し、戦闘上の優位性（Combat Advantage）を得る変更。</li><li>足音や銃声等を不自然に強調し、通常より位置把握を有利にするSound MOD。</li><li>その他、通常環境では得られない情報やCombat Advantageを発生させる改変。</li></ul><h3>導入前の確認</h3><p>判断が難しいMODは、使用前に公式Discordの「お問い合わせ窓口」から確認してください。「一覧に書いていないから使用可能」とはしません。最終判断は運営が行います。</p><h3>導入と補償について</h3><p>MOD等の導入は自己責任です。MOD等が原因のクラッシュ、表示不具合、データ破損、FiveM起動不能等について、運営は原則として補償しません。</p></section><p><a href="https://discord.gg/Fzhhp34JJy">公式Discord</a> / <a href="https://x.com/NicoGura0810">公式X</a></p><p>検索・保存機能にはJavaScriptを有効にしてください。</p></div></noscript>
