    <noscript><div class="noscript"><h1>公式ルール</h1><p>街のみんなが気持ちよく遊ぶための、ライトRPとマナーの約束。検索やカテゴリーから必要な項目を確認できます。</p><p>最終更新 2026-11-16</p><nav><a href="../">NicoGura | にこぐら 公式ルール・参加ガイド</a> / <a href="../rules/">公式ルール</a> / <a href="../join/">参加方法</a> / <a href="../server/">サーバー情報</a> / <a href="../mods/">MOD・グリッチ</a> / <a href="../character/">キャラクター</a> / <a href="../economy/">経済・料金</a> / <a href="../crime/">犯罪RP</a> / <a href="../law/">法律・罰金</a> / <a href="../guides/">にこぐらガイド</a> / <a href="../pd/">PD・警察</a> / <a href="../ems/">EMS・救急</a> / <a href="../mechanic/">メカニック</a> / <a href="../shops/">店舗</a> / <a href="../lifejobs/">Life Job</a> / <a href="../gangs/">ギャング</a> / <a href="../faq/">よくある質問</a> / <a href="../contact/">お問い合わせ</a></nav><nav aria-label="ルールの5分類"><a href="#rulebook-overview">ルールの要点</a> / <a href="#rulebook-general">街の全体ルール</a> / <a href="#rulebook-crime">犯罪者側のルール</a> / <a href="#rulebook-pd">PD側ルール</a> / <a href="#rulebook-ems">EMSルール</a></nav><section id="rulebook-overview"><h2>ルールの要点</h2><p>最初に押さえたい約束を確認し、必要なルールの本文へ進めます。</p><section id="rulebook-overview-essentials"><h3>まず確認したい約束</h3><p><a href="#basic-respect">相手の楽しみも大切に</a> — 市民、運営、配信者など、一緒に遊ぶ相手を尊重しましょう。</p><p><a href="#character-identity">1人につき1キャラクター</a> — NicoGuraで使用できるキャラクターは、1人のプレイヤーにつき1人までです。</p><p><a href="#rp-metagaming">ゲーム外の情報をRPに持ち込まない</a> — 自分のキャラクターがゲーム内で知ることのできない情報を、ゲーム内で使うことは禁止です。</p><p><a href="#prohibited-cheating">チート・不正ツールを使わない</a> — チート・不正ツール・マクロで有利になる行為や、サーバー・他のプレイヤーを妨げる行為は禁止です。</p><p><a href="#prohibited-exploit">バグ・複製を意図的に悪用しない</a> — 複製バグや、通常のプレイでは到達・発揮できない挙動を悪用することは禁止です。</p><p><a href="#rp-rdm">理由のない攻撃をしない（RDM）</a> — RP上の理由や流れがないまま、他のプレイヤーを突然攻撃・殺害する行為は禁止です。</p><p><a href="#vehicles-vdm">車を使って故意に襲わない（VDM）</a> — RP上の理由なく、車両を武器のように使って他のプレイヤーを意図的に轢く行為は禁止です。</p><p><a href="#crime-current-list">犯罪カテゴリ・参加人数</a> — 犯罪者側とPD側は、分類ごとの参加人数に従ってください。大型犯罪はギャング限定です。</p><p><a href="#crime-siege">中籠りと完全包囲の判定</a> — PDラジアルで完全包囲を宣言した時点から5分を計測し、ラークの介入は禁止になります。PDが5回程度呼びかけ、5分後に条件を確認して犯罪者側の敗北を確定します。</p><p><a href="#job-authority-misuse">職業の権限や請求を悪用しない</a> — 職業の権限・支給品・専用機能の悪用や、実施していない作業の請求は禁止です。</p><p><a href="#ems-emergency-use">緊急救済機能を悪用しない</a> — 緊急救済は、EMS不在・救助不能などの場合や、EMS・PDから指示がある場合に利用してください。</p><p><a href="#safe-zone-conduct">セーフゾーンでの禁止行為と通過</a> — セーフゾーン内での発砲・犯罪行為は禁止です。チェイスの経路として通過することはできます。</p></section></section><section id="rulebook-general"><h2>街の全体ルール</h2><p>立場にかかわらず、街で遊ぶ全員に共通する約束です。</p><section id="rulebook-general-living-together"><h3>街での基本・キャラクター・入国</h3><section id="basic-respect"><h4>相手の楽しみも大切に</h4><p>街の規定</p><p>RP上の対立や口論と、プレイヤー本人への攻撃は別です。ゲーム内で役として対立しても、現実の人格への誹謗中傷や嫌がらせにつなげないでください。</p><p>相手が話したり行動したりできる余地を残し、自分と相手の両方が楽しめる遊び方を心がけましょう。RPとして成立するゲーム内の対立まで、一律に禁止するものではありません。</p></section><section id="rp-back-and-forth"><h4>相手と一緒にRPを楽しもう</h4><p>街の規定</p><p>キャラクターとして街で経験したことをもとに、会話や行動を楽しんでください。操作ミスや言い間違いがあっても、すぐに相手を責めず、必要なことを短く確認し合いましょう。</p><p>相手の会話や出来事を尊重し、関係のない場面へ繰り返し割り込んで遊びを止めないようお願いします。困ったときは、運営へ相談して大丈夫です。</p></section><section id="rp-no-pressure"><h4>自分のRP観を押し付けない</h4><p>街の規定</p><p>「そのRPは間違っている」「もっとキャラになりきれ」と、自分のRP観を他人へ押し付けることは避けてください。経験や遊び方には違いがあります。</p><p>困ったことは短く確認し、相手を責めるためにシーンを止め続けないようお願いします。ルールに関わる問題は運営へ相談してください。</p></section><section id="character-identity"><h4>1人につき1キャラクター</h4><p>街の規定</p><p>NicoGuraで使用できるキャラクターは、1人のプレイヤーにつき1人までです。複数キャラクターや別アカウントを使い分けて、実質的に複数のキャラクターを使用することはできません。</p></section><section id="join-whitelist"><h4>Whitelistはコード申請と運営承認です</h4><p>街の規定</p><p>Whitelistの申請には、本人がFiveMへ初回接続したときに表示されるRxxxxコードを使ってください。他人のコードは使用できません。</p><p>Discordでルールを確認し、市民ロールを取得した後、#ホワイトリスト申請へ本人のコードを投稿してください。運営の承認後に、FiveMへ再接続します。</p><p>問題がある場合は、公式Discordのチケットから相談してください。詳しい手順は「NicoGuraへの参加方法」を確認してください。</p></section></section><section id="rulebook-general-fair-play"><h3>不正・MOD・処分逃れの禁止</h3><section id="prohibited-cheating"><h4>チート・不正ツールを使わない</h4><p>街の規定</p><p>チート、不正ツール、マクロなどを利用して、自分が有利になる行為は禁止です。Mod Menu、Aimbot、ESP、Wallhackなどの不正な照準・透視・改変も含みます。</p><p>これらを使ったサーバーへの攻撃や、他のプレイヤーのプレイを妨げる行為は禁止です。放置、BOT、自動化によって稼ぐ行為も行わないでください。</p></section><section id="prohibited-exploit"><h4>バグ・複製を意図的に悪用しない</h4><p>街の規定</p><p>資金・アイテム・報酬を複製したり、不正に取得したりする行為は禁止です。通常のプレイでは到達・発揮できない行為や挙動も悪用しないでください。</p><ul><li>グリッチロール、スピードブースト、無線撃ち。</li><li>ヘリのドアを開けた状態での走行など、通常想定されていない挙動の利用。</li></ul><p>不具合に気づいたら追加利用を止め、発生時刻や状況をチケットで報告してください。複製や重大な脆弱性の再現方法は公開・拡散しないでください。</p><p>偶然の不具合や操作ミスと、故意の悪用は区別します。</p></section><section id="client-mod-policy"><h4>Citizen・Client側MODの使用条件</h4><p>街の規定</p><p>Citizen・Client側MODは原則禁止です。例外的に使用を認める場合があるため、使用前に公式Discordのチケットで運営へお問い合わせください。</p><p>軽量化や見た目・音の変更であっても、自己判断で使用できる例外にはなりません。導入したいMODの内容を伝え、運営の回答を確認してください。</p></section><section id="prohibited-rmt"><h4>ゲーム内資産と現実の対価を交換しない</h4><p>街の規定</p><p>現実のお金や換金できる対価と引き換えにゲーム内資産を受け渡したり、取引を持ちかけたりしないでください。</p></section><section id="prohibited-ban-evasion"><h4>BANやWhitelistの制限を回避しない</h4><p>街の規定</p><p>正規の承認や処分を、別アカウントや不正な手段で回避しないでください。承認や処分について確認したいことがある場合は、Discordの「お問い合わせ窓口」へ連絡してください。</p></section><section id="prohibited-evidence-fabrication"><h4>証拠を捏造しない</h4><p>街の規定</p><p>事実確認のため、起きたことを分かる範囲で正確に伝えてください。証拠がないことや記憶が曖昧なことは、そのまま説明して大丈夫です。</p><p>状況を確認できるよう、ボディカメラで記録を残すことを推奨します。録画の有無や記憶が曖昧な点は、そのまま説明してください。</p></section><section id="clothing-bulletproof-ban"><h4>防弾性能のある服装は禁止</h4><p>街の規定</p><p>防弾性能のある服装の着用は禁止です。見た目ではなく、防弾性能を持つ服装が対象です。</p><p>この規定は服装の防弾性能を対象とします。通常のアーマーアイテムの使用を禁止するものではありません。</p></section></section><section id="rulebook-general-roleplay-and-respect"><h3>情報共有・攻撃・嫌がらせ</h3><section id="rp-metagaming"><h4>ゲーム外の情報をRPに持ち込まない</h4><p>街の規定</p><p>Discord、配信、他人の画面、ゲーム外チャット、運営画面、外部ツールなどで得た位置・人数・計画・身元を、自分のキャラクターが知っている情報として利用しないでください。</p><p>偶然情報が見えたり聞こえたりした場合も、ゲーム内の行動や仲間への連絡に利用しないでください。ゲームの状況に影響しない普段の雑談まで禁止するものではありません。</p></section><section id="communication-external-vc"><h4>外部VCで有利な情報を共有しない</h4><p>街の規定</p><p>犯罪、警察対応、戦闘、チェイス、ギャング活動などで、Discord等の外部VCを使って位置・人数・作戦・敵情報を共有し、ゲーム内で有利になる行為は禁止です。</p><p>Discord等で友達同士が普通に会話すること自体は禁止しません。雑談中にシーンの情報が入っても、ゲーム内の行動や仲間への指示に利用しないでください。</p></section><section id="rp-rdm"><h4>理由のない攻撃をしない（RDM）</h4><p>街の規定</p><p>通りすがりの人へ無差別に発砲するなど、RP上の関わりがない攻撃をしないでください。「犯罪者のキャラクターだから」という理由だけで、誰でも攻撃できるわけではありません。</p><p>進行中の犯罪RPや対立は、前後のやり取りと状況を含めて判断します。</p></section><section id="vehicles-vdm"><h4>車を使って故意に襲わない（VDM）</h4><p>街の規定</p><p>人を狙って轢く、嫌がらせのために繰り返し体当たりをするなどの行為をしないでください。</p><p>普通の交通事故をVDMとして扱うものではありません。故意かどうかや前後のRPの流れを含め、状況を確認します。</p></section><section id="rp-powergaming"><h4>パワーゲーミングをしない</h4><p>街の規定</p><p>通常のプレイでは到達不可能な行為や、シーン中にロード・テレポートを挟む場所へ侵入する行為は禁止です。</p><p>相手とのやり取りでは、結果を一方的に押し付けず、相手が反応できる余地を残してください。</p></section><section id="prohibited-harassment"><h4>悪質な嫌がらせをしない</h4><p>街の規定</p><ul><li>現実の人格への誹謗中傷、差別、暴言。</li><li>粘着、つきまとい、性的な嫌がらせなどのハラスメント。</li><li>個人情報晒しや恐喝など、現実のトラブルへ発展させる行為。</li></ul><p>嫌なことがあっても、仕返しや長時間の口論を続けず、距離を取って運営へ相談してください。ゲーム内、配信、SNSでも、相手本人を尊重しましょう。</p><p>RPとして成立するキャラクター同士の対立と、プレイヤー本人への攻撃は区別します。</p></section><section id="prohibited-impersonation"><h4>運営や他のプレイヤーになりすまさない</h4><p>街の規定</p><p>運営、PD・EMSなどの公務員、他のプレイヤーへのなりすましは禁止です。権限があると偽って従わせたり、本人の指示や本人確認を装ったりしないでください。</p></section><section id="safe-zone-conduct"><h4>セーフゾーンでの禁止行為と通過</h4><p>街の規定</p><p>セーフゾーン内では、銃の発砲や犯罪行為は禁止です。</p><p>チェイス中に、経路としてセーフゾーンを通過することはできます。ただし、通過中もセーフゾーン内での発砲・犯罪行為は禁止です。</p></section></section><section id="rulebook-general-jobs-and-vehicles"><h3>職業・専用車両の扱い</h3><section id="vehicles-emergency-use"><h4>PD・EMS専用車両を無断で使用・窃盗しない</h4><p>街の規定</p><p>PD・EMS専用車両を、権限のない市民が無断で使用・窃盗する行為は禁止します。</p><p>PD・EMSの緊急車両や公務用車両を、単なる移動手段として無断利用することも禁止です。</p></section><section id="vehicles-job-crime"><h4>JOB専用車両を犯罪に利用しない</h4><p>街の規定</p><p>PD・EMS・タクシー・バスなど、JOB専用として用意されている車両を犯罪行為に利用することは禁止します。</p><p>対象は、JOBの業務用として用意された専用車両です。通常の市販車や個人所有車まで、このルールで一律に禁止するものではありません。</p></section><section id="vehicles-crime-banned"><h4>犯罪禁止車両を犯罪に利用しない</h4><p>街の規定</p><p>車両に乗ったときに「犯罪禁止車両」と表示される車両を、犯罪に利用することは禁止です。</p></section><section id="job-authority-misuse"><h4>職業の権限や請求を悪用しない</h4><p>街の規定</p><p>PD・EMS・メカニックなど、職務の権限、支給品、専用機能を不正な利益のために悪用しないでください。</p><p>実施していない作業の請求や、意図的な詐欺的請求は禁止です。作業・商品と請求内容が食い違わないよう説明してください。</p><p>店舗荒らし、意図的な営業妨害、嫌がらせは禁止です。行き違いを解決できない場合は、チケットから運営へ相談してください。</p></section><section id="job-employment-limits"><h4>公務員の兼業禁止</h4><p>街の規定</p><p>公務員は兼業禁止です。就職や採用については、担当者の案内を確認してください。</p></section><section id="mechanic-crime-limits"><h4>メカニックの犯罪参加とギャング</h4><p>街の規定</p><p>メカニックは準公務員ですが、中型犯罪まで参加できます。</p><p>ギャングへの参加と、大型犯罪への参加は禁止です。</p></section><section id="shop-staff-limit"><h4>店舗の在籍人数は合計6人まで</h4><p>街の規定</p><p>店舗に在籍できる人数は、店長1人・従業員5人の合計6人までです。</p></section></section><section id="rulebook-general-streaming-and-support"><h3>配信・運営への連絡・違反対応</h3><section id="streaming-respect"><h4>配信・SNSでも相手を大切に</h4><p>街の規定</p><p>配信する際は、他の参加者の個人情報や私的な画面が映らないよう注意してください。</p><p>自衛のため、名前に「🛰」マークを表示してください。犯罪中は、マークを消しても構いません。</p><p>ゲーム内の対立を、現実の人格への攻撃やSNSでの粘着につなげないでください。配信から得た位置や作戦をゲーム内で利用することも禁止です。</p></section><section id="administration-contact-boundaries"><h4>運営への連絡方法を守る</h4><p>街の規定</p><p>街中で運営に対する必要のないメッセージや電話を送ることは避けてください。</p><p>Discordでは、運営・サポーター・デバッガーなどへのDMを行わず、案内された窓口を使ってください。</p><p>ゲーム内の報告機能やチケットで報告した内容を、重複して報告しないでください。</p></section><section id="administration-response"><h4>ルール違反と運営の対応</h4><p>街の規定</p><p>ルール違反や、他のプレイヤーのプレイ・RP活動・サーバー運営の妨げになると判断した場合は、警告、キック、期限BAN、永久BANなどの対応を行う場合があります。</p><p>個別に書かれていない行為でも、悪質な抜け穴利用や活動の妨害には運営が対応する場合があります。</p><p>これらの対応は、本人へ事前に通知せず行う場合があります。</p></section></section></section><section id="rulebook-crime"><h2>犯罪者側のルール</h2><p>準備から交渉・逃走・終了・罰金まで、犯罪に必要な公開ルールをまとめて確認できます。</p><section id="rulebook-crime-before-start"><h3>始める前に：分類・人数・時間・職業制限</h3><section id="crime-current-list"><h4>犯罪カテゴリ・参加人数</h4><p>街の規定</p><table><caption>犯罪カテゴリ・参加人数</caption><thead><tr><th>分類</th><th>犯罪名・区分</th><th>犯罪者側</th><th>PD側</th><th>補足</th></tr></thead><tbody><tr><td data-label="分類">小型</td><td data-label="犯罪名・区分">通常</td><td data-label="犯罪者側">2人</td><td data-label="PD側">2～3人</td><td data-label="補足"></td></tr><tr><td data-label="分類">小型</td><td data-label="犯罪名・区分">ATM</td><td data-label="犯罪者側">1人</td><td data-label="PD側">2～3人</td><td data-label="補足"></td></tr><tr><td data-label="分類">準中型（チェイス）</td><td data-label="犯罪名・区分">通常</td><td data-label="犯罪者側">1～2人</td><td data-label="PD側">2～4人</td><td data-label="補足"></td></tr><tr><td data-label="分類">準中型（チェイス）</td><td data-label="犯罪名・区分">クレーン強盗</td><td data-label="犯罪者側">2～3人</td><td data-label="PD側">3～4人</td><td data-label="補足"></td></tr><tr><td data-label="分類">準中型（チェイス）</td><td data-label="犯罪名・区分">現金交換所</td><td data-label="犯罪者側">1～2人</td><td data-label="PD側">2～4人</td><td data-label="補足"></td></tr><tr><td data-label="分類">準中型（撃ち合い）</td><td data-label="犯罪名・区分">通常</td><td data-label="犯罪者側">3～6人</td><td data-label="PD側">5～10人</td><td data-label="補足"></td></tr><tr><td data-label="分類">中型</td><td data-label="犯罪名・区分">通常</td><td data-label="犯罪者側">4～8人</td><td data-label="PD側">6～12人</td><td data-label="補足"></td></tr><tr><td data-label="分類">大型</td><td data-label="犯罪名・区分">通常</td><td data-label="犯罪者側">8～15人</td><td data-label="PD側">12～20人</td><td data-label="補足">ギャング限定</td></tr><tr><td data-label="分類">無人犯罪</td><td data-label="犯罪名・区分">通常</td><td data-label="犯罪者側">1人</td><td data-label="PD側">0人</td><td data-label="補足"></td></tr></tbody></table><p>犯罪は表の人数の範囲内で行ってください。犯罪者側の人数とPD側の人数を混同しないようにしてください。</p></section><section id="crime-types-guide"><h4>犯罪の種類と分類</h4><p>利用案内</p><table><caption>犯罪の分類</caption><thead><tr><th>犯罪名</th><th>分類</th></tr></thead><tbody><tr><td data-label="犯罪名">コンビニ強盗</td><td data-label="分類">小型</td></tr><tr><td data-label="犯罪名">ATM強盗</td><td data-label="分類">小型</td></tr><tr><td data-label="犯罪名">空き巣</td><td data-label="分類">小型</td></tr><tr><td data-label="犯罪名">フリーカ強盗</td><td data-label="分類">準中（チェイス）</td></tr><tr><td data-label="犯罪名">現金両替強盗</td><td data-label="分類">準中（チェイス）</td></tr><tr><td data-label="犯罪名">クレーン強盗</td><td data-label="分類">準中（チェイス）</td></tr><tr><td data-label="犯罪名">ブースティング（A・S）</td><td data-label="分類">準中（チェイス）</td></tr><tr><td data-label="犯罪名">コインランドリー</td><td data-label="分類">準中（撃ち合い）</td></tr><tr><td data-label="犯罪名">ヴァンジェリコ</td><td data-label="分類">準中（撃ち合い）</td></tr><tr><td data-label="犯罪名">列車強盗</td><td data-label="分類">準中（撃ち合い）</td></tr><tr><td data-label="犯罪名">パージ強盗</td><td data-label="分類">準中（撃ち合い）</td></tr><tr><td data-label="犯罪名">軍事基地</td><td data-label="分類">準中（撃ち合い）</td></tr><tr><td data-label="犯罪名">客船</td><td data-label="分類">中型</td></tr><tr><td data-label="犯罪名">飛行場襲撃</td><td data-label="分類">中型</td></tr><tr><td data-label="犯罪名">ボブキャット</td><td data-label="分類">中型</td></tr><tr><td data-label="犯罪名">パレト</td><td data-label="分類">中型</td></tr><tr><td data-label="犯罪名">オイルリグ</td><td data-label="分類">中型</td></tr><tr><td data-label="犯罪名">貨物船強盗</td><td data-label="分類">中型</td></tr><tr><td data-label="犯罪名">ヒューマンラボ</td><td data-label="分類">中型</td></tr><tr><td data-label="犯罪名">美術館強盗</td><td data-label="分類">中型</td></tr><tr><td data-label="犯罪名">空母強盗</td><td data-label="分類">中型</td></tr><tr><td data-label="犯罪名">金庫強盗</td><td data-label="分類">中型</td></tr><tr><td data-label="犯罪名">アーティファクト</td><td data-label="分類">大型</td></tr><tr><td data-label="犯罪名">ユニオンヘイスト</td><td data-label="分類">大型</td></tr><tr><td data-label="犯罪名">カジノヘイスト</td><td data-label="分類">大型</td></tr><tr><td data-label="犯罪名">パシフィック</td><td data-label="分類">大型</td></tr><tr><td data-label="犯罪名">マウンテン・ボルト</td><td data-label="分類">大型</td></tr><tr><td data-label="犯罪名">アンダーグラウンド・ヘイスト</td><td data-label="分類">大型</td></tr><tr><td data-label="犯罪名">メイズバンク</td><td data-label="分類">大型</td></tr><tr><td data-label="犯罪名">警察署襲撃</td><td data-label="分類">特殊</td></tr><tr><td data-label="犯罪名">自動販売機強盗</td><td data-label="分類">PDなし犯罪</td></tr><tr><td data-label="犯罪名">ポストロッカー強盗</td><td data-label="分類">PDなし犯罪</td></tr><tr><td data-label="犯罪名">ブースティング（D・C・B）</td><td data-label="分類">PDなし犯罪</td></tr></tbody></table><p>参加人数は「犯罪カテゴリ・参加人数」で確認してください。この一覧は分類の案内です。現在の受付状況は、ゲーム内の案内を確認してください。</p></section><section id="crime-restart-window"><h4>再起動前後の犯罪について</h4><p>街の規定</p><table><caption>再起動前後の犯罪禁止時間</caption><thead><tr><th>再起動の種類</th><th>犯罪禁止時間・確認事項</th></tr></thead><tbody><tr><td data-label="再起動の種類">定期再起動</td><td data-label="犯罪禁止時間・確認事項">前30分 / サーバー再開後30分</td></tr><tr><td data-label="再起動の種類">緊急再起動</td><td data-label="犯罪禁止時間・確認事項">サーバー再開後15分</td></tr><tr><td data-label="再起動の種類">その他の再起動</td><td data-label="犯罪禁止時間・確認事項">街からのアナウンスを確認</td></tr></tbody></table><h5>定期再起動</h5><p>定期再起動の30分前から再起動まで、およびサーバー再開後30分間は、犯罪行為を禁止します。新たな犯罪の開始だけでなく、この時間帯に犯罪行為を続けることも禁止です。</p><p>再起動時間をまたぐ可能性が高い犯罪も行わないでください。開始できる時刻でも、再起動前の犯罪禁止時間にかからないか、事前に確認しましょう。</p><h5>緊急再起動</h5><p>緊急再起動の場合は、サーバー再開後15分間、犯罪行為を禁止します。緊急再起動は予告なしに発生する場合があります。</p><h5>その他の再起動・個別の案内</h5><p>メンテナンス、臨時再起動、特殊な再起動等については、街からのアナウンスを確認してください。</p><p>運営から個別の犯罪開始時刻が案内された場合は、その案内を優先してください。最新情報は公式Discordの「街からのお知らせ」等で確認できます。</p></section><section id="crime-probation"><h4>案内された参加制限を確認しよう</h4><p>街の規定</p><p>社会奉仕・保護観察の期間中は、犯罪などが制限されます。参加できる活動と適用期間を確認し、制限に従ってください。</p><p>別のアカウントや立場を使って制限を回避しないでください。自分に適用される内容が分からない場合は、PDや運営へ確認してください。</p></section><p><a href="#mechanic-crime-limits">メカニックの犯罪参加とギャング（共通の本文）</a></p><section id="crime-police-station-waiting"><h4>犯罪前に警察署の前で待機しない</h4><p>街の規定</p><p>犯罪を始める前に、警察署の前で待機する行為は禁止です。</p></section><section id="pending-crime-conditions"><span id="crime-public-rewards" aria-hidden="true"></span><h4>犯罪・Heistを始める前に</h4><p>利用案内</p><p>犯罪RPはNicoGuraのゲームコンテンツです。街の仲間と計画し、警察とのやり取りやシーンを楽しみましょう。</p><ul><li>「犯罪カテゴリ・参加人数」で、犯罪側とPD側の人数条件を確認してください。</li><li>必要道具や受付状況などの開始条件は、ゲーム内の案内で確認してください。</li><li>犯罪を始める前に、車両・服装の色、現場での行動、終了条件を確認してください。</li><li>罪状や犯罪の分類に応じた罰金・保護観察は、「ゲーム内法律・基本罰金と保護観察」にまとめています。</li></ul></section></section><section id="rulebook-crime-vehicles-and-colors"><h3>車両・ヘリ・服装のカラー</h3><p><a href="#vehicles-emergency-use">PD・EMS専用車両を無断で使用・窃盗しない（共通の本文）</a></p><p><a href="#vehicles-job-crime">JOB専用車両を犯罪に利用しない（共通の本文）</a></p><p><a href="#vehicles-crime-banned">犯罪禁止車両を犯罪に利用しない（共通の本文）</a></p><section id="crime-cruise-control"><h4>犯罪シーン中のクルーズコントロール禁止</h4><p>街の規定</p><p>犯罪シーン中にクルーズコントロールを使用することは禁止です。</p></section><section id="crime-helicopter-limits"><h4>犯罪シーンのヘリ台数</h4><p>街の規定</p><table><caption>犯罪者側のヘリ最大台数</caption><thead><tr><th>分類・犯罪</th><th>最大台数</th></tr></thead><tbody><tr><td data-label="分類・犯罪">小型</td><td data-label="最大台数">使用不可</td></tr><tr><td data-label="分類・犯罪">準中型（チェイス）</td><td data-label="最大台数">使用不可</td></tr><tr><td data-label="分類・犯罪">準中型（撃ち合い）</td><td data-label="最大台数">1台</td></tr><tr><td data-label="分類・犯罪">密輸バージ</td><td data-label="最大台数">4台</td></tr><tr><td data-label="分類・犯罪">中型</td><td data-label="最大台数">2台</td></tr><tr><td data-label="分類・犯罪">空母襲撃・海上油田・貨物船強盗</td><td data-label="最大台数">5台</td></tr><tr><td data-label="分類・犯罪">大型</td><td data-label="最大台数">3台</td></tr></tbody></table><p>PD側は、犯罪者側のヘリ台数に1台を加えた台数まで使用できます。</p><p>密輸バージ・空母襲撃・海上油田・貨物船強盗は、通常の分類より3台多い上限です。表の台数は1事件の最大台数であり、犯罪者側はこの上限を超えないでください。</p></section><section id="crime-scene-colors"><h4>犯罪シーンではカラーを揃える</h4><p>街の規定</p><p>犯罪時は、車両のメインカラーと服装の色を揃えてください。盗難車を使う場合も同じルールが適用されます。</p><p>近似色や、黒・白・グレーの使用は認められません。カラーの判断に迷う場合は、犯罪を始める前にPDへ確認してください。</p></section><section id="affiliation-colors"><h4>ギャングカラーの登録と使い方</h4><p>街の規定</p><p>ギャングカラーは設立時に運営へ登録してください。ギャング内のメインカラーは統一してください。</p><p>他ギャングの登録カラーを意図的に偽装したり、他ギャングになりすましたりしないでください。既存ギャングと識別しにくい色や、PD・EMSなどと誤認しやすい表現は避けてください。</p><p>犯罪シーン中は、登録カラーの有無にかかわらず、犯罪シーンのカラー統一規定に従ってください。</p></section><p><a href="#clothing-bulletproof-ban">防弾性能のある服装は禁止（共通の本文）</a></p></section><section id="rulebook-crime-negotiation-and-scene"><h3>人質交渉・チェイス・現場での行動</h3><section id="crime-chase-demands"><h4>チェイス犯罪で有効な対応</h4><p>街の規定</p><p>人質の解放条件として要求できる内容は、最大2項目までです。人質がNPCでもプレイヤーでも、条件は変わりません。</p><p>要求によってチェイスそのものが成立しなくなる場合などは、PD側が要求を断ることができます。ルールだけを機械的に適用せず、お互いが楽しめるよう、その場の雰囲気や状況を大切にしてください。</p><h5>PDが要求を断ることができる例</h5><ul><li>犯人側が高速車両を使っているのに、PD側へ「自転車のみ使用可能」と要求する場合。正常なチェイスが成立しないため、PDは断ることができます。</li><li>犯人側がニトロを使えるのに、PD側へ「ニトロ使用禁止」と要求する場合。直線を走るだけで一方的に逃走できてしまうため、PDは断ることができます。</li></ul></section><section id="crime-chase-attack-window"><h4>チェイス犯罪のアタック禁止時間</h4><p>街の規定</p><table><caption>車両の取得方法とアタック禁止時間</caption><thead><tr><th>車両</th><th>アタック禁止時間</th></tr></thead><tbody><tr><td data-label="車両">プレイヤー所有車（借りた車両を含む）</td><td data-label="アタック禁止時間">1分</td></tr><tr><td data-label="車両">盗難車両</td><td data-label="アタック禁止時間">3分</td></tr></tbody></table><p>この時間を超える要求はできません。ただし、クレーン強盗はアタック禁止時間に加えて2分まで要求できます。</p><h5>PDが定めるラインより上位のチェイス犯罪</h5><ul><li>ネタ犯罪は禁止です。</li><li>アタック禁止時間は1分です。</li><li>有人・無人を問わず、同じ条件を適用します。</li></ul></section><section id="crime-common-response"><h4>すべての犯罪で有効な対応</h4><p>街の規定</p><h5>犯罪現場周辺での職務質問</h5><p>PDは、犯罪現場周辺にいる住民に職務質問を行うことができます。職務質問を受けた方は、応じる必要があります。</p><h5>犯人を見失った後の現行犯逮捕</h5><p>PDが犯人を一度見失った場合でも、見失ってから10分以内であれば、現行犯として逮捕することができます。</p></section><section id="crime-scene-conduct"><h4>犯罪シーン中の共通ルール</h4><p>街の規定</p><ul><li>チェイス中に車両をガレージへ入れないでください。</li><li>犯罪シーン中は、車両・ヘリを修理しないでください。</li><li>ヘイストネットワークから参加していない人が、後からシーンへ参加することは禁止です。</li><li>終了した犯罪シーンへ復帰しないでください。</li></ul></section><p><a href="#safe-zone-conduct">セーフゾーンでの禁止行為と通過（共通の本文）</a></p></section><section id="rulebook-crime-end-and-recovery"><h3>完全包囲・シーン終了・ダウン・切断</h3><section id="crime-siege"><h4>中籠りと完全包囲の判定</h4><p>街の規定</p><h5>対象の犯罪</h5><p>ランドリー、ヴァンジェ、パレト、ヒューメイン、ボブキャット、美術館、カジノ、ユニオン、地下、山岳。</p><h5>① PDが現場を完全包囲する</h5><p>PDは現場を完全包囲したうえで、宣言の操作を行います。</p><h5>② ラジアルメニューから完全包囲を宣言する</h5><p>PDラジアルメニューの「完全包囲」から宣言します。宣言した時点から5分の計測を開始します。</p><p>完全包囲を宣言した時点から、その犯罪へのラークの介入は禁止です。</p><h5>③ PDが5回程度呼びかける</h5><p>計測中、PDは犯罪者側へ5回程度の呼びかけを行います。</p><h5>④ 宣言から5分後、PDが条件を確認して敗北を確定する</h5><p>宣言から5分が経過したら、PDが完全包囲・呼びかけ等の条件を確認したうえで、犯罪者側の敗北を確定します。</p><p>犯罪参加者の画面中央上部に残り時間を表示します。5分経過後は「PD確認待ち」となります。時間到達だけで自動的に敗北が確定するわけではありません。</p></section><section id="crime-scene-end"><h4>犯罪シーンが終了する条件</h4><p>街の規定</p><p>PDを振り切ってから5分が経過すると、犯罪シーンの終了とみなします。</p><ul><li>PDのサイレンが聞こえず、PDヘリも見えなくなった状態。</li><li>服装や車両などから、犯人と断定できなくなった状態。</li></ul><p>PDが犯人を見失ってから10分以内の現行犯逮捕については、「すべての犯罪で有効な対応」も確認してください。シーンの終了と現行犯逮捕の条件は別に定めています。</p></section><section id="crime-rejoin-combat"><h4>ゾンビ行為をしない</h4><p>街の規定</p><p>ダウンから蘇生・復帰した後、同じ戦闘へ戻って再参加する行為は禁止です。治療や身柄の扱いは、その場の案内に従ってください。</p><p>クラッシュからの再接続は、ダウンからの復帰と区別します。再開方法が分からない場合は運営へ相談してください。</p></section><section id="crime-down-information"><h4>ダウン中に戦況を伝えて有利にしない</h4><p>街の規定</p><p>自分がダウンしている間に戦況を共有し、生きている仲間を有利にしないでください。ゲーム内の会話や無線、外部VCなど、連絡手段にかかわらず同じです。</p><p>RP上自然な会話まで完全に禁止するものではありません。復帰直後に同じ戦闘へ戻ることについては「ゾンビ行為をしない」を確認してください。</p></section><section id="crime-combat-log"><h4>シーンから逃れるために退出しない</h4><p>街の規定</p><p>警察対応、犯罪、戦闘、交渉、その他進行中のRPの結果を避けたり、不利な状況をリセットしたりする目的で、故意に退出・切断しないでください。</p><p>クラッシュ、回線落ち、FiveMエラーなどの不可抗力は区別します。可能であれば再接続してRPを続け、関係者へ状況を伝えてください。戻れない場合は、可能になった時点でDiscordの「お問い合わせ窓口」へ連絡してください。</p></section><section id="crime-third-party"><h4>関係のないシーンを不正に壊さない</h4><p>街の規定</p><p>当事者とゲーム内での関わりがない場面へ、ゲーム外の情報を頼りに加勢したり、無関係な攻撃で結末を変えたりする行為は禁止です。</p><p>通りかかること、通常の通報や救護まで一律に禁止するものではありません。助けに入るときは、その場の安全とゲーム内での関わりを確認してください。</p></section></section><section id="rulebook-crime-bugs-and-rewards"><h3>不具合・重複受注への対応</h3><section id="crime-bug-response"><span id="crime-bug-options" aria-hidden="true"></span><span id="crime-bug-recurrence" aria-hidden="true"></span><h4>犯罪中の不具合対応・再実行・補填の手順</h4><p>街の規定</p><h5>1. PDへ連絡して現場確認</h5><p>不具合などで犯罪の進行が不可能になった場合は、速やかにPDへ連絡し、シーンを一時中断してください。</p><p>PDが現場へ向かい、不具合の状況を確認したうえで、リセットできるか判断します。</p><p>進行不能と判断された事件では、状況確認のために犯罪者側へボディカメラの提出を求める場合があります。</p><h5>2. リセット前に進行方法を選ぶ</h5><p>不具合リセットを行う前に、PDは犯罪者側へ今後の進行を確認してください。犯罪者側は、次のいずれかを選択します。</p><h5>① リセットして再実行</h5><p>不具合リセット後、同じ犯罪を最初から再度実行します。この選択をした場合は、必ず同じ犯罪を実行してください。</p><h5>② そのまま続行</h5><ul><li>犯罪者側から、金品を所持している想定となる1〜2名を選出します。</li><li>PDから開始の連絡があった後、指定された時間を「回収フェーズ」とします。</li><li>回収フェーズ中、選出された対象者はその場で手を上げて待機してください。</li><li>指定時間が終了した後は「逃走フェーズ」となり、逃走して構いません。</li></ul><h5>③ 中断</h5><p>その犯罪を中断します。中断後は、他の犯罪者が同じ犯罪を実行できる状態にしてください。</p><h5>3. 再実行後に、再び不具合が発生したら</h5><p>一度リセットして再実行した後に再び不具合が発生した場合は、②そのまま続行・③中断のどちらかを選択してください。</p><p>2回目以降は、再度リセットして最初からやり直す選択はできません。</p><h5>4. 成功後の補填を申請する場合</h5><p>不具合があった犯罪の成功後に補填を申請する場合は、チケットを発行し、ボディカメラを提出してください。ボディカメラの提出がない場合は補填できません。</p></section><section id="heist-duplicate"><h4>Heistの重複・リセットを悪用しない</h4><p>街の規定</p><p>報酬が二重に取れた場合や、本来の挙動と異なる結果になった場合は、追加利用を止め、チケットでお問い合わせください。事実を隠さないでください。</p><p>報酬や進行を不正に重複させたり、失敗や制限を不正なリセットで消したりする行為は禁止です。</p><p>PDの確認を受けた正規の不具合対応は、不正なリセットと区別します。「犯罪中の不具合対応・再実行・補填の手順」を確認してください。</p></section></section><section id="rulebook-crime-fines-and-law"><h3>罪状・罰金・保護観察・押収</h3><section id="weapons-crime-use"><h4>銃刀法違反の適用条件</h4><p>街の規定</p><p>犯罪時に武器を所持していた場合は、銃刀法違反の対象になります。罰金と保護観察時間は「ゲーム内法律・基本罰金と保護観察」を確認してください。</p><p>武器を使う場面でも、RP上の理由のない攻撃や殺害は禁止です。</p></section><section id="penalties-basic-fines"><span id="penalties-heist-fines" aria-hidden="true"></span><h4>ゲーム内法律・基本罰金と保護観察</h4><p>ゲーム内法律</p><p>ゲーム内の犯罪には、PDによる対応、罰金、保護観察、押収、インパウンドなどがあります。サーバールール違反に対する運営の対応とは区別します。</p><table><caption>基本罰金と保護観察</caption><thead><tr><th>罪状</th><th>罰金</th><th>保護観察時間</th><th>適用条件・補足</th></tr></thead><tbody><tr><td data-label="罪状">銃刀法違反</td><td data-label="罰金">750,000円</td><td data-label="保護観察時間">5分</td><td data-label="適用条件・補足">犯罪時に武器を所持していた場合に適用</td></tr><tr><td data-label="罪状">誘拐拉致監禁罪</td><td data-label="罰金">750,000円</td><td data-label="保護観察時間">—</td><td data-label="適用条件・補足">—</td></tr><tr><td data-label="罪状">NPC殺人罪</td><td data-label="罰金">1,250,000円</td><td data-label="保護観察時間">5分</td><td data-label="適用条件・補足">—</td></tr><tr><td data-label="罪状">プレイヤー殺人・未遂罪</td><td data-label="罰金">5,000,000円</td><td data-label="保護観察時間">10分</td><td data-label="適用条件・補足">—</td></tr><tr><td data-label="罪状">窃盗罪</td><td data-label="罰金">500,000円</td><td data-label="保護観察時間">10分</td><td data-label="適用条件・補足">車両窃盗に適用</td></tr><tr><td data-label="罪状">重窃盗罪</td><td data-label="罰金">25,000,000円</td><td data-label="保護観察時間">60分</td><td data-label="適用条件・補足">公務員の窃盗に適用</td></tr><tr><td data-label="罪状">公務執行妨害罪</td><td data-label="罰金">1,000,000円</td><td data-label="保護観察時間">5分</td><td data-label="適用条件・補足">—</td></tr><tr><td data-label="罪状">テロ罪</td><td data-label="罰金">2,500,000,000円</td><td data-label="保護観察時間">12時間</td><td data-label="適用条件・補足">警察署襲撃など</td></tr><tr><td data-label="罪状">汚職収賄罪</td><td data-label="罰金">2,500,000,000円</td><td data-label="保護観察時間">60分</td><td data-label="適用条件・補足">—</td></tr><tr><td data-label="罪状">業務妨害罪</td><td data-label="罰金">500,000,000円</td><td data-label="保護観察時間">60分</td><td data-label="適用条件・補足">店舗オーナーと応相談</td></tr><tr><td data-label="罪状">逃走補助罪</td><td data-label="罰金">逃走補助をした犯罪の罰金額の半額</td><td data-label="保護観察時間">30分</td><td data-label="適用条件・補足">個人医のみ適用</td></tr><tr><td data-label="罪状">セクハラ / カスハラ / パワハラ / 暴言</td><td data-label="罰金">5,000,000,000円</td><td data-label="保護観察時間">1日</td><td data-label="適用条件・補足">—</td></tr><tr><td data-label="罪状">公然わいせつ罪</td><td data-label="罰金">50円</td><td data-label="保護観察時間">24時間</td><td data-label="適用条件・補足">—</td></tr><tr><td data-label="罪状">詐欺罪</td><td data-label="罰金">12,500,000円</td><td data-label="保護観察時間">15分</td><td data-label="適用条件・補足">—</td></tr></tbody></table><p>適用された罪状、金額、保護観察時間はPDの説明を確認してください。表の「—」は時間や補足の指定がない欄で、独自の時間を補うものではありません。</p><p>プレイヤー本人へのハラスメントなどは、サーバールール違反として運営が対応する場合もあります。</p><h5>Heistの分類別の罰金・保護観察</h5><table><caption>Heistの罰金と保護観察</caption><thead><tr><th>分類</th><th>罰金</th><th>保護観察時間</th></tr></thead><tbody><tr><td data-label="分類">小型</td><td data-label="罰金">700,000円</td><td data-label="保護観察時間">15分</td></tr><tr><td data-label="分類">準中型チェイス</td><td data-label="罰金">3,500,000円</td><td data-label="保護観察時間">30分</td></tr><tr><td data-label="分類">準中型撃ち合い</td><td data-label="罰金">6,000,000円</td><td data-label="保護観察時間">30分</td></tr><tr><td data-label="分類">中型</td><td data-label="罰金">20,000,000円</td><td data-label="保護観察時間">45分</td></tr><tr><td data-label="分類">大型</td><td data-label="罰金">40,000,000円</td><td data-label="保護観察時間">60分</td></tr></tbody></table></section><section id="penalties-impound"><h4>インパウンドの回収料金と待機</h4><p>ゲーム内法律</p><table><caption>インパウンドの回収料金と押収時間</caption><thead><tr><th>区分</th><th>料金</th><th>押収時間</th></tr></thead><tbody><tr><td data-label="区分">一般</td><td data-label="料金">500,000円</td><td data-label="押収時間">0分</td></tr><tr><td data-label="区分">犯罪</td><td data-label="料金">1,000,000円</td><td data-label="押収時間">0分</td></tr></tbody></table><p>回収区分と料金を確認して手続きを進めてください。</p></section><section id="law-police-station-attack"><h4>警察署襲撃の定義と対象範囲</h4><p>ゲーム内法律</p><p>警察署に対して、武力または車両などを用いて攻撃し、警察業務などを妨害する行為を、警察署襲撃とします。</p><p>本署・砂漠署・北署の対象範囲は、以下の赤枠を確認してください。</p><figure class="rule-image"><a href="../assets/law-police-main.png" target="_blank" rel="noopener noreferrer"><img src="../assets/law-police-main.png" alt="本署の警察署襲撃対象範囲（赤枠）" loading="lazy" decoding="async" style="max-width:100%;height:auto"></a><figcaption>本署の対象範囲</figcaption></figure><figure class="rule-image"><a href="../assets/law-police-sandy.png" target="_blank" rel="noopener noreferrer"><img src="../assets/law-police-sandy.png" alt="砂漠署の警察署襲撃対象範囲（赤枠）" loading="lazy" decoding="async" style="max-width:100%;height:auto"></a><figcaption>砂漠署の対象範囲</figcaption></figure><figure class="rule-image"><a href="../assets/law-police-paleto.png" target="_blank" rel="noopener noreferrer"><img src="../assets/law-police-paleto.png" alt="北署の警察署襲撃対象範囲（赤枠）" loading="lazy" decoding="async" style="max-width:100%;height:auto"></a><figcaption>北署の対象範囲</figcaption></figure></section><section id="pd-community-service"><h4>社会奉仕活動について</h4><p>利用案内</p><p>NicoGuraには、プリズンに代わる、拘束されない社会奉仕活動の制度があります。期間中は犯罪などが制限されます。</p><p>適用された期間や制限の内容は、PDの説明を確認してください。罪状ごとの保護観察時間は「法律と罰金」で確認できます。</p></section></section><section id="rulebook-crime-crime-common-rules"><h3>犯罪中にも守る街の共通ルール</h3><p><a href="#rp-metagaming">ゲーム外の情報をRPに持ち込まない（共通の本文）</a></p><p><a href="#communication-external-vc">外部VCで有利な情報を共有しない（共通の本文）</a></p><p><a href="#rp-rdm">理由のない攻撃をしない（RDM）（共通の本文）</a></p><p><a href="#vehicles-vdm">車を使って故意に襲わない（VDM）（共通の本文）</a></p><p><a href="#rp-powergaming">パワーゲーミングをしない（共通の本文）</a></p><p><a href="#prohibited-cheating">チート・不正ツールを使わない（共通の本文）</a></p><p><a href="#prohibited-exploit">バグ・複製を意図的に悪用しない（共通の本文）</a></p><p><a href="#client-mod-policy">Citizen・Client側MODの使用条件（共通の本文）</a></p><p><a href="#prohibited-harassment">悪質な嫌がらせをしない（共通の本文）</a></p><p><a href="#prohibited-impersonation">運営や他のプレイヤーになりすまさない（共通の本文）</a></p><p><a href="#prohibited-evidence-fabrication">証拠を捏造しない（共通の本文）</a></p><p><a href="#streaming-respect">配信・SNSでも相手を大切に（共通の本文）</a></p></section></section><section id="rulebook-pd"><h2>PD側ルール</h2><p>PDの公開ルールと、犯罪対応・判定・処分に必要な共通規定です。</p><section id="rulebook-pd-pd-duty"><h3>職務・兼業・専用車両</h3><section id="pd-internal-rules"><h4>PDは内部ルールを守る</h4><p>街の規定</p><p>PDは、内部ルールを厳守してください。</p></section><p><a href="#job-authority-misuse">職業の権限や請求を悪用しない（共通の本文）</a></p><p><a href="#job-employment-limits">公務員の兼業禁止（共通の本文）</a></p><p><a href="#vehicles-emergency-use">PD・EMS専用車両を無断で使用・窃盗しない（共通の本文）</a></p><p><a href="#vehicles-job-crime">JOB専用車両を犯罪に利用しない（共通の本文）</a></p></section><section id="rulebook-pd-pd-scene"><h3>現場の人数・ヘリ・カラー・共通行動</h3><p><a href="#crime-current-list">犯罪カテゴリ・参加人数（共通の本文）</a></p><p><a href="#crime-types-guide">犯罪の種類と分類（共通の本文）</a></p><p><a href="#crime-helicopter-limits">犯罪シーンのヘリ台数（共通の本文）</a></p><p><a href="#crime-scene-colors">犯罪シーンではカラーを揃える（共通の本文）</a></p><p><a href="#crime-scene-conduct">犯罪シーン中の共通ルール（共通の本文）</a></p><p><a href="#crime-cruise-control">犯罪シーン中のクルーズコントロール禁止（共通の本文）</a></p><p><a href="#crime-restart-window">再起動前後の犯罪について（共通の本文）</a></p><p><a href="#crime-police-station-waiting">犯罪前に警察署の前で待機しない（共通の本文）</a></p><p><a href="#safe-zone-conduct">セーフゾーンでの禁止行為と通過（共通の本文）</a></p><p><a href="#clothing-bulletproof-ban">防弾性能のある服装は禁止（共通の本文）</a></p></section><section id="rulebook-pd-pd-negotiation"><h3>交渉・職務質問・逮捕・終了判定</h3><p><a href="#crime-chase-demands">チェイス犯罪で有効な対応（共通の本文）</a></p><p><a href="#crime-chase-attack-window">チェイス犯罪のアタック禁止時間（共通の本文）</a></p><p><a href="#crime-common-response">すべての犯罪で有効な対応（共通の本文）</a></p><p><a href="#crime-siege">中籠りと完全包囲の判定（共通の本文）</a></p><p><a href="#crime-scene-end">犯罪シーンが終了する条件（共通の本文）</a></p></section><section id="rulebook-pd-pd-down-and-bugs"><h3>ダウン・切断・第三者・不具合への対応</h3><p><a href="#crime-rejoin-combat">ゾンビ行為をしない（共通の本文）</a></p><p><a href="#crime-down-information">ダウン中に戦況を伝えて有利にしない（共通の本文）</a></p><p><a href="#crime-combat-log">シーンから逃れるために退出しない（共通の本文）</a></p><p><a href="#crime-third-party">関係のないシーンを不正に壊さない（共通の本文）</a></p><p><a href="#crime-bug-response">犯罪中の不具合対応・再実行・補填の手順（共通の本文）</a></p><p><a href="#heist-duplicate">Heistの重複・リセットを悪用しない（共通の本文）</a></p></section><section id="rulebook-pd-pd-penalties"><h3>処分の説明・罰金・保護観察・押収</h3><section id="pd-fines"><h4>PDの対応とゲーム内法律</h4><p>利用案内</p><p>ゲーム内犯罪は、PDによる対応、罰金、保護観察、押収、インパウンドなどの対象になります。犯罪RPをすること自体は街のコンテンツです。</p><p>PDはゲーム内法律に基づく罪状と処分を説明してください。市民も、罪状・請求額・保護観察時間が分からないときは、説明を求めて大丈夫です。</p><p>罪状別・Heist分類別の罰金と保護観察は「ゲーム内法律・基本罰金と保護観察」で、インパウンドの料金と待機時間は「インパウンド」で確認できます。サーバールール違反は運営対応の対象です。</p></section><p><a href="#weapons-crime-use">銃刀法違反の適用条件（共通の本文）</a></p><p><a href="#penalties-basic-fines">ゲーム内法律・基本罰金と保護観察（共通の本文）</a></p><p><a href="#penalties-impound">インパウンドの回収料金と待機（共通の本文）</a></p><p><a href="#law-police-station-attack">警察署襲撃の定義と対象範囲（共通の本文）</a></p><p><a href="#crime-probation">案内された参加制限を確認しよう（共通の本文）</a></p><p><a href="#pd-community-service">社会奉仕活動について（共通の本文）</a></p></section><section id="rulebook-pd-pd-common-rules"><h3>PDにも適用される街の共通ルール</h3><p><a href="#rp-metagaming">ゲーム外の情報をRPに持ち込まない（共通の本文）</a></p><p><a href="#communication-external-vc">外部VCで有利な情報を共有しない（共通の本文）</a></p><p><a href="#rp-rdm">理由のない攻撃をしない（RDM）（共通の本文）</a></p><p><a href="#vehicles-vdm">車を使って故意に襲わない（VDM）（共通の本文）</a></p><p><a href="#rp-powergaming">パワーゲーミングをしない（共通の本文）</a></p><p><a href="#prohibited-cheating">チート・不正ツールを使わない（共通の本文）</a></p><p><a href="#prohibited-exploit">バグ・複製を意図的に悪用しない（共通の本文）</a></p><p><a href="#client-mod-policy">Citizen・Client側MODの使用条件（共通の本文）</a></p><p><a href="#prohibited-harassment">悪質な嫌がらせをしない（共通の本文）</a></p><p><a href="#prohibited-impersonation">運営や他のプレイヤーになりすまさない（共通の本文）</a></p><p><a href="#prohibited-evidence-fabrication">証拠を捏造しない（共通の本文）</a></p><p><a href="#streaming-respect">配信・SNSでも相手を大切に（共通の本文）</a></p></section></section><section id="rulebook-ems"><h2>EMSルール</h2><p>EMSの公開ルールと、救護・復帰・救済機能の扱いをまとめています。</p><section id="rulebook-ems-ems-duty"><h3>職務・兼業・専用車両</h3><p><a href="#job-authority-misuse">職業の権限や請求を悪用しない（共通の本文）</a></p><p><a href="#job-employment-limits">公務員の兼業禁止（共通の本文）</a></p><p><a href="#vehicles-emergency-use">PD・EMS専用車両を無断で使用・窃盗しない（共通の本文）</a></p><p><a href="#vehicles-job-crime">JOB専用車両を犯罪に利用しない（共通の本文）</a></p></section><section id="rulebook-ems-ems-emergency"><h3>救済機能・現場への介入・復帰後のルール</h3><section id="ems-emergency-use"><h4>緊急救済機能を悪用しない</h4><p>街の規定</p><p>EMSが不在の場合や救助が不可能な場所にいる場合など、緊急時に利用する救済機能を悪用することは禁止です。EMSやPDから指示がある場合も利用できます。</p><p>移動と蘇生は別の機能です。利用するときは、各機能の条件と画面の案内を確認してください。</p></section><p><a href="#crime-third-party">関係のないシーンを不正に壊さない（共通の本文）</a></p><p><a href="#crime-rejoin-combat">ゾンビ行為をしない（共通の本文）</a></p><p><a href="#crime-down-information">ダウン中に戦況を伝えて有利にしない（共通の本文）</a></p><p><a href="#crime-combat-log">シーンから逃れるために退出しない（共通の本文）</a></p></section><section id="rulebook-ems-ems-care-guide"><h3>救護・治療・料金の案内</h3><section id="ems-request"><h4>ダウンしたら救護要請を送ろう</h4><p>利用案内</p><p>ダウン画面でGキーを押すと救護要請を送れます。キー割り当てを変更している場合は、対応するキーを使ってください。画面の受付通知を確認しましょう。</p><p>EMSは治療・蘇生・搬送・救急対応を担当します。現場の安全確認が必要なこともあるため、案内を待ち、分かる範囲で状況を伝えてください。</p><p>ダウン中で銀行残高から料金を支払える場合は、EMSの勤務人数にかかわらず /help で有料の救急処置を依頼できます。利用方法と料金は「緊急時の搬送と救済コマンド」を確認してください。</p></section><section id="ems-care"><h4>EMSの救急対応について</h4><p>利用案内</p><p>EMSは治療、蘇生、搬送、救急対応、整形などを行います。現場の安全確認が必要な場合もあるため、案内に従ってください。</p><p>医療サービスの種類や料金が分からない場合は、担当者へ確認してください。</p><p>救護機能の利用条件と、復帰後の戦闘再参加に関するルールも確認してください。</p></section><section id="ems-fees"><h4>医療サービスの料金</h4><p>利用案内</p><table><caption>医療サービス料金</caption><thead><tr><th>サービス</th><th>価格</th><th>内容</th></tr></thead><tbody><tr><td data-label="サービス">通常治療</td><td data-label="価格">300,000円</td><td data-label="内容">EMSによる治療</td></tr><tr><td data-label="サービス">院内蘇生</td><td data-label="価格">1,000,000円</td><td data-label="内容">EMS施設内での蘇生</td></tr><tr><td data-label="サービス">現場蘇生・運搬</td><td data-label="価格">1,500,000円</td><td data-label="内容">現場での蘇生・EMSへの運搬</td></tr><tr><td data-label="サービス">牢屋対応</td><td data-label="価格">2,000,000円</td><td data-label="内容">PD牢屋内での対応</td></tr><tr><td data-label="サービス">NPC治療</td><td data-label="価格">300,000円</td><td data-label="内容">病院受付NPCによる治療</td></tr><tr><td data-label="サービス">院内NPC蘇生</td><td data-label="価格">1,000,000円</td><td data-label="内容">病院受付NPCによる蘇生</td></tr><tr><td data-label="サービス">/help（NPC救急）</td><td data-label="価格">1,500,000円</td><td data-label="内容">ダウン中に依頼する有料の救急処置。銀行から支払い</td></tr></tbody></table><p>NPC治療・院内NPC蘇生と、現場で依頼する /help は別のサービスです。利用するサービス名と料金を確認してください。</p><p>対応内容や場所が変わる場合は、担当者に内容と料金を確認してください。利用方法はゲーム内の案内に従ってください。</p></section><section id="ems-supplies"><span id="ems-bandage" aria-hidden="true"></span><span id="ems-painkiller" aria-hidden="true"></span><span id="ems-ifak" aria-hidden="true"></span><span id="ems-injuries" aria-hidden="true"></span><h4>EMS専売品</h4><p>利用案内</p><table><caption>EMS専売品の価格と効果</caption><thead><tr><th>品目</th><th>価格</th><th>効果</th><th>販売区分</th></tr></thead><tbody><tr><td data-label="品目">包帯</td><td data-label="価格">250,000円</td><td data-label="効果">一時的な止血</td><td data-label="販売区分">EMS専売品</td></tr><tr><td data-label="品目">鎮痛剤</td><td data-label="価格">250,000円</td><td data-label="効果">痛み・症状の一時的な緩和</td><td data-label="販売区分">EMS専売品</td></tr><tr><td data-label="品目">IFAK</td><td data-label="価格">200,000円</td><td data-label="効果">体力25％回復のみ</td><td data-label="販売区分">EMS専売品</td></tr></tbody></table><h5>応急処置と治療の違い</h5><p>包帯は一時的に出血を抑え、鎮痛剤は痛み・症状を一時的に緩和します。完治ではなく、時間がたつと症状が再発する場合があります。</p><p>IFAKは体力を25％回復する応急処置用品です。怪我や症状を完全に治療するものではありません。</p><p>怪我・出血・症状を完治させるには、EMSによる治療を受けてください。症状がある場合は、EMSへ相談してください。</p></section><section id="ems-emergency-commands"><h4>緊急時の搬送と救済コマンド</h4><p>利用案内</p><h5>/tpems：病院への移動</h5><p>救助が困難な状況などで /tpems を使用するときは、利用理由を記入してください。記入した理由は運営が確認します。</p><p>/tpems は病院へ移動する機能です。蘇生や体力回復は行いません。移動後は、EMSや利用可能な治療の案内を確認してください。</p><h5>/help：有料の救急処置</h5><p>/help は /tpems とは別の機能です。ダウン中で銀行残高から料金を支払える場合に、有料の救急処置を依頼できます。EMSが勤務中でも利用できます。EMSへの救護要請は、引き続きダウン画面から送れます。</p><p>車内や拘束・収監中でも救急処置を依頼できます。手錠や収監などの状態が解除される機能ではありません。道路へ安全に移動できない場合は、その場で処置します。NPCを安全に配置できない場合や救助が重なった場合も、NPCの到着を待たずに処置を受けられます。画面の案内を確認してください。</p><p>/help の料金は「医療サービスの料金」で確認できます。病院受付NPCで受ける治療・蘇生とは別のサービスです。</p><p>緊急救済の悪用は禁止です。EMS・PDから指示がある場合も、機能自体の利用条件に従ってください。</p></section></section><section id="rulebook-ems-ems-common-rules"><h3>EMSにも適用される街の共通ルール</h3><p><a href="#rp-metagaming">ゲーム外の情報をRPに持ち込まない（共通の本文）</a></p><p><a href="#communication-external-vc">外部VCで有利な情報を共有しない（共通の本文）</a></p><p><a href="#prohibited-harassment">悪質な嫌がらせをしない（共通の本文）</a></p><p><a href="#prohibited-impersonation">運営や他のプレイヤーになりすまさない（共通の本文）</a></p><p><a href="#prohibited-cheating">チート・不正ツールを使わない（共通の本文）</a></p><p><a href="#prohibited-exploit">バグ・複製を意図的に悪用しない（共通の本文）</a></p><p><a href="#streaming-respect">配信・SNSでも相手を大切に（共通の本文）</a></p><p><a href="#safe-zone-conduct">セーフゾーンでの禁止行為と通過（共通の本文）</a></p><p><a href="#clothing-bulletproof-ban">防弾性能のある服装は禁止（共通の本文）</a></p></section></section><p><a href="https://discord.gg/Fzhhp34JJy">公式Discord</a> / <a href="https://x.com/NicoGura0810">公式X</a></p><p>検索・保存機能にはJavaScriptを有効にしてください。</p></div></noscript>
