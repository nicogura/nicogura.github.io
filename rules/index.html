    <noscript><div class="noscript"><h1>公式ルール</h1><p>街のみんなが気持ちよく遊ぶための、ライトRPとマナーの約束。検索やカテゴリーから必要な項目を確認できます。</p><p>最終更新 2026-10-10</p><nav><a href="../">NicoGura | にこぐら 公式ルール・参加ガイド</a> / <a href="../rules/">公式ルール</a> / <a href="../join/">参加方法</a> / <a href="../character/">キャラクター</a> / <a href="../economy/">経済・料金</a> / <a href="../crime/">犯罪RP</a> / <a href="../law/">法律・罰金</a> / <a href="../guides/">街ガイド</a> / <a href="../pd/">PD・警察</a> / <a href="../ems/">EMS・救急</a> / <a href="../mechanic/">メカニック</a> / <a href="../shops/">店舗</a> / <a href="../lifejobs/">Life Job</a> / <a href="../gangs/">ギャング</a> / <a href="../faq/">よくある質問</a> / <a href="../contact/">お問い合わせ</a></nav><section><h2>NicoGuraへようこそ</h2><p>NicoGura（にこぐら）は、みんなでゆっくり街での生活を楽しむライトRPサーバーです。FiveM初心者もRP初心者も歓迎します。完璧な演技や、細かなキャラクター設定は必要ありません。</p><p>ゲーム内では「この街に暮らす一人の市民」という意識を持って、仕事や会話、街で起きる出来事を楽しんでください。自分だけでなく、一緒にいる人も楽しめる行動を大切にしましょう。</p><p>ルールはみんなが気持ちよく遊ぶための最低限の約束です。分からないことは、公式Discordの「お問い合わせ窓口」から確認できます。</p></section>
<section><h2>NicoGuraのライトRP</h2><ul><li>完璧な演技や細かなキャラクター背景設定は不要です。</li><li>声色を変える必要もありません。RP初心者、FiveM初心者も歓迎します。</li><li>ゲーム内では、この街に暮らすキャラクターとして行動しましょう。</li><li>他の市民のRPを壊さず、相手も楽しめる遊び方を意識してください。</li></ul><p>自然な会話や出来事のやり取りを楽しめれば大丈夫です。細かな演技方法や、厳密なキャラクター経歴を求めるものではありません。</p></section>
<section><h2>相手の楽しみも大切に</h2><p>RP上の対立や口論と、プレイヤー本人への攻撃は別です。ゲーム内で役として対立しても、現実の人格への誹謗中傷や嫌がらせにつなげないでください。</p><p>相手が話したり行動したりできる余地を残し、自分と相手の両方が楽しめる遊び方を心がけましょう。RPとして成立するゲーム内の対立まで、一律に禁止するものではありません。</p></section>
<section><h2>1人につき1キャラクター</h2><p>複数キャラクターやサブキャラクターを使い分けることはできません。別アカウントなどを利用して、実質的に複数キャラクターを使用する行為も禁止します。</p><p>キャラクターを作り直したい場合などは、勝手に追加キャラクターを作らず、運営へ相談してください。</p></section>
<section><h2>理由のない攻撃をしない（RDM）</h2><p>通りすがりの人へ無差別に発砲するなど、RP上の関わりがない攻撃をしないでください。「犯罪者のキャラクターだから」という理由だけで、誰でも攻撃できるわけではありません。</p><p>進行中の犯罪RPや対立は、前後のやり取りと状況を含めて判断します。</p></section>
<section><h2>車を使って故意に襲わない（VDM）</h2><p>人を狙って轢く、嫌がらせのために繰り返し体当たりをするなどの行為をしないでください。</p><p>普通の交通事故をVDMとして扱うものではありません。故意かどうかや前後のRPの流れを含め、状況を確認します。</p></section>
<section><h2>ゲーム外の情報をRPに持ち込まない</h2><p>Discord、配信、他人の画面、ゲーム外チャット、運営画面、外部ツールなどで得た位置・人数・計画・身元を、自分のキャラクターが知っている情報として利用しないでください。</p><p>偶然情報が見えたり聞こえたりした場合も、ゲーム内の行動や仲間への連絡に利用しないでください。ゲームの状況に影響しない普段の雑談まで禁止するものではありません。</p></section>
<section><h2>配信の情報をゲーム内で利用しない</h2><p>配信画面から相手の位置を探して追跡や待ち伏せをしたり、作戦を仲間へ伝えたりしないでください。自分のキャラクターが街の中で知った情報を使って遊びましょう。</p></section>
<section><h2>外部VCで有利な情報を共有しない</h2><p>犯罪、警察対応、戦闘、チェイス、ギャング活動などで、Discord等の外部VCを使って位置・人数・作戦を共有し、ゲーム内で有利になる行為は禁止です。</p><p>友達同士で普通に話すこと自体は厳しく禁止しません。雑談中にシーンの情報が入っても、ゲーム内の行動や仲間への指示に利用しないでください。</p></section>
<section><h2>結果を一方的に押し付けない</h2><p>相手の反応を無視して「こうなったことにする」と結果を押し付けないでください。会話や行動のやり取りを通じて、相手も参加できる場面をつくりましょう。</p><p>NicoGuraはライトRPです。細かな演技方法や言い回しまで強制するものではありません。</p></section>
<section><h2>シーンから逃れるために退出しない</h2><p>警察対応、犯罪、戦闘、交渉、その他進行中のRPの結果を避けたり、不利な状況をリセットしたりする目的で、故意に退出・切断しないでください。</p><p>クラッシュ、回線落ち、FiveMエラーなどの不可抗力は区別します。可能であれば再接続してRPを続け、関係者へ状況を伝えてください。戻れない場合は、可能になった時点でDiscordの「お問い合わせ窓口」へ連絡してください。</p></section>
<section><h2>ダウン中に戦況を伝えて有利にしない</h2><p>自分がダウンしている間に戦況を共有し、生きている仲間を有利にしないでください。ゲーム内の会話や無線、外部VCなど、連絡手段にかかわらず同じです。</p><p>RP上自然な会話まで完全に禁止するものではありません。復帰直後に同じ戦闘へ戻ることについては「復帰直後に同じ戦闘へ戻らない」を確認してください。</p></section>
<section><h2>復帰直後に同じ戦闘へ戻らない</h2><p>蘇生や復帰を使って、同じ戦闘へ繰り返し参加しないでください。まず治療や身柄の扱いなど、その場の案内を確認してください。</p><p>クラッシュからの再接続は、ダウンからの復帰とは区別します。再開方法が分からない場合は運営へ相談してください。独自の待機時間や記憶喪失の条件をこの案内で追加するものではありません。</p></section>
<section><h2>自分のRP観を押し付けない</h2><p>「そのRPは間違っている」「もっとキャラになりきれ」と、自分のRP観を他人へ押し付けることは避けてください。経験や遊び方には違いがあります。</p><p>困ったことは短く確認し、相手を責めるためにシーンを止め続けないようお願いします。ルールに関わる問題は運営へ相談してください。</p></section>
<section><h2>【運営や市民の妨げになると判断された場合】</h2><p>本ルールに個別の記載がない行為であっても、運営や市民の活動・RP・サーバー運営の妨げになると運営が判断した場合、警告・キック・一時BAN・永久BAN等の対応を行う場合があります。</p><p>ルールに書いていないことを利用した悪質な抜け穴行為についても同様です。</p></section>
<section><h2>対応は状況・悪質性に応じて判断します</h2><p>違反の状況、悪質性、繰り返しの有無などを確認して対応します。すべての違反に固定の罰則や、必ず同じ順番の対応を設けるものではありません。</p><p>チート、RMT、Duplication、BAN回避、重大な荒らし、サーバー攻撃などは、初回から重い対応になる場合があります。</p><p>ゲーム内の犯罪に対するPDの罰金や刑務と、サーバールール違反に対する運営対応は別です。処分に関する相談や異議はDiscordの「お問い合わせ窓口」へ連絡してください。</p></section>
<section><h2>困ったときはお問い合わせへ</h2><p>荒らしや違反を見つけても、ゲーム内で仕返しをしたり、長時間口論を続けたりせず、公式Discordの「お問い合わせ窓口」へ相談してください。公式Discord：https://discord.gg/Fzhhp34JJy</p><ul><li>いつ・どこで何が起きたか。</li><li>誰が関わり、どのような状況だったか。</li><li>動画やスクリーンショットがある場合は、確認してほしい箇所。</li></ul><p>常時録画は必須ではありません。プレイヤー通報、アイテム消失、重大不具合、補填申請、処分への異議は、録画等があると確認しやすくなります。証拠がない場合も、分かる範囲で状況を伝えてください。</p></section>
<section><h2>相手と一緒にRPを楽しもう</h2><p>キャラクターとして街で経験したことをもとに、会話や行動を楽しんでください。操作ミスや言い間違いがあっても、すぐに相手を責めず、必要なことを短く確認し合いましょう。</p><p>相手の会話や出来事を尊重し、関係のない場面へ繰り返し割り込んで遊びを止めないようお願いします。困ったときは、運営へ相談して大丈夫です。</p></section>
<section><h2>チート・不正ツールを使わない</h2><p>不正な照準・透視・改変などで有利になる行為や、サーバーを攻撃して他の市民のプレイを妨げる行為をしないでください。</p><p>放置、BOT、自動化によって稼ぐ行為も禁止です。利用する機能やツールの扱いに迷う場合は、使う前にDiscordの「お問い合わせ窓口」から確認してください。</p></section>
<section><h2>バグ・複製を意図的に悪用しない</h2><ul><li>Money DuplicationやItem Duplicationによる資金・アイテムの複製や増殖。</li><li>不正アイテム生成、不正な報酬取得、通常想定されていない手段での不正取得。</li><li>バグを反復利用して利益を得たり、不正に有利な状態を作ったりする行為。</li></ul><p>不具合を見つけたら悪用せず、利用を止めてDiscordの「お問い合わせ窓口」へ報告してください。</p><p>偶然の不具合や操作ミスそのものは、故意の悪用とは区別します。気づいた時点で追加利用を止め、状況や発生時刻を伝えてください。</p></section>
<section><h2>ゲーム内資産と現実の対価を交換しない</h2><p>現実のお金や換金できる対価と引き換えにゲーム内資産を受け渡したり、取引を持ちかけたりしないでください。</p></section>
<section><h2>悪質な嫌がらせをしない</h2><ul><li>現実の人格への誹謗中傷、差別、執拗な暴言。</li><li>粘着、つきまとい、嫌がらせ、性的な嫌がらせなどのハラスメント。</li><li>個人情報晒しや、現実のトラブルへ発展させる行為。</li></ul><p>ゲーム内、配信、SNSでも相手本人を尊重してください。嫌なことがあったときは、仕返しや長時間の口論を続けず、距離を取って運営へ相談しましょう。</p><p>RPとして成立するキャラクター同士の対立と、プレイヤー本人への攻撃は区別します。</p></section>
<section><h2>運営や他のプレイヤーになりすまさない</h2><p>運営権限があると偽って従わせる、他のプレイヤーの本人確認を装うなどの行為をしないでください。キャラクターの変装を楽しむ場合も、実在の運営やプレイヤー本人との誤認を狙わないでください。</p></section>
<section><h2>聞き取りやすい会話に協力しよう</h2><p>大きな音や連続した呼びかけで、他の人の会話を妨げないようお願いします。マイクの不調や音量に気づいたら、短く伝え合って調整しましょう。声色を変えたり、上手に演技したりする必要はありません。</p></section>
<section><h2>周りの人と車に気を配ろう</h2><p>店舗や救護の近くでは周囲に気を配り、他の人の活動を長く妨げないようお願いします。事故や接触が起きたときは、状況を短く伝え合いましょう。</p></section>
<section><h2>配信・SNSでも相手を大切に</h2><p>配信者や視聴者も、一緒に街を楽しむ人です。ゲーム内の対立を、現実の人格への攻撃やSNSでの粘着につなげないでください。</p><p>現実の個人情報や私的な画面が写り込まないよう気を配ってください。配信で得た位置や作戦をゲーム内へ持ち込む行為は、配信ゴースティングとして禁止します。</p></section>
<section><h2>BANやWhitelistの制限を回避しない</h2><p>正規の承認や処分を、別アカウントや不正な手段で回避しないでください。承認や処分について確認したいことがある場合は、Discordの「お問い合わせ窓口」へ連絡してください。</p></section>
<section><h2>証拠を捏造しない</h2><p>事実確認のため、起きたことを分かる範囲で正確に伝えてください。証拠がないことや記憶が曖昧なことは、そのまま説明して大丈夫です。</p></section><p><a href="https://discord.gg/Fzhhp34JJy">公式Discord</a> / <a href="https://x.com/NicoGura0810">公式X</a></p><p>検索・保存機能にはJavaScriptを有効にしてください。</p></div></noscript>
