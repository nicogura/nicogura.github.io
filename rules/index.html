    <noscript><div class="noscript"><h1>公式ルール</h1><p>街のみんなが気持ちよく遊ぶための、ライトRPとマナーの約束。検索やカテゴリーから必要な項目を確認できます。</p><p>最終更新 2026-11-05</p><nav><a href="../">NicoGura | にこぐら 公式ルール・参加ガイド</a> / <a href="../rules/">公式ルール</a> / <a href="../join/">参加方法</a> / <a href="../server/">サーバー情報</a> / <a href="../mods/">MOD・グリッチ</a> / <a href="../character/">キャラクター</a> / <a href="../economy/">経済・料金</a> / <a href="../crime/">犯罪RP</a> / <a href="../law/">法律・罰金</a> / <a href="../guides/">にこぐらガイド</a> / <a href="../pd/">PD・警察</a> / <a href="../ems/">EMS・救急</a> / <a href="../mechanic/">メカニック</a> / <a href="../shops/">店舗</a> / <a href="../lifejobs/">Life Job</a> / <a href="../gangs/">ギャング</a> / <a href="../faq/">よくある質問</a> / <a href="../contact/">お問い合わせ</a></nav><section id="basic-respect"><h2>相手の楽しみも大切に</h2><p>RP上の対立や口論と、プレイヤー本人への攻撃は別です。ゲーム内で役として対立しても、現実の人格への誹謗中傷や嫌がらせにつなげないでください。</p><p>相手が話したり行動したりできる余地を残し、自分と相手の両方が楽しめる遊び方を心がけましょう。RPとして成立するゲーム内の対立まで、一律に禁止するものではありません。</p></section>
<section id="rp-back-and-forth"><h2>相手と一緒にRPを楽しもう</h2><p>キャラクターとして街で経験したことをもとに、会話や行動を楽しんでください。操作ミスや言い間違いがあっても、すぐに相手を責めず、必要なことを短く確認し合いましょう。</p><p>相手の会話や出来事を尊重し、関係のない場面へ繰り返し割り込んで遊びを止めないようお願いします。困ったときは、運営へ相談して大丈夫です。</p></section>
<section id="character-identity"><h2>1人につき1キャラクター</h2><p>NicoGuraで使用できるキャラクターは、1人のプレイヤーにつき1人までです。複数キャラクターや別アカウントを使い分けて、実質的に複数のキャラクターを使用することはできません。</p></section>
<section id="rp-metagaming"><h2>ゲーム外の情報をRPに持ち込まない</h2><p>Discord、配信、他人の画面、ゲーム外チャット、運営画面、外部ツールなどで得た位置・人数・計画・身元を、自分のキャラクターが知っている情報として利用しないでください。</p><p>偶然情報が見えたり聞こえたりした場合も、ゲーム内の行動や仲間への連絡に利用しないでください。ゲームの状況に影響しない普段の雑談まで禁止するものではありません。</p></section>
<section id="rp-rdm"><h2>理由のない攻撃をしない（RDM）</h2><p>通りすがりの人へ無差別に発砲するなど、RP上の関わりがない攻撃をしないでください。「犯罪者のキャラクターだから」という理由だけで、誰でも攻撃できるわけではありません。</p><p>進行中の犯罪RPや対立は、前後のやり取りと状況を含めて判断します。</p></section>
<section id="prohibited-cheating"><h2>チート・不正ツールを使わない</h2><p>チート、不正ツール、マクロなどを利用して、自分が有利になる行為は禁止です。Mod Menu、Aimbot、ESP、Wallhackなどの不正な照準・透視・改変も含みます。</p><p>これらを使ったサーバーへの攻撃や、他のプレイヤーのプレイを妨げる行為は禁止です。放置、BOT、自動化によって稼ぐ行為も行わないでください。</p></section>
<section id="prohibited-exploit"><h2>バグ・複製を意図的に悪用しない</h2><p>資金・アイテム・報酬を複製したり、不正に取得したりする行為は禁止です。通常のプレイでは到達・発揮できない行為や挙動も悪用しないでください。</p><ul><li>グリッチロール、スピードブースト、無線撃ち。</li><li>ヘリのドアを開けた状態での走行など、通常想定されていない挙動の利用。</li></ul><p>不具合に気づいたら追加利用を止め、発生時刻や状況をチケットで報告してください。複製や重大な脆弱性の再現方法は公開・拡散しないでください。</p><p>偶然の不具合や操作ミスと、故意の悪用は区別します。</p></section>
<section id="prohibited-rmt"><h2>ゲーム内資産と現実の対価を交換しない</h2><p>現実のお金や換金できる対価と引き換えにゲーム内資産を受け渡したり、取引を持ちかけたりしないでください。</p></section>
<section id="prohibited-harassment"><h2>悪質な嫌がらせをしない</h2><ul><li>現実の人格への誹謗中傷、差別、暴言。</li><li>粘着、つきまとい、性的な嫌がらせなどのハラスメント。</li><li>個人情報晒しや恐喝など、現実のトラブルへ発展させる行為。</li></ul><p>嫌なことがあっても、仕返しや長時間の口論を続けず、距離を取って運営へ相談してください。ゲーム内、配信、SNSでも、相手本人を尊重しましょう。</p><p>RPとして成立するキャラクター同士の対立と、プレイヤー本人への攻撃は区別します。</p></section>
<section id="prohibited-impersonation"><h2>運営や他のプレイヤーになりすまさない</h2><p>運営、PD・EMSなどの公務員、他のプレイヤーへのなりすましは禁止です。権限があると偽って従わせたり、本人の指示や本人確認を装ったりしないでください。</p></section>
<section id="communication-external-vc"><h2>外部VCで有利な情報を共有しない</h2><p>犯罪、警察対応、戦闘、チェイス、ギャング活動などで、Discord等の外部VCを使って位置・人数・作戦・敵情報を共有し、ゲーム内で有利になる行為は禁止です。</p><p>Discord等で友達同士が普通に会話すること自体は禁止しません。雑談中にシーンの情報が入っても、ゲーム内の行動や仲間への指示に利用しないでください。</p></section>
<section id="vehicles-vdm"><h2>車を使って故意に襲わない（VDM）</h2><p>人を狙って轢く、嫌がらせのために繰り返し体当たりをするなどの行為をしないでください。</p><p>普通の交通事故をVDMとして扱うものではありません。故意かどうかや前後のRPの流れを含め、状況を確認します。</p></section>
<section id="crime-combat-log"><h2>シーンから逃れるために退出しない</h2><p>警察対応、犯罪、戦闘、交渉、その他進行中のRPの結果を避けたり、不利な状況をリセットしたりする目的で、故意に退出・切断しないでください。</p><p>クラッシュ、回線落ち、FiveMエラーなどの不可抗力は区別します。可能であれば再接続してRPを続け、関係者へ状況を伝えてください。戻れない場合は、可能になった時点でDiscordの「お問い合わせ窓口」へ連絡してください。</p></section>
<section id="crime-third-party"><h2>関係のないシーンを不正に壊さない</h2><p>当事者とゲーム内での関わりがない場面へ、ゲーム外の情報を頼りに加勢したり、無関係な攻撃で結末を変えたりする行為は禁止です。</p><p>通りかかること、通常の通報や救護まで一律に禁止するものではありません。助けに入るときは、その場の安全とゲーム内での関わりを確認してください。</p></section>
<section id="crime-rejoin-combat"><h2>ゾンビ行為をしない</h2><p>ダウンから蘇生・復帰した後、同じ戦闘へ戻って再参加する行為は禁止です。治療や身柄の扱いは、その場の案内に従ってください。</p><p>クラッシュからの再接続は、ダウンからの復帰と区別します。再開方法が分からない場合は運営へ相談してください。</p></section>
<section id="rp-powergaming"><h2>パワーゲーミングをしない</h2><p>通常のプレイでは到達不可能な行為や、シーン中にロード・テレポートを挟む場所へ侵入する行為は禁止です。</p><p>相手とのやり取りでは、結果を一方的に押し付けず、相手が反応できる余地を残してください。</p></section>
<section id="rp-no-pressure"><h2>自分のRP観を押し付けない</h2><p>「そのRPは間違っている」「もっとキャラになりきれ」と、自分のRP観を他人へ押し付けることは避けてください。経験や遊び方には違いがあります。</p><p>困ったことは短く確認し、相手を責めるためにシーンを止め続けないようお願いします。ルールに関わる問題は運営へ相談してください。</p></section>
<section id="crime-down-information"><h2>ダウン中に戦況を伝えて有利にしない</h2><p>自分がダウンしている間に戦況を共有し、生きている仲間を有利にしないでください。ゲーム内の会話や無線、外部VCなど、連絡手段にかかわらず同じです。</p><p>RP上自然な会話まで完全に禁止するものではありません。復帰直後に同じ戦闘へ戻ることについては「復帰直後に同じ戦闘へ戻らない」を確認してください。</p></section>
<section id="prohibited-ban-evasion"><h2>BANやWhitelistの制限を回避しない</h2><p>正規の承認や処分を、別アカウントや不正な手段で回避しないでください。承認や処分について確認したいことがある場合は、Discordの「お問い合わせ窓口」へ連絡してください。</p></section>
<section id="prohibited-evidence-fabrication"><h2>証拠を捏造しない</h2><p>事実確認のため、起きたことを分かる範囲で正確に伝えてください。証拠がないことや記憶が曖昧なことは、そのまま説明して大丈夫です。</p><p>状況を確認できるよう、ボディカメラで記録を残すことを推奨します。録画の有無や記憶が曖昧な点は、そのまま説明してください。</p></section>
<section id="client-mod-policy"><h2>Citizen・Client側MODの使用条件</h2><p>Citizen・Client側MODは原則禁止です。例外的に使用を認める場合があるため、使用前に公式Discordのチケットで運営へお問い合わせください。</p><p>軽量化や見た目・音の変更であっても、自己判断で使用できる例外にはなりません。導入したいMODの内容を伝え、運営の回答を確認してください。</p></section>
<section id="vehicles-emergency-use"><h2>PD・EMS専用車両を無断で使用・窃盗しない</h2><p>PD・EMS専用車両を、権限のない市民が無断で使用・窃盗する行為は禁止します。</p><p>PD・EMSの緊急車両や公務用車両を、単なる移動手段として無断利用することも禁止です。</p></section>
<section id="vehicles-job-crime"><h2>JOB専用車両を犯罪に利用しない</h2><p>PD・EMS・タクシー・バスなど、JOB専用として用意されている車両を犯罪行為に利用することは禁止します。</p><p>対象は、JOBの業務用として用意された専用車両です。通常の市販車や個人所有車まで、このルールで一律に禁止するものではありません。</p></section>
<section id="vehicles-crime-banned"><h2>犯罪禁止車両を犯罪に利用しない</h2><p>車両に乗ったときに「犯罪禁止車両」と表示される車両を、犯罪に利用することは禁止です。</p></section>
<section id="crime-cruise-control"><h2>犯罪シーン中のクルーズコントロール禁止</h2><p>犯罪シーン中にクルーズコントロールを使用することは禁止です。</p></section>
<section id="heist-duplicate"><h2>Heistの重複・リセットを悪用しない</h2><p>報酬が二重に取れた場合や、本来の挙動と異なる結果になった場合は、追加利用を止め、チケットでお問い合わせください。事実を隠さないでください。</p><p>報酬や進行を不正に重複させたり、失敗や制限を不正なリセットで消したりする行為は禁止です。</p><p>PDの確認を受けた正規の不具合対応は、不正なリセットと区別します。「犯罪中に不具合が発生した場合」を確認してください。</p></section>
<section id="crime-current-list"><h2>犯罪カテゴリ・参加人数</h2><table><caption>犯罪カテゴリ・参加人数</caption><thead><tr><th>分類</th><th>犯罪名・区分</th><th>犯罪者側</th><th>PD側</th><th>補足</th></tr></thead><tbody><tr><td data-label="分類">小型</td><td data-label="犯罪名・区分">通常</td><td data-label="犯罪者側">2人</td><td data-label="PD側">2～3人</td><td data-label="補足"></td></tr><tr><td data-label="分類">小型</td><td data-label="犯罪名・区分">ATM</td><td data-label="犯罪者側">1人</td><td data-label="PD側">2～3人</td><td data-label="補足"></td></tr><tr><td data-label="分類">準中型（チェイス）</td><td data-label="犯罪名・区分">通常</td><td data-label="犯罪者側">1～2人</td><td data-label="PD側">2～4人</td><td data-label="補足"></td></tr><tr><td data-label="分類">準中型（チェイス）</td><td data-label="犯罪名・区分">クレーン強盗</td><td data-label="犯罪者側">2～3人</td><td data-label="PD側">3～4人</td><td data-label="補足"></td></tr><tr><td data-label="分類">準中型（チェイス）</td><td data-label="犯罪名・区分">現金交換所</td><td data-label="犯罪者側">1～2人</td><td data-label="PD側">2～4人</td><td data-label="補足"></td></tr><tr><td data-label="分類">準中型（撃ち合い）</td><td data-label="犯罪名・区分">通常</td><td data-label="犯罪者側">3～6人</td><td data-label="PD側">5～10人</td><td data-label="補足"></td></tr><tr><td data-label="分類">中型</td><td data-label="犯罪名・区分">通常</td><td data-label="犯罪者側">4～8人</td><td data-label="PD側">6～12人</td><td data-label="補足"></td></tr><tr><td data-label="分類">大型</td><td data-label="犯罪名・区分">通常</td><td data-label="犯罪者側">8～15人</td><td data-label="PD側">12～20人</td><td data-label="補足">ギャング限定</td></tr><tr><td data-label="分類">無人犯罪</td><td data-label="犯罪名・区分">通常</td><td data-label="犯罪者側">1人</td><td data-label="PD側">0人</td><td data-label="補足"></td></tr></tbody></table><p>犯罪は表の人数の範囲内で行ってください。犯罪者側の人数とPD側の人数を混同しないようにしてください。</p></section>
<section id="crime-chase-demands"><h2>チェイス犯罪で有効な対応</h2><p>人質の解放条件として要求できる内容は、最大2項目までです。人質がNPCでもプレイヤーでも、条件は変わりません。</p><p>要求によってチェイスそのものが成立しなくなる場合などは、PD側が要求を断ることができます。ルールだけを機械的に適用せず、お互いが楽しめるよう、その場の雰囲気や状況を大切にしてください。</p><h3>PDが要求を断ることができる例</h3><ul><li>犯人側が高速車両を使っているのに、PD側へ「自転車のみ使用可能」と要求する場合。正常なチェイスが成立しないため、PDは断ることができます。</li><li>犯人側がニトロを使えるのに、PD側へ「ニトロ使用禁止」と要求する場合。直線を走るだけで一方的に逃走できてしまうため、PDは断ることができます。</li></ul></section>
<section id="crime-chase-attack-window"><h2>チェイス犯罪のアタック禁止時間</h2><table><caption>車両の取得方法とアタック禁止時間</caption><thead><tr><th>車両</th><th>アタック禁止時間</th></tr></thead><tbody><tr><td data-label="車両">プレイヤー所有車（借りた車両を含む）</td><td data-label="アタック禁止時間">1分</td></tr><tr><td data-label="車両">盗難車両</td><td data-label="アタック禁止時間">3分</td></tr></tbody></table><p>この時間を超える要求はできません。ただし、クレーン強盗はアタック禁止時間に加えて2分まで要求できます。</p><h3>PDが定めるラインより上位のチェイス犯罪</h3><ul><li>ネタ犯罪は禁止です。</li><li>アタック禁止時間は1分です。</li><li>有人・無人を問わず、同じ条件を適用します。</li></ul></section>
<section id="crime-common-response"><h2>すべての犯罪で有効な対応</h2><h3>犯罪現場周辺での職務質問</h3><p>PDは、犯罪現場周辺にいる住民に職務質問を行うことができます。職務質問を受けた方は、応じる必要があります。</p><h3>犯人を見失った後の現行犯逮捕</h3><p>PDが犯人を一度見失った場合でも、見失ってから10分以内であれば、現行犯として逮捕することができます。</p></section>
<section id="crime-bug-response"><span id="crime-bug-options" aria-hidden="true"></span><span id="crime-bug-recurrence" aria-hidden="true"></span><h2>犯罪中の不具合対応・再実行・補填の手順</h2><h3>1. PDへ連絡して現場確認</h3><p>不具合などで犯罪の進行が不可能になった場合は、速やかにPDへ連絡し、シーンを一時中断してください。</p><p>PDが現場へ向かい、不具合の状況を確認したうえで、リセットできるか判断します。</p><p>進行不能と判断された事件では、状況確認のために犯罪者側へボディカメラの提出を求める場合があります。</p><h3>2. リセット前に進行方法を選ぶ</h3><p>不具合リセットを行う前に、PDは犯罪者側へ今後の進行を確認してください。犯罪者側は、次のいずれかを選択します。</p><h3>① リセットして再実行</h3><p>不具合リセット後、同じ犯罪を最初から再度実行します。この選択をした場合は、必ず同じ犯罪を実行してください。</p><h3>② そのまま続行</h3><ul><li>犯罪者側から、金品を所持している想定となる1〜2名を選出します。</li><li>PDから開始の連絡があった後、指定された時間を「回収フェーズ」とします。</li><li>回収フェーズ中、選出された対象者はその場で手を上げて待機してください。</li><li>指定時間が終了した後は「逃走フェーズ」となり、逃走して構いません。</li></ul><h3>③ 中断</h3><p>その犯罪を中断します。中断後は、他の犯罪者が同じ犯罪を実行できる状態にしてください。</p><h3>3. 再実行後に、再び不具合が発生したら</h3><p>一度リセットして再実行した後に再び不具合が発生した場合は、②そのまま続行・③中断のどちらかを選択してください。</p><p>2回目以降は、再度リセットして最初からやり直す選択はできません。</p><h3>4. 成功後の補填を申請する場合</h3><p>不具合があった犯罪の成功後に補填を申請する場合は、チケットを発行し、ボディカメラを提出してください。ボディカメラの提出がない場合は補填できません。</p></section>
<section id="crime-restart-window"><h2>再起動前後の犯罪について</h2><table><caption>再起動前後の犯罪禁止時間</caption><thead><tr><th>再起動の種類</th><th>犯罪禁止時間・確認事項</th></tr></thead><tbody><tr><td data-label="再起動の種類">定期再起動</td><td data-label="犯罪禁止時間・確認事項">前30分 / サーバー再開後30分</td></tr><tr><td data-label="再起動の種類">緊急再起動</td><td data-label="犯罪禁止時間・確認事項">サーバー再開後15分</td></tr><tr><td data-label="再起動の種類">その他の再起動</td><td data-label="犯罪禁止時間・確認事項">街からのアナウンスを確認</td></tr></tbody></table><h3>定期再起動</h3><p>定期再起動の30分前から再起動まで、およびサーバー再開後30分間は、犯罪行為を禁止します。新たな犯罪の開始だけでなく、この時間帯に犯罪行為を続けることも禁止です。</p><p>再起動時間をまたぐ可能性が高い犯罪も行わないでください。開始できる時刻でも、再起動前の犯罪禁止時間にかからないか、事前に確認しましょう。</p><h3>緊急再起動</h3><p>緊急再起動の場合は、サーバー再開後15分間、犯罪行為を禁止します。緊急再起動は予告なしに発生する場合があります。</p><h3>その他の再起動・個別の案内</h3><p>メンテナンス、臨時再起動、特殊な再起動等については、街からのアナウンスを確認してください。</p><p>運営から個別の犯罪開始時刻が案内された場合は、その案内を優先してください。最新情報は公式Discordの「街からのお知らせ」等で確認できます。</p></section>
<section id="crime-scene-conduct"><h2>犯罪シーン中の共通ルール</h2><ul><li>チェイス中に車両をガレージへ入れないでください。</li><li>犯罪シーン中は、車両・ヘリを修理しないでください。</li><li>ヘイストネットワークから参加していない人が、後からシーンへ参加することは禁止です。</li><li>終了した犯罪シーンへ復帰しないでください。</li></ul></section>
<section id="crime-helicopter-limits"><h2>犯罪シーンのヘリ台数</h2><table><caption>犯罪者側のヘリ最大台数</caption><thead><tr><th>分類・犯罪</th><th>最大台数</th></tr></thead><tbody><tr><td data-label="分類・犯罪">小型</td><td data-label="最大台数">使用不可</td></tr><tr><td data-label="分類・犯罪">準中型（チェイス）</td><td data-label="最大台数">使用不可</td></tr><tr><td data-label="分類・犯罪">準中型（撃ち合い）</td><td data-label="最大台数">1台</td></tr><tr><td data-label="分類・犯罪">密輸バージ</td><td data-label="最大台数">4台</td></tr><tr><td data-label="分類・犯罪">中型</td><td data-label="最大台数">2台</td></tr><tr><td data-label="分類・犯罪">空母襲撃・海上油田・貨物船強盗</td><td data-label="最大台数">5台</td></tr><tr><td data-label="分類・犯罪">大型</td><td data-label="最大台数">3台</td></tr></tbody></table><p>PD側は、犯罪者側のヘリ台数に1台を加えた台数まで使用できます。</p><p>密輸バージ・空母襲撃・海上油田・貨物船強盗は、通常の分類より3台多い上限です。表の台数は1事件の最大台数であり、犯罪者側はこの上限を超えないでください。</p></section>
<section id="crime-scene-colors"><h2>犯罪シーンではカラーを揃える</h2><p>犯罪シーンでは、服装と車両のカラーを揃えてください。盗難車も対象です。</p><p>近似色や、黒・白・グレーの使用は認められません。カラーの判断に迷う場合は、PDへ確認してください。</p></section>
<section id="crime-scene-end"><h2>犯罪シーンが終了する条件</h2><p>PDを振り切ってから5分が経過すると、犯罪シーンの終了とみなします。</p><ul><li>PDのサイレンが聞こえず、PDヘリも見えなくなった状態。</li><li>服装や車両などから、犯人と断定できなくなった状態。</li></ul><p>PDが犯人を見失ってから10分以内の現行犯逮捕については、「すべての犯罪で有効な対応」も確認してください。シーンの終了と現行犯逮捕の条件は別に定めています。</p></section>
<section id="crime-siege"><h2>中籠りと完全包囲の判定</h2><h3>対象の犯罪</h3><p>ランドリー、ヴァンジェ、パレト、ヒューメイン、ボブキャット、美術館、カジノ、ユニオン、地下、山岳。</p><h3>完全包囲から敗北判定まで</h3><ul><li>PDは現場を完全包囲したうえで、PDアプリの「完全包囲」ボタンから宣言します。ボタンで宣言した時点から5分を計測します。</li><li>PDは犯罪者側へ5回程度の呼びかけを行ってください。</li><li>宣言から5分が経過したら、PDが完全包囲・呼びかけ等の条件を確認し、犯罪者側の敗北を確定します。</li></ul><h3>宣言後のラーク介入は禁止</h3><p>PDが完全包囲を宣言した時点から、その犯罪へのラークの介入を禁止します。</p><p>犯罪参加者の画面中央上部に残り時間を表示します。5分経過後は「PD確認待ち」となり、時間到達だけで自動的に敗北が確定するわけではありません。</p></section>
<section id="crime-probation"><h2>案内された参加制限を確認しよう</h2><p>社会奉仕・保護観察の期間中は、犯罪などが制限されます。参加できる活動と適用期間を確認し、制限に従ってください。</p><p>別のアカウントや立場を使って制限を回避しないでください。自分に適用される内容が分からない場合は、PDや運営へ確認してください。</p></section>
<section id="pd-internal-rules"><h2>PDは内部ルールを守る</h2><p>PDは、内部ルールを厳守してください。</p></section>
<section id="ems-emergency-use"><h2>緊急救済機能を悪用しない</h2><p>EMSが不在の場合や救助が不可能な場所にいる場合など、緊急時に利用する救済機能を悪用することは禁止です。EMSやPDから指示がある場合も利用できます。</p><p>移動と蘇生は別の機能です。利用するときは、各機能の条件と画面の案内を確認してください。</p></section>
<section id="mechanic-crime-limits"><h2>メカニックの犯罪参加とギャング</h2><p>メカニックは準公務員ですが、中型犯罪まで参加できます。</p><p>ギャングへの参加と、大型犯罪への参加は禁止です。</p></section>
<section id="job-authority-misuse"><h2>職業の権限や請求を悪用しない</h2><p>PD・EMS・メカニックなど、職務の権限、支給品、専用機能を不正な利益のために悪用しないでください。</p><p>実施していない作業の請求や、意図的な詐欺的請求は禁止です。作業・商品と請求内容が食い違わないよう説明してください。</p><p>店舗荒らし、意図的な営業妨害、嫌がらせは禁止です。行き違いを解決できない場合は、チケットから運営へ相談してください。</p></section>
<section id="job-employment-limits"><h2>公務員の兼業禁止</h2><p>公務員は兼業禁止です。就職や採用については、担当者の案内を確認してください。</p></section>
<section id="affiliation-colors"><h2>ギャングカラーの登録と使い方</h2><p>ギャングカラーは設立時に運営へ登録してください。ギャング内のメインカラーは統一してください。</p><p>他ギャングの登録カラーを意図的に偽装したり、他ギャングになりすましたりしないでください。既存ギャングと識別しにくい色や、PD・EMSなどと誤認しやすい表現は避けてください。</p><p>犯罪シーン中は、登録カラーの有無にかかわらず、犯罪シーンのカラー統一規定に従ってください。</p></section>
<section id="streaming-respect"><h2>配信・SNSでも相手を大切に</h2><p>配信する際は、他の参加者の個人情報や私的な画面が映らないよう注意してください。</p><p>自衛のため、名前に「🛰」マークを表示してください。犯罪中は、マークを消しても構いません。</p><p>ゲーム内の対立を、現実の人格への攻撃やSNSでの粘着につなげないでください。配信から得た位置や作戦をゲーム内で利用することも禁止です。</p></section>
<section id="weapons-crime-use"><h2>銃刀法違反の適用条件</h2><p>犯罪時に武器を所持していた場合は、銃刀法違反の対象になります。罰金と保護観察時間は「ゲーム内法律・基本罰金と保護観察」を確認してください。</p><p>武器を使う場面でも、RP上の理由のない攻撃や殺害は禁止です。</p></section>
<section id="administration-response"><h2>ルール違反と運営の対応</h2><p>ルール違反や、他のプレイヤーのプレイ・RP活動・サーバー運営の妨げになると判断した場合は、警告、キック、期限BAN、永久BANなどの対応を行う場合があります。</p><p>個別に書かれていない行為でも、悪質な抜け穴利用や活動の妨害には運営が対応する場合があります。</p><p>これらの対応は、本人へ事前に通知せず行う場合があります。</p></section>
<section id="administration-contact-boundaries"><h2>運営への連絡方法を守る</h2><p>街中で運営に対する必要のないメッセージや電話を送ることは避けてください。</p><p>Discordでは、運営・サポーター・デバッガーなどへのDMを行わず、案内された窓口を使ってください。</p><p>ゲーム内の報告機能やチケットで報告した内容を、重複して報告しないでください。</p></section>
<section id="join-whitelist"><h2>Whitelistはコード申請と運営承認です</h2><p>Whitelistの申請には、本人がFiveMへ初回接続したときに表示されるRxxxxコードを使ってください。他人のコードは使用できません。</p><p>Discordでルールを確認し、市民ロールを取得した後、#ホワイトリスト申請へ本人のコードを投稿してください。運営の承認後に、FiveMへ再接続します。</p><p>問題がある場合は、公式Discordのチケットから相談してください。詳しい手順は「NicoGuraへの参加方法」を確認してください。</p></section><p><a href="https://discord.gg/Fzhhp34JJy">公式Discord</a> / <a href="https://x.com/NicoGura0810">公式X</a></p><p>検索・保存機能にはJavaScriptを有効にしてください。</p></div></noscript>
