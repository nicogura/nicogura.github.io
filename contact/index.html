<section><h2>対応は状況・悪質性に応じて判断します</h2><p>違反の状況、悪質性、繰り返しの有無などを確認して対応します。すべての違反に固定の罰則や、必ず同じ順番の対応を設けるものではありません。</p><p>チート、RMT、Duplication、BAN回避、重大な荒らし、サーバー攻撃などは、初回から重い対応になる場合があります。</p><p>ゲーム内の犯罪に対するPDの罰金や刑務と、サーバールール違反に対する運営対応は別です。処分に関する相談や異議はDiscordの「お問い合わせ窓口」へ連絡してください。</p></section><p><a href="https://discord.gg/Fzhhp34JJy">公式Discord</a> / <a href="https://x.com/NicoGura0810">公式X</a></p><p>検索・保存機能にはJavaScriptを有効にしてください。</p></div></noscript>
