    <noscript><div class="noscript"><h1>お問い合わせ</h1><p>不具合やご意見は街のタブレットから。緊急連絡・申請・補填などは公式Discordのチケットへご相談ください。</p><p>最終更新 2026-11-02</p><nav><a href="../">NicoGura | にこぐら 公式ルール・参加ガイド</a> / <a href="../rules/">公式ルール</a> / <a href="../join/">参加方法</a> / <a href="../server/">サーバー情報</a> / <a href="../mods/">MOD・グリッチ</a> / <a href="../character/">キャラクター</a> / <a href="../economy/">経済・料金</a> / <a href="../crime/">犯罪RP</a> / <a href="../law/">法律・罰金</a> / <a href="../guides/">にこぐらガイド</a> / <a href="../pd/">PD・警察</a> / <a href="../ems/">EMS・救急</a> / <a href="../mechanic/">メカニック</a> / <a href="../shops/">店舗</a> / <a href="../lifejobs/">Life Job</a> / <a href="../gangs/">ギャング</a> / <a href="../faq/">よくある質問</a> / <a href="../contact/">お問い合わせ</a></nav><section id="administration-report"><h2>要望・不具合・問い合わせの送り方</h2><h3>ゲーム内の要望・不具合</h3><p>タブレットの「不具合・ご意見」から提出できます。Discordの「不具合」では、利用者同士で解決方法を確認できる場合もあります。</p><h3>チケットで運営へ相談する場合</h3><p>早急な対応が必要な場合、申請、クリップの提出は、公式Discordのチケットからお願いします。荒らしや違反に対しては報復や長時間の口論を続けず、運営へ相談してください。</p><ul><li>いつ、どこで、何が起きたか。</li><li>関わった人と状況。分かる場合は名前や入国ID。</li><li>動画やスクリーンショットがある場合は、確認してほしい箇所。</li></ul><p>対応には時間がかかる場合があります。同じ内容を重複して報告せず、窓口での案内をお待ちください。</p><p>一般の相談では、常時録画は必須ではありません。分かる範囲で状況を伝えてください。犯罪の不具合に伴う補填には、ボディカメラの提出が必要です。</p></section>
<section id="administration-contact-boundaries"><h2>運営への連絡方法を守る</h2><p>街中で運営に対する必要のないメッセージや電話を送ることは避けてください。</p><p>Discordでは、運営・サポーター・デバッガーなどへのDMを行わず、案内された窓口を使ってください。</p><p>ゲーム内の報告機能やチケットで報告した内容を、重複して報告しないでください。</p></section>
<section id="administration-response"><h2>ルール違反と運営の対応</h2><p>ルール違反や、他のプレイヤーのプレイ・RP活動・サーバー運営の妨げになると判断した場合は、警告、キック、期限BAN、永久BANなどの対応を行う場合があります。</p><p>個別に書かれていない行為でも、悪質な抜け穴利用や活動の妨害には運営が対応する場合があります。</p><p>これらの対応は、本人へ事前に通知せず行う場合があります。</p></section>
<section id="administration-sanctions"><h2>対応は状況・悪質性に応じて判断します</h2><p>違反の状況、悪質性、繰り返しの有無などを確認して対応します。すべての違反に固定の罰則や、必ず同じ順番の対応を設けるものではありません。</p><p>チート、RMT、Duplication、BAN回避、重大な荒らし、サーバー攻撃などは、初回から重い対応になる場合があります。</p><p>ゲーム内の犯罪に対するPDの罰金や保護観察と、サーバールール違反に対する運営対応は別です。処分に関する相談や異議はDiscordの「お問い合わせ窓口」へ連絡してください。</p></section><p><a href="https://discord.gg/Fzhhp34JJy">公式Discord</a> / <a href="https://x.com/NicoGura0810">公式X</a></p><p>検索・保存機能にはJavaScriptを有効にしてください。</p></div></noscript>
