    <noscript><div class="noscript"><h1>経済・料金</h1><p>初期資金、飲食、燃料、治療、修理、消耗品とカスタム。街の暮らしに必要な料金をまとめました。</p><p>最終更新 2026-11-02</p><nav><a href="../">NicoGura | にこぐら 公式ルール・参加ガイド</a> / <a href="../rules/">公式ルール</a> / <a href="../join/">参加方法</a> / <a href="../server/">サーバー情報</a> / <a href="../mods/">MOD・グリッチ</a> / <a href="../character/">キャラクター</a> / <a href="../economy/">経済・料金</a> / <a href="../crime/">犯罪RP</a> / <a href="../law/">法律・罰金</a> / <a href="../guides/">にこぐらガイド</a> / <a href="../pd/">PD・警察</a> / <a href="../ems/">EMS・救急</a> / <a href="../mechanic/">メカニック</a> / <a href="../shops/">店舗</a> / <a href="../lifejobs/">Life Job</a> / <a href="../gangs/">ギャング</a> / <a href="../faq/">よくある質問</a> / <a href="../contact/">お問い合わせ</a></nav><section id="economy-starting-funds"><h2>街での生活を始める資金</h2><table><caption>初期資金</caption><thead><tr><th>受け取り先</th><th>金額</th></tr></thead><tbody><tr><td data-label="受け取り先">現金</td><td data-label="金額">10,000,000円</td></tr><tr><td data-label="受け取り先">銀行</td><td data-label="金額">10,000,000円</td></tr><tr><td data-label="受け取り先">合計</td><td data-label="金額">20,000,000円</td></tr></tbody></table><p>街に入ったら、食事や移動、仕事の案内を確認しながら、自分のペースで生活を始めましょう。</p></section>

<section id="ems-fees"><h2>医療サービスの料金</h2><table><caption>医療サービス料金</caption><thead><tr><th>サービス</th><th>価格</th><th>内容</th></tr></thead><tbody><tr><td data-label="サービス">通常治療</td><td data-label="価格">300,000円</td><td data-label="内容">治療</td></tr><tr><td data-label="サービス">院内蘇生</td><td data-label="価格">1,000,000円</td><td data-label="内容">EMS施設内での蘇生</td></tr><tr><td data-label="サービス">現場蘇生・運搬</td><td data-label="価格">1,500,000円</td><td data-label="内容">現場対応・EMSへの運搬</td></tr><tr><td data-label="サービス">牢屋対応</td><td data-label="価格">2,000,000円</td><td data-label="内容">PD牢屋内</td></tr><tr><td data-label="サービス">NPC治療</td><td data-label="価格">800,000円</td><td data-label="内容">EMSが不在の場合など</td></tr></tbody></table><p>NPC治療の改定料金は800,000円です。/help のゲーム内課金にはまだ反映されておらず、現時点では銀行から1,000,000円が引き落とされます。病院受付の通常治療300,000円・院内蘇生1,000,000円とは別の料金です。利用前にゲーム内の案内も確認してください。</p><p>対応内容や場所が変わる場合は、担当者に内容と料金を確認してください。NPC治療の利用方法は、ゲーム内の案内に従ってください。</p></section>
<section id="ems-bandage"><h2>包帯（EMS専売品）</h2><table><caption>包帯の価格と効果</caption><thead><tr><th>品目</th><th>価格</th><th>効果</th><th>販売区分</th></tr></thead><tbody><tr><td data-label="品目">包帯</td><td data-label="価格">250,000円</td><td data-label="効果">一時的な止血</td><td data-label="販売区分">EMS専売品</td></tr></tbody></table><p>包帯は完治ではありません。一時的に出血を抑えるもので、時間がたつと症状が再発する場合があります。</p><p>怪我・症状を完治させるには、EMSによる治療を受けてください。</p></section>

<section id="ems-ifak"><h2>IFAK（EMS専売品）</h2><table><caption>IFAKの価格と効果</caption><thead><tr><th>品目</th><th>価格</th><th>効果</th><th>販売区分</th></tr></thead><tbody><tr><td data-label="品目">IFAK</td><td data-label="価格">200,000円</td><td data-label="効果">体力25％回復のみ</td><td data-label="販売区分">EMS専売品</td></tr></tbody></table><p>IFAKは体力回復用の応急処置用品です。怪我や症状を完全に治療するものではありません。</p><p>怪我・症状を完治させるには、EMSによる治療を受けてください。</p></section>
