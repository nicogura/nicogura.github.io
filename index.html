    <noscript><div class="noscript"><h1>NicoGura | にこぐら 公式ルール・参加ガイド</h1><p>初心者歓迎のFiveMライトRPサーバー「NicoGura」。公式ルール、参加方法、経済・料金、法律などをまとめた公式ガイド。</p><p>最終更新 2026-10-10</p><nav><a href="./">NicoGura | にこぐら 公式ルール・参加ガイド</a> / <a href="./rules/">公式ルール</a> / <a href="./join/">参加方法</a> / <a href="./character/">キャラクター</a> / <a href="./economy/">経済・料金</a> / <a href="./crime/">犯罪RP</a> / <a href="./law/">法律・罰金</a> / <a href="./guides/">街ガイド</a> / <a href="./pd/">PD・警察</a> / <a href="./ems/">EMS・救急</a> / <a href="./mechanic/">メカニック</a> / <a href="./shops/">店舗</a> / <a href="./lifejobs/">Life Job</a> / <a href="./gangs/">ギャング</a> / <a href="./faq/">よくある質問</a> / <a href="./contact/">お問い合わせ</a></nav><section><h2>NicoGuraへようこそ</h2><p>NicoGura（にこぐら）は、みんなでゆっくり街での生活を楽しむライトRPサーバーです。FiveM初心者もRP初心者も歓迎します。完璧な演技や、細かなキャラクター設定は必要ありません。</p><p>ゲーム内では「この街に暮らす一人の市民」という意識を持って、仕事や会話、街で起きる出来事を楽しんでください。自分だけでなく、一緒にいる人も楽しめる行動を大切にしましょう。</p><p>ルールはみんなが気持ちよく遊ぶための最低限の約束です。分からないことは、公式Discordの「お問い合わせ窓口」から確認できます。</p></section>
<section><h2>NicoGuraのライトRP</h2><ul><li>完璧な演技や細かなキャラクター背景設定は不要です。</li><li>声色を変える必要もありません。RP初心者、FiveM初心者も歓迎します。</li><li>ゲーム内では、この街に暮らすキャラクターとして行動しましょう。</li><li>他の市民のRPを壊さず、相手も楽しめる遊び方を意識してください。</li></ul><p>自然な会話や出来事のやり取りを楽しめれば大丈夫です。細かな演技方法や、厳密なキャラクター経歴を求めるものではありません。</p></section>
<section><h2>1人につき1キャラクター</h2><p>複数キャラクターやサブキャラクターを使い分けることはできません。別アカウントなどを利用して、実質的に複数キャラクターを使用する行為も禁止します。</p><p>キャラクターを作り直したい場合などは、勝手に追加キャラクターを作らず、運営へ相談してください。</p></section><p><a href="https://discord.gg/Fzhhp34JJy">公式Discord</a> / <a href="https://x.com/NicoGura0810">公式X</a></p><p>検索・保存機能にはJavaScriptを有効にしてください。</p></div></noscript>
