    <noscript><div class="noscript"><h1>店舗</h1><p>市民が運営する飲食店やサービスのお店。会話や出会いを楽しみながら利用しましょう。</p><p>最終更新 2026-10-10</p><nav><a href="../">NicoGura | にこぐら 公式ルール・参加ガイド</a> / <a href="../rules/">公式ルール</a> / <a href="../join/">参加方法</a> / <a href="../character/">キャラクター</a> / <a href="../economy/">経済・料金</a> / <a href="../crime/">犯罪RP</a> / <a href="../law/">法律・罰金</a> / <a href="../guides/">街ガイド</a> / <a href="../pd/">PD・警察</a> / <a href="../ems/">EMS・救急</a> / <a href="../mechanic/">メカニック</a> / <a href="../shops/">店舗</a> / <a href="../lifejobs/">Life Job</a> / <a href="../gangs/">ギャング</a> / <a href="../faq/">よくある質問</a> / <a href="../contact/">お問い合わせ</a></nav><section><h2>市民が営むお店を楽しもう</h2><p>有人店舗は街の市民が運営します。飲食、サービス、その他の店舗で、会話や買い物を楽しみましょう。</p><p>商品・作業・料金を伝え合い、説明と請求が食い違わないようにしてください。意図的な詐欺的請求やJob権限の悪用は禁止です。</p><p>店舗荒らし、意図的な営業妨害、嫌がらせは禁止です。行き違いがあればまず内容を確認し、解決が難しい場合はDiscordのお問い合わせ窓口へ相談してください。</p></section>
<section><h2>街の仕事と公務員について</h2><p>市民が営むお店の仕事やLife Jobなど、街での働き方を探してみましょう。お店では商品やサービスを通して、市民との交流を楽しめます。</p><p>公務員は兼業禁止です。そのため、街の経済ではやや高めの収入帯を基準にしています。就職や採用については、担当者に案内を確認してください。</p></section><p><a href="https://discord.gg/Fzhhp34JJy">公式Discord</a> / <a href="https://x.com/NicoGura0810">公式X</a></p><p>検索・保存機能にはJavaScriptを有効にしてください。</p></div></noscript>
