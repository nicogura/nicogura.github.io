    <noscript><div class="noscript"><h1>店舗</h1><p>市民が運営する飲食店やサービスのお店。会話や出会いを楽しみながら利用しましょう。</p><p>最終更新 2026-11-03</p><nav><a href="../">NicoGura | にこぐら 公式ルール・参加ガイド</a> / <a href="../rules/">公式ルール</a> / <a href="../join/">参加方法</a> / <a href="../server/">サーバー情報</a> / <a href="../mods/">MOD・グリッチ</a> / <a href="../character/">キャラクター</a> / <a href="../economy/">経済・料金</a> / <a href="../crime/">犯罪RP</a> / <a href="../law/">法律・罰金</a> / <a href="../guides/">にこぐらガイド</a> / <a href="../pd/">PD・警察</a> / <a href="../ems/">EMS・救急</a> / <a href="../mechanic/">メカニック</a> / <a href="../shops/">店舗</a> / <a href="../lifejobs/">Life Job</a> / <a href="../gangs/">ギャング</a> / <a href="../faq/">よくある質問</a> / <a href="../contact/">お問い合わせ</a></nav><section id="business-honest"><h2>市民が営むお店を楽しもう</h2><p>有人店舗は街の市民が運営します。飲食、サービス、その他の店舗で、会話や買い物を楽しみましょう。</p><p>商品や作業の内容、料金を確認しながら利用してください。行き違いがあれば、まず店舗と内容を確認しましょう。</p></section>
<section id="shop-establishment"><h2>飲食店・ジョイント店の開業相談</h2><p>飲食店・ジョイント店では、食料、飲み物、嗜好品を販売します。開業に関する相談は、公式Discordのチケットからお願いします。</p><p>現在、飲食店・ジョイント店の開業申請は受け付けていません。募集再開の案内は、公式のお知らせを確認してください。</p></section>
<section id="pending-job-conditions"><h2>街の仕事と公務員について</h2><p>市民が営むお店の仕事やLife Jobなど、興味に合う働き方を探してみましょう。お店では商品やサービスを通して、市民との交流を楽しめます。</p><p>就職や採用は担当者へ相談し、兼業などの条件を確認してください。</p></section>
<section id="job-employment-limits"><h2>公務員の兼業禁止</h2><p>公務員は兼業禁止です。就職や採用については、担当者の案内を確認してください。</p></section>
<section id="job-authority-misuse"><h2>職業の権限や請求を悪用しない</h2><p>PD・EMS・メカニックなど、職務の権限、支給品、専用機能を不正な利益のために悪用しないでください。</p><p>実施していない作業の請求や、意図的な詐欺的請求は禁止です。作業・商品と請求内容が食い違わないよう説明してください。</p><p>店舗荒らし、意図的な営業妨害、嫌がらせは禁止です。行き違いを解決できない場合は、チケットから運営へ相談してください。</p></section>
<section id="economy-food-prices"><h2>飲食の料金</h2><table><caption>飲食料金表</caption><thead><tr><th>効果</th><th>区分</th><th>価格</th></tr></thead><tbody><tr><td data-label="効果">空腹＋20％</td><td data-label="区分">単一効果・安価</td><td data-label="価格">300,000円</td></tr><tr><td data-label="効果">空腹＋30％</td><td data-label="区分">単一効果・上限</td><td data-label="価格">350,000円</td></tr><tr><td data-label="効果">水分＋20％</td><td data-label="区分">単一効果・安価</td><td data-label="価格">300,000円</td></tr><tr><td data-label="効果">水分＋30％</td><td data-label="区分">単一効果・上限</td><td data-label="価格">350,000円</td></tr><tr><td data-label="効果">ストレス－20％</td><td data-label="区分">単一効果</td><td data-label="価格">200,000円</td></tr><tr><td data-label="効果">ストレス－30％</td><td data-label="区分">単一効果・上限</td><td data-label="価格">250,000円</td></tr><tr><td data-label="効果">空腹30％＋水分30％</td><td data-label="区分">複合商品</td><td data-label="価格">700,000円</td></tr></tbody></table><p>お店では、商品や効果を確認しながら買い物を楽しみましょう。</p></section><p><a href="https://discord.gg/Fzhhp34JJy">公式Discord</a> / <a href="https://x.com/NicoGura0810">公式X</a></p><p>検索・保存機能にはJavaScriptを有効にしてください。</p></div></noscript>
