    <noscript><div class="noscript"><h1>PD・警察</h1><p>治安維持、犯罪・交通対応、捜査を担うPD。市民向けの案内とゲーム内法律をご確認ください。</p><p>最終更新 2026-10-12</p><nav><a href="../">NicoGura | にこぐら 公式ルール・参加ガイド</a> / <a href="../rules/">公式ルール</a> / <a href="../join/">参加方法</a> / <a href="../server/">サーバー情報</a> / <a href="../mods/">MOD・グリッチ</a> / <a href="../character/">キャラクター</a> / <a href="../economy/">経済・料金</a> / <a href="../crime/">犯罪RP</a> / <a href="../law/">法律・罰金</a> / <a href="../guides/">街ガイド</a> / <a href="../pd/">PD・警察</a> / <a href="../ems/">EMS・救急</a> / <a href="../mechanic/">メカニック</a> / <a href="../shops/">店舗</a> / <a href="../lifejobs/">Life Job</a> / <a href="../gangs/">ギャング</a> / <a href="../faq/">よくある質問</a> / <a href="../contact/">お問い合わせ</a></nav><section><h2>PDは街の安全と犯罪対応を担当します</h2><p>PDは街の治安維持、犯罪への対応、交通対応、捜査などを担当します。犯罪RPでの追跡や逮捕も、街で起きるシーンの一つです。</p><p>職務の権限、支給品、専用機能を不正な利益のために悪用する行為は禁止です。市民への説明を大切にし、プレイヤー本人への攻撃や嫌がらせにならないようにしましょう。</p></section>
<section><h2>PDの対応とゲーム内法律</h2><p>ゲーム内犯罪は、PDによる対応、罰金、刑務、押収、インパウンドなどの対象になります。犯罪RPをすること自体は街のコンテンツです。</p><p>PDはゲーム内法律に基づく罪状と処分を説明してください。市民も、罪状・請求額・刑務時間が分からないときは、説明を求めて大丈夫です。</p><p>基本罰金・刑務、Heistの罰金・刑務、インパウンドの料金と待機時間は「ゲーム内法律・罰金」で確認できます。サーバールール違反は運営対応の対象です。</p></section>
<section><h2>チェイス犯罪で有効な対応</h2><p>人質の解放条件として要求できる内容は、最大2項目までです。人質がNPCでもプレイヤーでも、条件は変わりません。</p><p>要求によってチェイスそのものが成立しなくなる場合などは、PD側が要求を断ることができます。ルールだけを機械的に適用せず、お互いが楽しめるよう、その場の雰囲気や状況を大切にしてください。</p><h3>PDが要求を断ることができる例</h3><ul><li>犯人側が高速車両を使っているのに、PD側へ「自転車のみ使用可能」と要求する場合。正常なチェイスが成立しないため、PDは断ることができます。</li><li>犯人側がニトロを使えるのに、PD側へ「ニトロ使用禁止」と要求する場合。直線を走るだけで一方的に逃走できてしまうため、PDは断ることができます。</li></ul></section>
<section><h2>チェイス犯罪のアタック禁止時間</h2><p>アタック禁止時間は、使用する車両の取得方法によって次のとおりです。</p><table><caption>車両の取得方法とアタック禁止時間</caption><thead><tr><th>車両の取得方法</th><th>アタック禁止時間</th></tr></thead><tbody><tr><td data-label="車両の取得方法">本人が所有する車両</td><td data-label="アタック禁止時間">1分</td></tr><tr><td data-label="車両の取得方法">他プレイヤーから借りた車両</td><td data-label="アタック禁止時間">1分</td></tr><tr><td data-label="車両の取得方法">窃盗車両</td><td data-label="アタック禁止時間">3分</td></tr></tbody></table><p>上記を超えるアタック禁止時間を要求することは禁止します。</p><h3>PDが定めるラインより上位のチェイス犯罪</h3><ul><li>ネタ犯罪は禁止です。</li><li>アタック禁止時間は1分です。</li></ul><p>有人・無人を問わず、同じ条件を適用します。</p></section>
<section><h2>すべての犯罪で有効な対応</h2><h3>犯罪現場周辺での職務質問</h3><p>PDは、犯罪現場周辺にいる住民に職務質問を行うことができます。職務質問を受けた方は、応じる必要があります。</p><h3>犯人を見失った後の現行犯逮捕</h3><p>PDが犯人を一度見失った場合でも、見失ってから10分以内であれば、現行犯として逮捕することができます。</p></section>
<section><h2>犯罪中に不具合が発生した場合</h2><p>不具合などで犯罪の進行が不可能になった場合は、速やかにPDへ連絡し、シーンを一時中断してください。</p><p>PD側の上官が現場へ向かい、実際に進行できない状態であることを確認します。確認が取れた場合に限り、不具合リセットを行うことができます。</p><p>進行不能と判断された事件では、状況確認のため、犯罪者側へボディカメラの提出を求める場合があります。提出が必要な場合は、PDがその旨を犯罪者側へ伝えてください。</p><p>リセット前に、「不具合リセット前の選択」に沿って今後の進行を確認してください。再実行後に再び不具合が起きた場合は、「再度不具合が発生した場合」の条件を適用します。</p></section>
<section><h2>不具合リセット前の選択</h2><p>不具合リセットを行う前に、PDは犯罪者側へ今後の進行を確認してください。犯罪者側は、次のいずれかを選択します。</p><h3>① リセットして再実行</h3><p>不具合リセット後、同じ犯罪を最初から再度実行します。この選択をした場合は、必ず同じ犯罪を実行してください。</p><h3>② そのまま続行</h3><ul><li>犯罪者側から、金品を所持している想定となる1〜2名を選出します。</li><li>PDから開始の連絡があった後、指定された3〜5分間を「回収フェーズ」とします。</li><li>回収フェーズ中、選出された対象者はその場で手を上げて待機してください。</li><li>指定時間が終了した後は「逃走フェーズ」となり、逃走して構いません。</li></ul><h3>③ 中断</h3><p>その犯罪を中断します。中断後は、他の犯罪者が同じ犯罪を実行できる状態にしてください。</p><p>一度リセットして再実行した後に再び不具合が発生した場合は、②そのまま続行・③中断のどちらかを選択してください。</p></section>
<section><h2>再度不具合が発生した場合</h2><p>一度不具合リセットを行い、再実行後に再び不具合が発生した場合は、「そのまま続行」か「中断」のどちらかを選択してください。各選択の進め方は「不具合リセット前の選択」を確認してください。</p><p>2回目以降は、再度リセットして最初からやり直す選択はできません。</p></section><p><a href="https://discord.gg/Fzhhp34JJy">公式Discord</a> / <a href="https://x.com/NicoGura0810">公式X</a></p><p>検索・保存機能にはJavaScriptを有効にしてください。</p></div></noscript>
