    <noscript><div class="noscript"><h1>PD・警察</h1><p>治安維持、犯罪・交通対応、捜査を担うPD。市民向けの案内とゲーム内法律をご確認ください。</p><p>最終更新 2026-10-10</p><nav><a href="../">NicoGura | にこぐら 公式ルール・参加ガイド</a> / <a href="../rules/">公式ルール</a> / <a href="../join/">参加方法</a> / <a href="../character/">キャラクター</a> / <a href="../economy/">経済・料金</a> / <a href="../crime/">犯罪RP</a> / <a href="../law/">法律・罰金</a> / <a href="../guides/">街ガイド</a> / <a href="../pd/">PD・警察</a> / <a href="../ems/">EMS・救急</a> / <a href="../mechanic/">メカニック</a> / <a href="../shops/">店舗</a> / <a href="../lifejobs/">Life Job</a> / <a href="../gangs/">ギャング</a> / <a href="../faq/">よくある質問</a> / <a href="../contact/">お問い合わせ</a></nav><section><h2>PDは街の安全と犯罪対応を担当します</h2><p>PDは街の治安維持、犯罪への対応、交通対応、捜査などを担当します。犯罪RPでの追跡や逮捕も、街で起きるシーンの一つです。</p><p>職務の権限、支給品、専用機能を不正な利益のために悪用する行為は禁止です。市民への説明を大切にし、プレイヤー本人への攻撃や嫌がらせにならないようにしましょう。</p></section>
<section><h2>PDの対応とゲーム内法律</h2><p>ゲーム内犯罪は、PDによる対応、罰金、刑務、押収、インパウンドなどの対象になります。犯罪RPをすること自体は街のコンテンツです。</p><p>PDはゲーム内法律に基づく罪状と処分を説明してください。市民も、罪状・請求額・刑務時間が分からないときは、説明を求めて大丈夫です。</p><p>基本罰金・刑務、Heistの罰金・刑務、インパウンドの料金と待機時間は「ゲーム内法律・罰金」で確認できます。サーバールール違反は運営対応の対象です。</p></section><p><a href="https://discord.gg/Fzhhp34JJy">公式Discord</a> / <a href="https://x.com/NicoGura0810">公式X</a></p><p>検索・保存機能にはJavaScriptを有効にしてください。</p></div></noscript>
