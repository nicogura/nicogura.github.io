    <noscript><div class="noscript"><h1>メカニック</h1><p>車の修理、整備、カスタム、塗装。愛車と過ごす毎日を支えるサービスと料金の案内です。</p><p>最終更新 2026-10-10</p><nav><a href="../">NicoGura | にこぐら 公式ルール・参加ガイド</a> / <a href="../rules/">公式ルール</a> / <a href="../join/">参加方法</a> / <a href="../character/">キャラクター</a> / <a href="../economy/">経済・料金</a> / <a href="../crime/">犯罪RP</a> / <a href="../law/">法律・罰金</a> / <a href="../guides/">街ガイド</a> / <a href="../pd/">PD・警察</a> / <a href="../ems/">EMS・救急</a> / <a href="../mechanic/">メカニック</a> / <a href="../shops/">店舗</a> / <a href="../lifejobs/">Life Job</a> / <a href="../gangs/">ギャング</a> / <a href="../faq/">よくある質問</a> / <a href="../contact/">お問い合わせ</a></nav><section><h2>メカニックは車の修理・整備・改造を担当します</h2><p>メカニックは修理、車両整備、カスタム、塗装などを担当します。依頼前に、作業の内容と料金を確認してから相談しましょう。</p><p>担当者は作業と請求が食い違わないよう説明してください。Job専用機能の不正利用や、実施していない作業の請求は禁止です。</p><p>修理と車両改造の料金は、料金表で確認できます。カスタムを相談するときは、希望する部位や仕上がりを伝えましょう。</p></section>

<section><h2>車のカスタムを相談するとき</h2><p>メカニックには、塗装や外装パーツ、ライト、ナンバー、カスタムなどを相談できます。料金表を確認し、希望する仕上がりや作業箇所を伝えてください。</p><p>作業の範囲と請求内容が分かるように、担当者と確認してから依頼しましょう。</p></section><p><a href="https://discord.gg/Fzhhp34JJy">公式Discord</a> / <a href="https://x.com/NicoGura0810">公式X</a></p><p>検索・保存機能にはJavaScriptを有効にしてください。</p></div></noscript>
