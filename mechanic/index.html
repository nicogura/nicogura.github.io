    <noscript><div class="noscript"><h1>メカニック</h1><p>車の修理、整備、カスタム、塗装。愛車と過ごす毎日を支えるサービスと料金の案内です。</p><p>最終更新 2026-11-03</p><nav><a href="../">NicoGura | にこぐら 公式ルール・参加ガイド</a> / <a href="../rules/">公式ルール</a> / <a href="../join/">参加方法</a> / <a href="../server/">サーバー情報</a> / <a href="../mods/">MOD・グリッチ</a> / <a href="../character/">キャラクター</a> / <a href="../economy/">経済・料金</a> / <a href="../crime/">犯罪RP</a> / <a href="../law/">法律・罰金</a> / <a href="../guides/">にこぐらガイド</a> / <a href="../pd/">PD・警察</a> / <a href="../ems/">EMS・救急</a> / <a href="../mechanic/">メカニック</a> / <a href="../shops/">店舗</a> / <a href="../lifejobs/">Life Job</a> / <a href="../gangs/">ギャング</a> / <a href="../faq/">よくある質問</a> / <a href="../contact/">お問い合わせ</a></nav><section id="mechanic-billing"><span id="pending-mechanic-fees" aria-hidden="true"></span><h2>修理・カスタムをメカニックに相談する</h2><p>メカニックには、修理・車両整備・カスタム・塗装などを相談できます。</p><h3>依頼する前に確認すること</h3><ul><li>料金表を確認し、希望する作業箇所・部位と仕上がりを伝えてください。</li><li>塗装、外装パーツ、ライト、ナンバーなど、変更したい内容を具体的に相談してください。</li><li>作業の範囲と料金の内訳・請求内容を担当者と確認し、納得してから依頼しましょう。</li></ul></section>
<section id="mechanic-fees"><h2>修理・車両改造の料金</h2><table><caption>修理と出張</caption><thead><tr><th>作業</th><th>料金</th><th>単位・範囲</th></tr></thead><tbody><tr><td data-label="作業">通常修理</td><td data-label="料金">200,000円</td><td data-label="単位・範囲">1箇所</td></tr><tr><td data-label="作業">全修理</td><td data-label="料金">1,400,000円</td><td data-label="単位・範囲"></td></tr><tr><td data-label="作業">タイヤ交換</td><td data-label="料金">500,000円</td><td data-label="単位・範囲">1本</td></tr><tr><td data-label="作業">出張</td><td data-label="料金">500,000円</td><td data-label="単位・範囲">都心・郊外</td></tr><tr><td data-label="作業">出張</td><td data-label="料金">1,000,000円</td><td data-label="単位・範囲">北</td></tr></tbody></table><table><caption>性能カスタム</caption><thead><tr><th>作業</th><th>料金</th></tr></thead><tbody><tr><td data-label="作業">性能カスタム level1</td><td data-label="料金">3,000,000円</td></tr><tr><td data-label="作業">性能カスタム level2</td><td data-label="料金">4,000,000円</td></tr><tr><td data-label="作業">性能カスタム level3</td><td data-label="料金">5,000,000円</td></tr><tr><td data-label="作業">性能カスタム level4</td><td data-label="料金">6,000,000円</td></tr><tr><td data-label="作業">性能カスタム level5</td><td data-label="料金">7,000,000円</td></tr><tr><td data-label="作業">ターボチャージャー</td><td data-label="料金">4,000,000円</td></tr><tr><td data-label="作業">ニトロ取り付け</td><td data-label="料金">2,000,000円</td></tr><tr><td data-label="作業">ニトロ補充</td><td data-label="料金">1,000,000円</td></tr><tr><td data-label="作業">アーマー</td><td data-label="料金">8,000,000円</td></tr><tr><td data-label="作業">ハーネス</td><td data-label="料金">4,000,000円</td></tr></tbody></table><table><caption>外装と消耗品</caption><thead><tr><th>作業・品目</th><th>料金</th><th>単位・補足</th></tr></thead><tbody><tr><td data-label="作業・品目">塗装・外装</td><td data-label="料金">300,000円</td><td data-label="単位・補足">1箇所</td></tr><tr><td data-label="作業・品目">RGB塗装</td><td data-label="料金">600,000円</td><td data-label="単位・補足"></td></tr><tr><td data-label="作業・品目">アンダーグロー・キセノン</td><td data-label="料金">600,000円</td><td data-label="単位・補足"></td></tr><tr><td data-label="作業・品目">特殊ナンバー</td><td data-label="料金">1,000,000,000円</td><td data-label="単位・補足">申請制</td></tr><tr><td data-label="作業・品目">ダクトテープ</td><td data-label="料金">300,000円</td><td data-label="単位・補足">1個</td></tr></tbody></table><p>作業前に、依頼する部位、作業範囲、料金の内訳を担当者と確認してください。</p></section>
<section id="economy-consumable-prices"><h2>ニトロ補充と簡易修理用品</h2><p>ニトロ補充とダクトテープの最新料金は、「修理・車両改造の料金」にまとめています。利用前に作業内容と料金を確認してください。</p><p>簡易修理キットやダクトテープは、走行可能になる程度の応急修理用です。完全修理ではありません。全修理が必要な場合は、メカニックへ相談してください。</p><p>簡易修理キットの商品や料金については、販売時の案内を確認してください。</p></section>
<section id="mechanic-crime-limits"><h2>メカニックの犯罪参加とギャング</h2><p>メカニックは準公務員ですが、中型犯罪まで参加できます。</p><p>ギャングへの参加と、大型犯罪への参加は禁止です。</p></section>
<section id="job-authority-misuse"><h2>職業の権限や請求を悪用しない</h2><p>PD・EMS・メカニックなど、職務の権限、支給品、専用機能を不正な利益のために悪用しないでください。</p><p>実施していない作業の請求や、意図的な詐欺的請求は禁止です。作業・商品と請求内容が食い違わないよう説明してください。</p><p>店舗荒らし、意図的な営業妨害、嫌がらせは禁止です。行き違いを解決できない場合は、チケットから運営へ相談してください。</p></section><p><a href="https://discord.gg/Fzhhp34JJy">公式Discord</a> / <a href="https://x.com/NicoGura0810">公式X</a></p><p>検索・保存機能にはJavaScriptを有効にしてください。</p></div></noscript>
