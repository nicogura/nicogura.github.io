    <noscript><div class="noscript"><h1>よくある質問</h1><p>RP初心者、FiveM初心者、キャラクター、参加申請やトラブル相談。初めての方の疑問にお答えします。</p><p>最終更新 2026-10-12</p><nav><a href="../">NicoGura | にこぐら 公式ルール・参加ガイド</a> / <a href="../rules/">公式ルール</a> / <a href="../join/">参加方法</a> / <a href="../server/">サーバー情報</a> / <a href="../mods/">MOD・グリッチ</a> / <a href="../character/">キャラクター</a> / <a href="../economy/">経済・料金</a> / <a href="../crime/">犯罪RP</a> / <a href="../law/">法律・罰金</a> / <a href="../guides/">街ガイド</a> / <a href="../pd/">PD・警察</a> / <a href="../ems/">EMS・救急</a> / <a href="../mechanic/">メカニック</a> / <a href="../shops/">店舗</a> / <a href="../lifejobs/">Life Job</a> / <a href="../gangs/">ギャング</a> / <a href="../faq/">よくある質問</a> / <a href="../contact/">お問い合わせ</a></nav><section><h2>読み返したいルールを探すには？</h2><ul><li>検索ではタイトル・本文・タグ・カテゴリー・料金表の文字を探せます。</li><li>カテゴリーでは知りたい仕事や場面に絞れます。</li><li>☆保存では、このブラウザに読み返したいルールを保存できます。</li><li>リンクコピーでは、そのルールへ直接開けるURLを共有できます。</li></ul><p>保存情報は端末・ブラウザごとに記録されます。ブラウザのデータを消すと、保存情報も消える場合があります。</p></section>
<section><h2>RP初心者でも参加できますか？</h2><p>はい、参加できます。NicoGuraは初心者歓迎のライトRPサーバーです。</p><p>完璧な演技や細かな設定は必要ありません。最低限、この街に暮らすキャラクターとして行動し、周りの市民との会話や出来事を楽しんでください。</p></section>
<section><h2>FiveM初心者でも大丈夫ですか？</h2><p>はい、大丈夫です。FiveMが初めての方でも参加できます。</p><p>まずは参加方法の10ステップを順に確認してください。接続方法や操作で分からないことがある場合は、公式Discordの「お問い合わせ窓口」から気軽にご相談ください。</p></section>
<section><h2>キャラクターはいくつ作れますか？</h2><p>1人につき1キャラクター限定です。</p><p>サブキャラクターや別アカウントを使用して、実質的に複数キャラクターを運用することはできません。</p><p>キャラクターを作り直したい場合は、新しく追加で作成せず、事前に運営へご相談ください。</p></section>
<section><h2>Whitelistは面接ですか？</h2><p>いいえ、面接ではありません。質問への回答形式でもありません。</p><p>FiveMへ初回接続した際に表示される、ご本人の「Rxxxx」コードをDiscordの「#ホワイトリスト申請」へ投稿してください。</p><p>運営がtxAdmin Allowlistへ登録・承認した後、再接続すると入国できます。</p></section>
<section><h2>ルールは全部暗記する必要がありますか？</h2><p>いいえ、ルールを全部暗記する必要はありません。基本的なマナーと禁止事項を理解していれば大丈夫です。</p><p>必要なときにこのサイトを確認してください。検索やカテゴリー、☆保存から、知りたい内容を読み返せます。</p></section>
<section><h2>犯罪をするとBANされますか？</h2><p>犯罪RPをすること自体が、BANの理由になるわけではありません。犯罪RPは街のゲームコンテンツで、サーバールール違反とは別です。</p><p>ゲーム内の犯罪には、法律に沿ってPD対応・罰金・刑務・押収・インパウンドなどが発生します。チートやRDMなどのサーバールール違反がある場合は、犯罪RPとは別に運営が対応します。</p></section>
<section><h2>不具合を見つけました。どうすればいいですか？</h2><p>悪用せず、公式Discordの「お問い合わせ窓口」へ報告してください。</p><p>利益を得るために追加利用したり、反復して試したりしないでください。発生時刻と状況を伝え、動画やスクリーンショットがあれば添えてください。</p><p>犯罪の進行が不可能になった場合は、速やかにPDへ連絡してシーンを一時中断し、「犯罪中に不具合が発生した場合」の手順を確認してください。</p></section>
<section><h2>アイテムが消えました。どうすればいいですか？</h2><p>公式Discordの「お問い合わせ窓口」へ連絡してください。録画等があると確認しやすくなります。</p><p>いつ、どのような操作や状況でアイテムが消えたかを、分かる範囲で伝えてください。動画やスクリーンショットがあれば添えてください。証拠がない場合も相談できます。</p></section>
<section><h2>ルールに書いていなければ何をしてもいいですか？</h2><p>いいえ、何をしてもよいわけではありません。運営や市民を妨げる行為や、悪質な抜け穴利用には、運営が対応する場合があります。</p><p>個別に書かれていなくても、活動やRP、サーバー運営の妨げになると運営が判断した場合は、警告・キック・一時BAN・永久BAN等の対応を行うことがあります。</p></section>
<section><h2>CitizenやGraphics MODは使えますか？</h2><p>原則禁止です。ただし、ゲームプレイ上の優位性が一切生じない軽量化・Graphics・Sound変更等に限り、例外的に使用できます。</p><p>No Bush、No Prop、No Water、外部Crosshair等、他のプレイヤーより情報・視認性・戦闘で有利になる変更は禁止です。例外に見えるMODでも、禁止条件に抵触するものは使用できません。</p><p>詳しい条件は「Citizen・Client側MODの使用条件」を確認してください。判断できない場合は、導入前に公式Discordの「お問い合わせ窓口」から運営へ問い合わせてください。</p></section>
<section><h2>低スペックPCなので軽量化したいです。</h2><p>公平性を損なわず、プレイ上の優位性が一切生じない範囲なら軽量化できます。</p><p>草・木・建物・水等を削除したり、水を透明にしたりして、視認性を有利にする変更は禁止です。判断が難しい場合は、使用前に公式Discordの「お問い合わせ窓口」から確認してください。</p></section>
<section><h2>スピブ / グリロは使えますか？</h2><p>いいえ、使用できません。意図的・反復的なSpeed Boost / Glitch Rollは、グリッチ利用として禁止しています。</p><p>偶然一度発生しただけの挙動まで、即ルール違反とはしません。マクロ等でスピブ・グリロを自動化する行為も禁止です。</p></section>
<section><h2>怪我は包帯だけで治りますか？</h2><p>いいえ、包帯だけでは完治しません。包帯や鎮痛剤は応急処置です。</p><p>一時的に出血や症状を抑えるもので、約3分で再び症状が出る場合があります。怪我・症状を完治させるには、EMSによる治療を受けてください。</p></section>
<section><h2>水曜日に入れません。</h2><p>NicoGuraには、水曜日03:00から木曜日19:00まで（日本時間・JST）の基本定休日があります。定期メンテナンスのため、この時間帯は街を休止します。</p><p>木曜日19:00から通常稼働を再開する予定です。最新の稼働情報は、公式Discordの「街からのお知らせ」等を確認してください。</p></section><p><a href="https://discord.gg/Fzhhp34JJy">公式Discord</a> / <a href="https://x.com/NicoGura0810">公式X</a></p><p>検索・保存機能にはJavaScriptを有効にしてください。</p></div></noscript>
