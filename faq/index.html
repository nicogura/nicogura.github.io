    <noscript><div class="noscript"><h1>よくある質問</h1><p>RP初心者、FiveM初心者、キャラクター、参加申請やトラブル相談。初めての方の疑問にお答えします。</p><p>最終更新 2026-10-10</p><nav><a href="../">NicoGura | にこぐら 公式ルール・参加ガイド</a> / <a href="../rules/">公式ルール</a> / <a href="../join/">参加方法</a> / <a href="../character/">キャラクター</a> / <a href="../economy/">経済・料金</a> / <a href="../crime/">犯罪RP</a> / <a href="../law/">法律・罰金</a> / <a href="../guides/">街ガイド</a> / <a href="../pd/">PD・警察</a> / <a href="../ems/">EMS・救急</a> / <a href="../mechanic/">メカニック</a> / <a href="../shops/">店舗</a> / <a href="../lifejobs/">Life Job</a> / <a href="../gangs/">ギャング</a> / <a href="../faq/">よくある質問</a> / <a href="../contact/">お問い合わせ</a></nav><section><h2>読み返したいルールを探すには？</h2><ul><li>検索ではタイトル・本文・タグ・カテゴリー・料金表の文字を探せます。</li><li>カテゴリーでは知りたい仕事や場面に絞れます。</li><li>☆保存では、このブラウザに読み返したいルールを保存できます。</li><li>リンクコピーでは、そのルールへ直接開けるURLを共有できます。</li></ul><p>保存情報は端末・ブラウザごとに記録されます。ブラウザのデータを消すと、保存情報も消える場合があります。</p></section>
<section><h2>RP初心者でも参加できますか？</h2><p>完璧な演技や細かな設定は必要ありません。最低限、この街に暮らすキャラクターとして行動し、周りの市民との会話や出来事を楽しんでください。</p></section>
<section><h2>FiveM初心者でも大丈夫ですか？</h2><p>参加方法の10ステップを順に確認してください。接続や操作で困った場合は、公式Discordの「お問い合わせ窓口」へ状況を伝えてください。</p></section>
<section><h2>キャラクターはいくつ作れますか？</h2><p>サブキャラクターや別アカウントを使って、実質的に複数キャラクターを使用することはできません。作り直したい場合は、追加で作らず運営へ相談してください。</p></section>
<section><h2>Whitelistは面接ですか？</h2><p>FiveM初回接続時に表示される本人のRxxxxコードを、Discordの#ホワイトリスト申請へそのまま投稿してください。運営がtxAdmin Allowlistで承認した後に再接続します。質問回答式でもありません。</p></section>
<section><h2>ルールは全部暗記する必要がありますか？</h2><p>必要なときにこのサイトを確認してください。検索やカテゴリー、☆保存から、知りたい内容を読み返せます。</p></section>
<section><h2>犯罪をするとBANされますか？</h2><p>ゲーム内の犯罪には、法律に沿ってPD対応・罰金・刑務・押収・インパウンドなどが発生します。チートやRDMなどのサーバールール違反がある場合は、犯罪RPとは別に運営が対応します。</p></section>
<section><h2>不具合を見つけました。どうすればいいですか？</h2><p>利益を得るために追加利用したり、反復して試したりしないでください。発生時刻と状況を伝え、動画やスクリーンショットがあれば添えてください。</p></section>
<section><h2>アイテムが消えました。どうすればいいですか？</h2><p>いつ、どのような操作や状況でアイテムが消えたかを、分かる範囲で伝えてください。動画やスクリーンショットがあれば添えてください。証拠がない場合も相談できます。</p></section>
<section><h2>ルールに書いていなければ何をしてもいいですか？</h2><p>個別に書かれていなくても、活動やRP、サーバー運営の妨げになると運営が判断した場合は、警告・キック・一時BAN・永久BAN等の対応を行うことがあります。</p></section><p><a href="https://discord.gg/Fzhhp34JJy">公式Discord</a> / <a href="https://x.com/NicoGura0810">公式X</a></p><p>検索・保存機能にはJavaScriptを有効にしてください。</p></div></noscript>
