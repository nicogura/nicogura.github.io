    <noscript><div class="noscript"><h1>街ガイド</h1><p>PD、EMS、メカニック、店舗、Life Job、ギャング。街を支える仕事や暮らしの入口をご案内します。</p><p>最終更新 2026-10-10</p><nav><a href="../">NicoGura | にこぐら 公式ルール・参加ガイド</a> / <a href="../rules/">公式ルール</a> / <a href="../join/">参加方法</a> / <a href="../character/">キャラクター</a> / <a href="../economy/">経済・料金</a> / <a href="../crime/">犯罪RP</a> / <a href="../law/">法律・罰金</a> / <a href="../guides/">街ガイド</a> / <a href="../pd/">PD・警察</a> / <a href="../ems/">EMS・救急</a> / <a href="../mechanic/">メカニック</a> / <a href="../shops/">店舗</a> / <a href="../lifejobs/">Life Job</a> / <a href="../gangs/">ギャング</a> / <a href="../faq/">よくある質問</a> / <a href="../contact/">お問い合わせ</a></nav><section><h2>PDは街の安全と犯罪対応を担当します</h2><p>PDは街の治安維持、犯罪への対応、交通対応、捜査などを担当します。犯罪RPでの追跡や逮捕も、街で起きるシーンの一つです。</p><p>職務の権限、支給品、専用機能を不正な利益のために悪用する行為は禁止です。市民への説明を大切にし、プレイヤー本人への攻撃や嫌がらせにならないようにしましょう。</p></section>
<section><h2>EMSの救急対応について</h2><p>EMSは治療、蘇生、搬送、救急対応を担当します。現場の状況を確認し、安全を確保しながら対応します。</p><p>医療サービスの種類と料金を確認し、対応内容が分からないときは担当者に聞いてください。救護の権限や医療機能を不正な利益のために悪用する行為は禁止です。</p><p>治療や蘇生の後も、復帰直後に同じ戦闘へ戻って再参加する行為は禁止です。</p></section>
<section><h2>メカニックは車の修理・整備・改造を担当します</h2><p>メカニックは修理、車両整備、カスタム、塗装などを担当します。依頼前に、作業の内容と料金を確認してから相談しましょう。</p><p>担当者は作業と請求が食い違わないよう説明してください。Job専用機能の不正利用や、実施していない作業の請求は禁止です。</p><p>修理と車両改造の料金は、料金表で確認できます。カスタムを相談するときは、希望する部位や仕上がりを伝えましょう。</p></section>
<section><h2>市民が営むお店を楽しもう</h2><p>有人店舗は街の市民が運営します。飲食、サービス、その他の店舗で、会話や買い物を楽しみましょう。</p><p>商品・作業・料金を伝え合い、説明と請求が食い違わないようにしてください。意図的な詐欺的請求やJob権限の悪用は禁止です。</p><p>店舗荒らし、意図的な営業妨害、嫌がらせは禁止です。行き違いがあればまず内容を確認し、解決が難しい場合はDiscordのお問い合わせ窓口へ相談してください。</p></section>
<section><h2>自分のペースで楽しむLife Job</h2><p>NicoGuraには、街での生活を楽しむLife Jobがあります。自分の興味に合った働き方を探してみましょう。</p><table><caption>Life Jobの紹介</caption><thead><tr><th>仕事</th><th>楽しみ方</th></tr></thead><tbody><tr><td data-label="仕事">ハンティング</td><td data-label="楽しみ方">自然の中で狩猟を楽しむ仕事。</td></tr><tr><td data-label="仕事">採掘</td><td data-label="楽しみ方">鉱石を採掘する仕事。</td></tr><tr><td data-label="仕事">バス</td><td data-label="楽しみ方">街を巡る運転の仕事。</td></tr><tr><td data-label="仕事">新聞</td><td data-label="楽しみ方">新聞を配達する仕事。</td></tr><tr><td data-label="仕事">タクシー</td><td data-label="楽しみ方">乗客を目的地へ送る仕事。</td></tr><tr><td data-label="仕事">フードトラック</td><td data-label="楽しみ方">移動販売を楽しむ仕事。</td></tr><tr><td data-label="仕事">トレジャーハンター</td><td data-label="楽しみ方">探索を楽しむ仕事。</td></tr></tbody></table><p>始め方や利用方法は、ゲーム内の案内を確認してください。分からないことはDiscordのお問い合わせ窓口へ相談できます。</p></section>
<section><h2>ギャングの設立</h2><table><caption>ギャング設立</caption><thead><tr><th>項目</th><th>金額</th></tr></thead><tbody><tr><td data-label="項目">標準ギャング設立費</td><td data-label="金額">400,000,000円</td></tr></tbody></table><p>仲間と組織での活動や犯罪RPを楽しみたい方は、設立について運営へ相談してください。ギャング活動でも、相手が楽しめるライトRPとサーバールールを守りましょう。</p></section><p><a href="https://discord.gg/Fzhhp34JJy">公式Discord</a> / <a href="https://x.com/NicoGura0810">公式X</a></p><p>検索・保存機能にはJavaScriptを有効にしてください。</p></div></noscript>
