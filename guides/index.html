    <noscript><div class="noscript"><h1>にこぐらガイド</h1><p>参加方法、基本操作、PD、EMS、メカニック、店舗、Life Job。街での使い方や料金をまとめた生活ガイドです。</p><p>最終更新 2026-11-03</p><nav><a href="../">NicoGura | にこぐら 公式ルール・参加ガイド</a> / <a href="../rules/">公式ルール</a> / <a href="../join/">参加方法</a> / <a href="../server/">サーバー情報</a> / <a href="../mods/">MOD・グリッチ</a> / <a href="../character/">キャラクター</a> / <a href="../economy/">経済・料金</a> / <a href="../crime/">犯罪RP</a> / <a href="../law/">法律・罰金</a> / <a href="../guides/">にこぐらガイド</a> / <a href="../pd/">PD・警察</a> / <a href="../ems/">EMS・救急</a> / <a href="../mechanic/">メカニック</a> / <a href="../shops/">店舗</a> / <a href="../lifejobs/">Life Job</a> / <a href="../gangs/">ギャング</a> / <a href="../faq/">よくある質問</a> / <a href="../contact/">お問い合わせ</a></nav><section id="character-changes"><h2>改名・キャラクターの相談と整形</h2><p>キャラクターの名前を変更したい場合や、作り直したい場合は、公式Discordのチケットから運営へ相談してください。</p><p>整形はEMSで行えます。希望する内容や利用方法は、EMSへ相談してください。</p></section>
<section id="pending-crime-conditions"><h2>犯罪・Heistを始める前に</h2><p>犯罪RPはNicoGuraのゲームコンテンツです。街の仲間と計画し、警察とのやり取りやシーンを楽しみましょう。</p><p>「犯罪カテゴリ・参加人数」で犯罪側の最低人数・最大人数を確認し、公開報酬基準とゲーム内法律の罰金・保護観察を読みましょう。その他の開始条件は、ゲーム内の案内を確認してください。</p><p>報酬表の「6人時」「8人時」「15人時」は報酬の基準条件です。犯罪側の参加人数は「犯罪カテゴリ・参加人数」の一覧を確認してください。</p></section>
<section id="crime-public-rewards"><h2>犯罪の公開報酬基準</h2><table><caption>犯罪の基準報酬</caption><thead><tr><th>分類</th><th>基準条件</th><th>1人の報酬</th></tr></thead><tbody><tr><td data-label="分類">小型</td><td data-label="基準条件">1人報酬基準</td><td data-label="1人の報酬">8,000,000円</td></tr><tr><td data-label="分類">準中（チェイス）</td><td data-label="基準条件">1人報酬基準</td><td data-label="1人の報酬">15,000,000円</td></tr><tr><td data-label="分類">準中（撃ち合い）</td><td data-label="基準条件">6人時・1人あたり</td><td data-label="1人の報酬">35,000,000円</td></tr><tr><td data-label="分類">中型</td><td data-label="基準条件">8人時・1人あたり</td><td data-label="1人の報酬">70,000,000円</td></tr><tr><td data-label="分類">大型</td><td data-label="基準条件">15人時・1人あたり</td><td data-label="1人の報酬">120,000,000円</td></tr></tbody></table><p>この表は基準報酬の案内です。「6人時」「8人時」「15人時」は報酬の基準条件です。犯罪側の最低人数・最大人数は「犯罪カテゴリ・参加人数」で確認してください。</p><p>犯罪を計画するときは、「犯罪カテゴリ・参加人数」とゲーム内法律の罰金・保護観察も確認しましょう。</p></section>
<section id="crime-types-guide"><h2>犯罪の種類と分類</h2><table><caption>犯罪の分類</caption><thead><tr><th>犯罪名</th><th>分類</th></tr></thead><tbody><tr><td data-label="犯罪名">コンビニ強盗</td><td data-label="分類">小型</td></tr><tr><td data-label="犯罪名">ATM強盗</td><td data-label="分類">小型</td></tr><tr><td data-label="犯罪名">空き巣</td><td data-label="分類">小型</td></tr><tr><td data-label="犯罪名">フリーカ強盗</td><td data-label="分類">準中（チェイス）</td></tr><tr><td data-label="犯罪名">現金両替強盗</td><td data-label="分類">準中（チェイス）</td></tr><tr><td data-label="犯罪名">クレーン強盗</td><td data-label="分類">準中（チェイス）</td></tr><tr><td data-label="犯罪名">ブースティング（A・S）</td><td data-label="分類">準中（チェイス）</td></tr><tr><td data-label="犯罪名">コインランドリー</td><td data-label="分類">準中（撃ち合い）</td></tr><tr><td data-label="犯罪名">ヴァンジェリコ</td><td data-label="分類">準中（撃ち合い）</td></tr><tr><td data-label="犯罪名">列車強盗</td><td data-label="分類">準中（撃ち合い）</td></tr><tr><td data-label="犯罪名">パージ強盗</td><td data-label="分類">準中（撃ち合い）</td></tr><tr><td data-label="犯罪名">軍事基地</td><td data-label="分類">準中（撃ち合い）</td></tr><tr><td data-label="犯罪名">客船</td><td data-label="分類">中型</td></tr><tr><td data-label="犯罪名">飛行場襲撃</td><td data-label="分類">中型</td></tr><tr><td data-label="犯罪名">ボブキャット</td><td data-label="分類">中型</td></tr><tr><td data-label="犯罪名">パレト</td><td data-label="分類">中型</td></tr><tr><td data-label="犯罪名">オイルリグ</td><td data-label="分類">中型</td></tr><tr><td data-label="犯罪名">貨物船強盗</td><td data-label="分類">中型</td></tr><tr><td data-label="犯罪名">ヒューマンラボ</td><td data-label="分類">中型</td></tr><tr><td data-label="犯罪名">美術館強盗</td><td data-label="分類">中型</td></tr><tr><td data-label="犯罪名">空母強盗</td><td data-label="分類">中型</td></tr><tr><td data-label="犯罪名">金庫強盗</td><td data-label="分類">中型</td></tr><tr><td data-label="犯罪名">アーティファクト</td><td data-label="分類">大型</td></tr><tr><td data-label="犯罪名">ユニオンヘイスト</td><td data-label="分類">大型</td></tr><tr><td data-label="犯罪名">カジノヘイスト</td><td data-label="分類">大型</td></tr><tr><td data-label="犯罪名">パシフィック</td><td data-label="分類">大型</td></tr><tr><td data-label="犯罪名">マウンテン・ボルト</td><td data-label="分類">大型</td></tr><tr><td data-label="犯罪名">アンダーグラウンド・ヘイスト</td><td data-label="分類">大型</td></tr><tr><td data-label="犯罪名">メイズバンク</td><td data-label="分類">大型</td></tr><tr><td data-label="犯罪名">警察署襲撃</td><td data-label="分類">特殊</td></tr><tr><td data-label="犯罪名">自動販売機強盗</td><td data-label="分類">PDなし犯罪</td></tr><tr><td data-label="犯罪名">ポストロッカー強盗</td><td data-label="分類">PDなし犯罪</td></tr><tr><td data-label="犯罪名">ブースティング（D・C・B）</td><td data-label="分類">PDなし犯罪</td></tr></tbody></table><p>参加人数は「犯罪カテゴリ・参加人数」で確認してください。この一覧は分類の案内です。現在の受付状況は、ゲーム内の案内を確認してください。</p></section>
<section id="economy-starting-funds"><h2>街での生活を始める資金</h2><table><caption>初期資金</caption><thead><tr><th>受け取り先</th><th>金額</th></tr></thead><tbody><tr><td data-label="受け取り先">現金</td><td data-label="金額">10,000,000円</td></tr><tr><td data-label="受け取り先">銀行</td><td data-label="金額">10,000,000円</td></tr><tr><td data-label="受け取り先">合計</td><td data-label="金額">20,000,000円</td></tr></tbody></table><p>街に入ったら、食事や移動、仕事の案内を確認しながら、自分のペースで生活を始めましょう。</p></section>
<section id="economy-food-prices"><h2>飲食の料金</h2><table><caption>飲食料金表</caption><thead><tr><th>効果</th><th>区分</th><th>価格</th></tr></thead><tbody><tr><td data-label="効果">空腹＋20％</td><td data-label="区分">単一効果・安価</td><td data-label="価格">300,000円</td></tr><tr><td data-label="効果">空腹＋30％</td><td data-label="区分">単一効果・上限</td><td data-label="価格">350,000円</td></tr><tr><td data-label="効果">水分＋20％</td><td data-label="区分">単一効果・安価</td><td data-label="価格">300,000円</td></tr><tr><td data-label="効果">水分＋30％</td><td data-label="区分">単一効果・上限</td><td data-label="価格">350,000円</td></tr><tr><td data-label="効果">ストレス－20％</td><td data-label="区分">単一効果</td><td data-label="価格">200,000円</td></tr><tr><td data-label="効果">ストレス－30％</td><td data-label="区分">単一効果・上限</td><td data-label="価格">250,000円</td></tr><tr><td data-label="効果">空腹30％＋水分30％</td><td data-label="区分">複合商品</td><td data-label="価格">700,000円</td></tr></tbody></table><p>お店では、商品や効果を確認しながら買い物を楽しみましょう。</p></section>
<section id="economy-fuel-prices"><h2>燃料の料金</h2><table><caption>燃料・満タン料金</caption><thead><tr><th>車両の種類</th><th>満タン</th></tr></thead><tbody><tr><td data-label="車両の種類">一般車</td><td data-label="満タン">100円</td></tr><tr><td data-label="車両の種類">高性能車</td><td data-label="満タン">100円</td></tr><tr><td data-label="車両の種類">大型車</td><td data-label="満タン">100円</td></tr><tr><td data-label="車両の種類">ヘリ</td><td data-label="満タン">100円</td></tr></tbody></table></section>
<section id="economy-consumable-prices"><h2>ニトロ補充と簡易修理用品</h2><p>ニトロ補充とダクトテープの最新料金は、「修理・車両改造の料金」にまとめています。利用前に作業内容と料金を確認してください。</p><p>簡易修理キットやダクトテープは、走行可能になる程度の応急修理用です。完全修理ではありません。全修理が必要な場合は、メカニックへ相談してください。</p><p>簡易修理キットの商品や料金については、販売時の案内を確認してください。</p></section>
<section id="ems-request"><h2>ダウンしたら救護要請を送ろう</h2><p>ダウン画面でGキーを押すと救護要請を送れます。キー割り当てを変更している場合は、対応するキーを使ってください。画面の受付通知を確認しましょう。</p><p>EMSは治療・蘇生・搬送・救急対応を担当します。現場の安全確認が必要なこともあるため、案内を待ち、分かる範囲で状況を伝えてください。</p><p>ダウン中で銀行残高から料金を支払える場合は、EMSの勤務人数にかかわらず /help で有料の救急処置を依頼できます。利用方法と料金は「緊急時の搬送と救済コマンド」を確認してください。</p></section>
<section id="ems-care"><h2>EMSの救急対応について</h2><p>EMSは治療、蘇生、搬送、救急対応、整形などを行います。現場の安全確認が必要な場合もあるため、案内に従ってください。</p><p>医療サービスの種類や料金が分からない場合は、担当者へ確認してください。</p><p>救護機能の利用条件と、復帰後の戦闘再参加に関するルールも確認してください。</p></section>
<section id="ems-fees"><h2>医療サービスの料金</h2><table><caption>医療サービス料金</caption><thead><tr><th>サービス</th><th>価格</th><th>内容</th></tr></thead><tbody><tr><td data-label="サービス">通常治療</td><td data-label="価格">300,000円</td><td data-label="内容">治療</td></tr><tr><td data-label="サービス">院内蘇生</td><td data-label="価格">1,000,000円</td><td data-label="内容">EMS施設内での蘇生</td></tr><tr><td data-label="サービス">現場蘇生・運搬</td><td data-label="価格">1,500,000円</td><td data-label="内容">現場対応・EMSへの運搬</td></tr><tr><td data-label="サービス">牢屋対応</td><td data-label="価格">2,000,000円</td><td data-label="内容">PD牢屋内</td></tr><tr><td data-label="サービス">NPC治療</td><td data-label="価格">800,000円</td><td data-label="内容">EMSが不在の場合など</td></tr></tbody></table><p>NPC治療の改定料金は800,000円です。/help のゲーム内課金にはまだ反映されておらず、現時点では銀行から1,000,000円が引き落とされます。病院受付の通常治療300,000円・院内蘇生1,000,000円とは別の料金です。利用前にゲーム内の案内も確認してください。</p><p>対応内容や場所が変わる場合は、担当者に内容と料金を確認してください。NPC治療の利用方法は、ゲーム内の案内に従ってください。</p></section>
<section id="ems-supplies"><span id="ems-bandage" aria-hidden="true"></span><span id="ems-painkiller" aria-hidden="true"></span><span id="ems-ifak" aria-hidden="true"></span><span id="ems-injuries" aria-hidden="true"></span><h2>EMS専売品</h2><table><caption>EMS専売品の価格と効果</caption><thead><tr><th>品目</th><th>価格</th><th>効果</th><th>販売区分</th></tr></thead><tbody><tr><td data-label="品目">包帯</td><td data-label="価格">250,000円</td><td data-label="効果">一時的な止血</td><td data-label="販売区分">EMS専売品</td></tr><tr><td data-label="品目">鎮痛剤</td><td data-label="価格">250,000円</td><td data-label="効果">痛み・症状の一時的な緩和</td><td data-label="販売区分">EMS専売品</td></tr><tr><td data-label="品目">IFAK</td><td data-label="価格">200,000円</td><td data-label="効果">体力25％回復のみ</td><td data-label="販売区分">EMS専売品</td></tr></tbody></table><h3>応急処置と治療の違い</h3><p>包帯は一時的に出血を抑え、鎮痛剤は痛み・症状を一時的に緩和します。完治ではなく、時間がたつと症状が再発する場合があります。</p><p>IFAKは体力を25％回復する応急処置用品です。怪我や症状を完全に治療するものではありません。</p><p>怪我・出血・症状を完治させるには、EMSによる治療を受けてください。症状がある場合は、EMSへ相談してください。</p></section>
<section id="ems-emergency-commands"><h2>緊急時の搬送と救済コマンド</h2><h3>/tpems：病院への移動</h3><p>救助が困難な状況などで /tpems を使用するときは、利用理由を記入してください。記入した理由は運営が確認します。</p><p>/tpems は病院へ移動する機能です。蘇生や体力回復は行いません。移動後は、EMSや利用可能な治療の案内を確認してください。</p><h3>/help：有料の救急処置</h3><p>/help は /tpems とは別の機能です。ダウン中で銀行残高から料金を支払える場合に、有料の救急処置を依頼できます。EMSが勤務中でも利用できます。EMSへの救護要請は、引き続きダウン画面から送れます。</p><p>車内や拘束・収監中でも救急処置を依頼できます。手錠や収監などの状態が解除される機能ではありません。道路へ安全に移動できない場合は、その場で処置します。NPCを安全に配置できない場合や救助が重なった場合も、NPCの到着を待たずに処置を受けられます。画面の案内を確認してください。</p><p>/help は有料です。現在の請求額と改定料金の差については、「医療サービスの料金」を確認してください。</p><p>緊急救済の悪用は禁止です。EMS・PDから指示がある場合も、機能自体の利用条件に従ってください。</p></section>
<section id="ems-beginner-ticket-planned"><h2>初心者EMS券の変更予定</h2><p>β開始後は、初心者EMS券を牢屋対応に使用できなくなる予定です。</p><p>これは今後の変更予定です。適用開始日は、公式のお知らせで確認してください。現在の利用可否は、EMSの案内に従ってください。</p></section>
<section id="faq-find-share"><h2>読み返したいルールを探すには？</h2><ul><li>検索ではタイトル・本文・タグ・カテゴリー・料金表の文字を探せます。</li><li>カテゴリーでは知りたい仕事や場面に絞れます。</li><li>☆保存では、このブラウザに読み返したいルールを保存できます。</li><li>リンクコピーでは、そのルールへ直接開けるURLを共有できます。</li></ul><p>保存情報は端末・ブラウザごとに記録されます。ブラウザのデータを消すと、保存情報も消える場合があります。</p></section>
<section id="faq-rp-beginner"><h2>RP初心者でも参加できますか？</h2><p>はい、参加できます。NicoGuraは初心者歓迎のライトRPサーバーです。完璧な演技は必要ありません。</p></section>
<section id="faq-fivem-beginner"><h2>FiveM初心者でも大丈夫ですか？</h2><p>はい、大丈夫です。FiveMが初めての方でも参加できます。</p><p>まずは参加方法の10ステップを順に確認してください。接続方法や操作で分からないことがある場合は、公式Discordの「お問い合わせ窓口」から気軽にご相談ください。</p></section>
<section id="faq-character-count"><h2>キャラクターはいくつ作れますか？</h2><p>1人につき1キャラクター限定です。</p><p>作り直したい場合は、追加で作成せず、事前に運営へ相談してください。</p></section>
<section id="faq-whitelist-interview"><h2>Whitelistは面接ですか？</h2><p>いいえ、面接ではありません。質問への回答形式でもありません。</p><p>初回接続時に表示された本人のRxxxxコードを、公式Discordの「#ホワイトリスト申請」へ投稿してください。運営の承認後に再接続すると入国できます。</p></section>
<section id="faq-rule-memory"><h2>ルールは全部暗記する必要がありますか？</h2><p>いいえ、ルールを全部暗記する必要はありません。基本的なマナーと禁止事項を理解していれば大丈夫です。</p></section>
<section id="faq-crime-ban"><h2>犯罪をするとBANされますか？</h2><p>犯罪RPをすること自体が、BANの理由になるわけではありません。犯罪RPは街のゲームコンテンツで、サーバールール違反とは別です。</p><p>ゲーム内の犯罪には、法律に沿ってPD対応・罰金・保護観察・押収・インパウンドなどが発生します。チートやRDMなどのサーバールール違反がある場合は、犯罪RPとは別に運営が対応します。</p></section>
<section id="faq-bug-report"><h2>不具合を見つけました。どうすればいいですか？</h2><p>不具合の追加利用を止め、タブレットの「不具合・ご意見」から報告してください。早急な対応、申請、クリップの提出は、公式Discordのチケットからお願いします。</p><p>発生時刻と状況を伝え、動画やスクリーンショットがあれば添えてください。同じ内容を複数の窓口へ重複して報告しないでください。</p><p>犯罪の進行が不可能になった場合は、PDへ連絡してシーンを一時中断し、犯罪中の不具合対応の手順に従ってください。</p></section>
<section id="faq-missing-items"><h2>アイテムが消えました。どうすればいいですか？</h2><p>アイテム消失などの補填相談は、公式Discordのチケットから運営へ連絡してください。いつ、どのような操作や状況で消えたかを伝えてください。</p><p>動画やスクリーンショットがある場合は添えてください。犯罪の不具合に伴う補填は、ボディカメラの提出が必要です。</p></section>
<section id="faq-rule-loopholes"><h2>ルールに書いていなければ何をしてもいいですか？</h2><p>いいえ、何をしてもよいわけではありません。運営や市民を妨げる行為や、悪質な抜け穴利用には、運営が対応する場合があります。</p></section>
<section id="faq-client-mods"><h2>CitizenやGraphics MODは使えますか？</h2><p>Citizen・Client側MODは原則禁止です。例外的に使用を認める場合があるため、導入前にチケットで運営へお問い合わせください。</p><p>軽量化・見た目・音の変更でも、自己判断で使える許可一覧ではありません。「Citizen・Client側MODの使用条件」を確認してください。</p></section>
<section id="faq-low-spec"><h2>低スペックPCなので軽量化したいです。</h2><p>Citizen・Client側MODによる軽量化は、使用前にチケットで運営へお問い合わせください。低スペックPC向けという理由だけで、使用を許可するものではありません。</p><p>導入したいMODと、何が変更されるかを伝えてください。</p></section>
<section id="faq-movement-glitches"><h2>スピブ / グリロは使えますか？</h2><p>いいえ、使用できません。意図的・反復的なSpeed Boost / Glitch Rollは、グリッチ利用として禁止しています。</p><p>偶然一度発生しただけの挙動まで、即ルール違反とはしません。マクロ等でスピブ・グリロを自動化する行為も禁止です。</p></section>
<section id="faq-bandage-treatment"><h2>怪我は包帯だけで治りますか？</h2><p>包帯だけでは完治しません。包帯や鎮痛剤は一時的な応急処置で、時間がたつと症状が再発する場合があります。怪我や出血の治療はEMSへ相談してください。</p></section>
<section id="faq-wednesday-maintenance"><h2>水曜日に入れません。</h2><p>水曜日03:00から木曜日19:00まで（日本時間・JST）は、定期メンテナンスのための基本定休日です。木曜日19:00の再開予定や最新の稼働情報は、公式Discordの「街からのお知らせ」等を確認してください。</p></section>
<section id="gang-establishment"><h2>ギャングの設立</h2><table><caption>ギャング設立</caption><thead><tr><th>項目</th><th>金額</th></tr></thead><tbody><tr><td data-label="項目">ギャング設立費</td><td data-label="金額">2,000,000,000円</td></tr></tbody></table><p>設立に関する相談は、公式Discordのチケットからお願いします。</p><p>現在、ギャングの設立申請は受け付けていません。募集再開の案内は、公式のお知らせを確認してください。</p></section>
<section id="gang-color-registration"><h2>ギャングカラーの登録相談</h2><p>ギャングカラーは設立時に運営へ登録します。服装、車両、装飾などで所属を分かりやすくしましょう。</p><table><caption>ギャングカラーと登録状況</caption><thead><tr><th>色名</th><th>HEX</th><th>登録状況</th><th>ギャング名</th></tr></thead><tbody><tr><td data-label="色名">赤</td><td data-label="HEX">—</td><td data-label="登録状況">運営へ確認</td><td data-label="ギャング名">—</td></tr><tr><td data-label="色名">青</td><td data-label="HEX">—</td><td data-label="登録状況">運営へ確認</td><td data-label="ギャング名">—</td></tr><tr><td data-label="色名">桃</td><td data-label="HEX">—</td><td data-label="登録状況">運営へ確認</td><td data-label="ギャング名">—</td></tr><tr><td data-label="色名">黄</td><td data-label="HEX">—</td><td data-label="登録状況">運営へ確認</td><td data-label="ギャング名">—</td></tr><tr><td data-label="色名">橙</td><td data-label="HEX">—</td><td data-label="登録状況">運営へ確認</td><td data-label="ギャング名">—</td></tr><tr><td data-label="色名">緑</td><td data-label="HEX">—</td><td data-label="登録状況">運営へ確認</td><td data-label="ギャング名">—</td></tr><tr><td data-label="色名">紫</td><td data-label="HEX">—</td><td data-label="登録状況">運営へ確認</td><td data-label="ギャング名">—</td></tr></tbody></table><p>色の正確なHEX、使用中・空きの状況、登録ギャング名は運営へ確認してください。「—」は未確認の項目です。</p><p>犯罪シーンでのカラーは、「犯罪シーンではカラーを揃える」に従ってください。</p></section>
<section id="intro-welcome"><h2>NicoGuraへようこそ</h2><p>NicoGura（にこぐら）は、みんなでゆっくり街での生活を楽しむライトRPサーバーです。FiveM初心者もRP初心者も歓迎します。完璧な演技や、細かなキャラクター設定は必要ありません。</p><p>ゲーム内では「この街に暮らす一人の市民」という意識を持って、仕事や会話、街で起きる出来事を楽しんでください。自分だけでなく、一緒にいる人も楽しめる行動を大切にしましょう。</p><p>ルールはみんなが気持ちよく遊ぶための最低限の約束です。分からないことは、公式Discordの「お問い合わせ窓口」から確認できます。</p></section>
<section id="intro-reading"><h2>まずは基本の約束を確認しよう</h2><ul><li>一緒に遊ぶ相手を尊重する。</li><li>理由のない攻撃や、外部情報を使った有利な行動をしない。</li><li>不正利用や嫌がらせをしない。</li><li>困ったら報復せず、Discordの「お問い合わせ窓口」へ相談する。</li></ul><p>ルール一覧では検索やカテゴリーから必要な内容を探せます。バッジは案内の種類を表し、処分を自動的に決めるものではありません。</p><p>犯罪RPは街のゲームコンテンツです。ゲーム内の法律違反にはPDが対応し、罰金・保護観察・押収・インパウンドなどが発生します。サーバールール違反は運営が対応します。</p></section>
<section id="communication-voice"><h2>聞き取りやすい会話に協力しよう</h2><p>大きな音や連続した呼びかけで、他の人の会話を妨げないようお願いします。マイクの不調や音量に気づいたら、短く伝え合って調整しましょう。声色を変えたり、上手に演技したりする必要はありません。</p></section>
<section id="vehicles-courtesy"><h2>周りの人と車に気を配ろう</h2><p>店舗や救護の近くでは周囲に気を配り、他の人の活動を長く妨げないようお願いします。事故や接触が起きたときは、状況を短く伝え合いましょう。</p></section>
<section id="administration-report"><h2>要望・不具合・問い合わせの送り方</h2><h3>ゲーム内の要望・不具合</h3><p>タブレットの「不具合・ご意見」から提出できます。Discordの「不具合」では、利用者同士で解決方法を確認できる場合もあります。</p><h3>チケットで運営へ相談する場合</h3><p>早急な対応が必要な場合、申請、クリップの提出は、公式Discordのチケットからお願いします。荒らしや違反に対しては報復や長時間の口論を続けず、運営へ相談してください。</p><ul><li>いつ、どこで、何が起きたか。</li><li>関わった人と状況。分かる場合は名前や入国ID。</li><li>動画やスクリーンショットがある場合は、確認してほしい箇所。</li></ul><p>対応には時間がかかる場合があります。同じ内容を重複して報告せず、窓口での案内をお待ちください。</p><p>一般の相談では、常時録画は必須ではありません。分かる範囲で状況を伝えてください。犯罪の不具合に伴う補填には、ボディカメラの提出が必要です。</p></section>
<section id="rp-light"><h2>NicoGuraのライトRP</h2><ul><li>完璧な演技や細かなキャラクター背景設定は不要です。</li><li>声色を変える必要もありません。RP初心者、FiveM初心者も歓迎します。</li><li>ゲーム内では、この街に暮らすキャラクターとして行動しましょう。</li><li>他の市民のRPを壊さず、相手も楽しめる遊び方を意識してください。</li></ul><p>自然な会話や出来事のやり取りを楽しめれば大丈夫です。細かな演技方法や、厳密なキャラクター経歴を求めるものではありません。</p></section>
<section id="rp-stream-ghosting"><h2>配信情報をゲーム内で使わないために</h2><p>配信画面から相手の位置を探して追跡や待ち伏せをしたり、作戦を仲間へ伝えたりしないでください。自分のキャラクターが街の中で知った情報を使って遊びましょう。</p></section>
<section id="administration-sanctions"><h2>対応は状況・悪質性に応じて判断します</h2><p>違反の状況、悪質性、繰り返しの有無などを確認して対応します。すべての違反に固定の罰則や、必ず同じ順番の対応を設けるものではありません。</p><p>チート、RMT、Duplication、BAN回避、重大な荒らし、サーバー攻撃などは、初回から重い対応になる場合があります。</p><p>ゲーム内の犯罪に対するPDの罰金や保護観察と、サーバールール違反に対する運営対応は別です。処分に関する相談や異議はDiscordの「お問い合わせ窓口」へ連絡してください。</p></section>
<section id="streamer-mode-guide"><h2>配信者モードの付け方</h2><p>/name を開き、「配信者モード」から名前に「🛰」マークを付けてください。</p><p>配信時の表示と、犯罪中の取り扱いは「配信・SNSでも相手を大切に」を確認してください。</p></section>
<section id="guide-menu-controls"><h2>インベントリとタブレットの開き方</h2><p>F2でインベントリを開けます。持ち物を確認するときに使ってください。</p><p>F5でタブレットを開けます。街のルールやガイドを確認したいときは、タブレットの案内を利用してください。</p><p>キー割り当てを変更している場合は、自分の設定を確認してください。</p></section>
<section id="join-flow"><h2>NicoGuraへの参加方法</h2><ul><li>Discordに参加：公式Discord https://discord.gg/Fzhhp34JJy に参加します。</li><li>公式ルールを確認：Discordの案内からNicoGuraの公式ルールを読みます。</li><li>✅を押す：ルール確認メッセージの✅リアクションを押します。</li><li>「市民」ロールを取得：ルール確認後に「市民」ロールが付与されます。</li><li>FiveMからNicoGuraへ初回接続：公式Discordの接続案内を確認して接続します。</li><li>Whitelist Request Codeを確認：未承認の場合は接続画面にR1234のようなRxxxx形式のコードが表示されます。</li><li>Discordへ申請：#ホワイトリスト申請へ、本人の画面に表示されたRxxxxコードをそのまま投稿します。例：R1234。</li><li>運営承認：運営がtxAdmin Allowlistで申請を承認します。</li><li>FiveMへ再接続：承認後、NicoGuraへ再接続します。</li><li>入国完了：NicoGuraでの生活を始めましょう。</li></ul><p>すでに承認済みの方は、接続画面の案内に従ってください。コードの表示や承認で困った場合は、Discordの「お問い合わせ窓口」へ連絡してください。</p></section>
<section id="pending-weapons-license"><h2>武器を扱う場面で大切なこと</h2><p>NicoGuraでは、犯罪RPも街のコンテンツの一つです。武器を使うときも、RP上の理由や流れを大切にしてください。突然の攻撃や、相手が反応する余地を奪う行為は避けましょう。</p><p>銃刀法違反の罰金・保護観察はゲーム内法律の扱いです。RDMやチートなどのサーバールール違反は、運営が対応します。</p></section>
<section id="pending-penalty-times"><h2>ゲーム内の処分を確認するとき</h2><p>ゲーム内法律の罰金や保護観察は、街の犯罪RPに対するPDの対応です。基本罰金・保護観察と、Heistの罰金・保護観察を確認してください。</p><p>処分を受けたときは、適用された罪状、支払う金額、保護観察時間の説明を確認しましょう。分からない点はPDへ尋ねて大丈夫です。</p><p>サーバールール違反への警告・キック・BANなどは運営が対応します。ゲーム内で罰金を支払ったことだけで、ルール違反への運営対応が終わるわけではありません。</p></section>
<section id="lifejobs-overview"><h2>自分のペースで楽しむLife Job</h2><p>NicoGuraには、街での生活を楽しむLife Jobがあります。自分の興味に合った働き方を探してみましょう。</p><table><caption>Life Job一覧</caption><thead><tr><th>職名</th><th>状態</th></tr></thead><tbody><tr><td data-label="職名">ハンティング</td><td data-label="状態">—</td></tr><tr><td data-label="職名">トレジャーハンター</td><td data-label="状態">—</td></tr><tr><td data-label="職名">リサセン</td><td data-label="状態">—</td></tr><tr><td data-label="職名">鉱石</td><td data-label="状態">—</td></tr><tr><td data-label="職名">釣り</td><td data-label="状態">—</td></tr><tr><td data-label="職名">砂金</td><td data-label="状態">—</td></tr><tr><td data-label="職名">消防士</td><td data-label="状態">—</td></tr><tr><td data-label="職名">建設</td><td data-label="状態">—</td></tr><tr><td data-label="職名">ゴミ収集</td><td data-label="状態">—</td></tr><tr><td data-label="職名">窓清掃</td><td data-label="状態">—</td></tr><tr><td data-label="職名">プール清掃</td><td data-label="状態">—</td></tr><tr><td data-label="職名">タクシー運転手</td><td data-label="状態">—</td></tr><tr><td data-label="職名">トラック</td><td data-label="状態">—</td></tr><tr><td data-label="職名">農業 / 酪農</td><td data-label="状態">—</td></tr><tr><td data-label="職名">新聞配達</td><td data-label="状態">—</td></tr><tr><td data-label="職名">木こり</td><td data-label="状態">調整中</td></tr><tr><td data-label="職名">電気工事</td><td data-label="状態">調整中</td></tr></tbody></table><table><caption>バス・フードトラック</caption><thead><tr><th>仕事</th><th>楽しみ方</th></tr></thead><tbody><tr><td data-label="仕事">バス</td><td data-label="楽しみ方">街を巡る運転の仕事。</td></tr><tr><td data-label="仕事">フードトラック</td><td data-label="楽しみ方">移動販売を楽しむ仕事。</td></tr></tbody></table><p>始め方や利用方法は、ゲーム内の案内を確認してください。分からないことはDiscordのお問い合わせ窓口へ相談できます。</p></section>
<section id="mechanic-billing"><span id="pending-mechanic-fees" aria-hidden="true"></span><h2>修理・カスタムをメカニックに相談する</h2><p>メカニックには、修理・車両整備・カスタム・塗装などを相談できます。</p><h3>依頼する前に確認すること</h3><ul><li>料金表を確認し、希望する作業箇所・部位と仕上がりを伝えてください。</li><li>塗装、外装パーツ、ライト、ナンバーなど、変更したい内容を具体的に相談してください。</li><li>作業の範囲と料金の内訳・請求内容を担当者と確認し、納得してから依頼しましょう。</li></ul></section>
<section id="mechanic-fees"><h2>修理・車両改造の料金</h2><table><caption>修理と出張</caption><thead><tr><th>作業</th><th>料金</th><th>単位・範囲</th></tr></thead><tbody><tr><td data-label="作業">通常修理</td><td data-label="料金">200,000円</td><td data-label="単位・範囲">1箇所</td></tr><tr><td data-label="作業">全修理</td><td data-label="料金">1,400,000円</td><td data-label="単位・範囲"></td></tr><tr><td data-label="作業">タイヤ交換</td><td data-label="料金">500,000円</td><td data-label="単位・範囲">1本</td></tr><tr><td data-label="作業">出張</td><td data-label="料金">500,000円</td><td data-label="単位・範囲">都心・郊外</td></tr><tr><td data-label="作業">出張</td><td data-label="料金">1,000,000円</td><td data-label="単位・範囲">北</td></tr></tbody></table><table><caption>性能カスタム</caption><thead><tr><th>作業</th><th>料金</th></tr></thead><tbody><tr><td data-label="作業">性能カスタム level1</td><td data-label="料金">3,000,000円</td></tr><tr><td data-label="作業">性能カスタム level2</td><td data-label="料金">4,000,000円</td></tr><tr><td data-label="作業">性能カスタム level3</td><td data-label="料金">5,000,000円</td></tr><tr><td data-label="作業">性能カスタム level4</td><td data-label="料金">6,000,000円</td></tr><tr><td data-label="作業">性能カスタム level5</td><td data-label="料金">7,000,000円</td></tr><tr><td data-label="作業">ターボチャージャー</td><td data-label="料金">4,000,000円</td></tr><tr><td data-label="作業">ニトロ取り付け</td><td data-label="料金">2,000,000円</td></tr><tr><td data-label="作業">ニトロ補充</td><td data-label="料金">1,000,000円</td></tr><tr><td data-label="作業">アーマー</td><td data-label="料金">8,000,000円</td></tr><tr><td data-label="作業">ハーネス</td><td data-label="料金">4,000,000円</td></tr></tbody></table><table><caption>外装と消耗品</caption><thead><tr><th>作業・品目</th><th>料金</th><th>単位・補足</th></tr></thead><tbody><tr><td data-label="作業・品目">塗装・外装</td><td data-label="料金">300,000円</td><td data-label="単位・補足">1箇所</td></tr><tr><td data-label="作業・品目">RGB塗装</td><td data-label="料金">600,000円</td><td data-label="単位・補足"></td></tr><tr><td data-label="作業・品目">アンダーグロー・キセノン</td><td data-label="料金">600,000円</td><td data-label="単位・補足"></td></tr><tr><td data-label="作業・品目">特殊ナンバー</td><td data-label="料金">1,000,000,000円</td><td data-label="単位・補足">申請制</td></tr><tr><td data-label="作業・品目">ダクトテープ</td><td data-label="料金">300,000円</td><td data-label="単位・補足">1個</td></tr></tbody></table><p>作業前に、依頼する部位、作業範囲、料金の内訳を担当者と確認してください。</p></section>
<section id="movement-glitches"><h2>スピードブースト・グリッチロールとは</h2><p>ゲーム本来の想定を超える移動・回避の挙動を意図的に悪用し、有利になる行為は禁止です。</p><h3>スピードブースト（スピブ）</h3><p>移動・エイム・方向転換等を組み合わせ、ゲーム本来の想定を超える移動速度を得るために、移動挙動を意図的に悪用する行為です。</p><h3>グリッチロール（グリロ）</h3><p>ローリング等の挙動や同期処理を悪用し、通常ではない移動・回避を行って、戦闘上の優位性を得る行為です。</p><p>ローリングキャンセル、移動モーションキャンセル、同種の移動グリッチなども、想定外の挙動を意図的に反復利用して有利になる行為は禁止です。</p><p>偶然一度発生しただけの挙動まで、即ルール違反とはしません。禁止対象は意図的・反復的な利用です。</p><p>マクロ等を使ってスピブ・グリロを自動化する行為も禁止です。</p></section>
<section id="client-mod-consultation"><h2>MODを相談するとき</h2><p>軽量化、Texture、Graphics、NVE・QuantV、ReShade、Sound Pack、Road Textureなど、導入したい変更の内容を運営に伝えてください。これらは使用を許可した一覧ではありません。</p><p>視認性・位置情報・戦闘性能に関わる変更は、何が変わるかも説明してください。草・木・建物・水の削除や透明化、霧や夜の明るさ、Crosshair・Overlay、Hitbox・Damage、Tracer・KillFX、画面比率、足音や銃声の変更などが該当します。</p><p>MOD等の導入は自己責任です。MOD等が原因のクラッシュ、表示不具合、データ破損、起動不能等について、運営は原則として補償しません。</p></section>
<section id="pd-authority"><h2>PDは街の安全と犯罪対応を担当します</h2><p>PDは街の治安維持、犯罪への対応、交通対応、捜査などを担当します。犯罪RPでの追跡や逮捕も、街で起きるシーンの一つです。</p><p>職務や処分について分からないことは、担当のPDへ確認してください。</p></section>
<section id="pd-fines"><h2>PDの対応とゲーム内法律</h2><p>ゲーム内犯罪は、PDによる対応、罰金、保護観察、押収、インパウンドなどの対象になります。犯罪RPをすること自体は街のコンテンツです。</p><p>PDはゲーム内法律に基づく罪状と処分を説明してください。市民も、罪状・請求額・保護観察時間が分からないときは、説明を求めて大丈夫です。</p><p>基本罰金・保護観察、Heistの罰金・保護観察、インパウンドの料金と待機時間は「ゲーム内法律・罰金」で確認できます。サーバールール違反は運営対応の対象です。</p></section>
<section id="pd-community-service"><h2>社会奉仕活動について</h2><p>NicoGuraには、プリズンに代わる、拘束されない社会奉仕活動の制度があります。期間中は犯罪などが制限されます。</p><p>適用された期間や制限の内容は、PDの説明を確認してください。罪状ごとの保護観察時間は「法律と罰金」で確認できます。</p></section>
<section id="server-restarts"><h2>通常再起動の時刻</h2><p>ゲームサーバーの通常再起動は、日本時間（JST）の03:00・11:00・19:00の1日3回です。</p><table><caption>通常再起動</caption><thead><tr><th>通常再起動（JST）</th></tr></thead><tbody><tr><td data-label="通常再起動（JST）">03:00</td></tr><tr><td data-label="通常再起動（JST）">11:00</td></tr><tr><td data-label="通常再起動（JST）">19:00</td></tr></tbody></table><p>掲載している時刻は、ゲームサーバーを再起動するタイミングです。定休日や臨時メンテナンスの際は、公式Discordの「街からのお知らせ」等で最新の稼働情報を確認してください。</p></section>
<section id="server-maintenance"><h2>街の基本定休日とメンテナンス</h2><p>定期メンテナンスのため、水曜日03:00から木曜日19:00までの40時間は、サーバーへアクセスできません。時刻は日本時間（JST）です。</p><table><caption>現在の定期メンテナンス</caption><thead><tr><th>開始（JST）</th><th>終了予定（JST）</th></tr></thead><tbody><tr><td data-label="開始（JST）">水曜日03:00</td><td data-label="終了予定（JST）">木曜日19:00</td></tr></tbody></table><p>作業状況により延長する場合があります。定期メンテナンス日以外に、緊急メンテナンスを行うこともあります。公式のお知らせで最新の稼働情報を確認してください。</p></section>
<section id="server-future-maintenance"><h2>β以降のメンテナンス変更予定</h2><p>β以降は、定期メンテナンスの時間を24時間へ変更する予定です。</p><p>この案内は今後の変更予定です。開始日と具体的な開始・終了時刻は、公式のお知らせで確認してください。現在の基本日程は「街の基本定休日とメンテナンス」を参照してください。</p></section>
<section id="business-honest"><h2>市民が営むお店を楽しもう</h2><p>有人店舗は街の市民が運営します。飲食、サービス、その他の店舗で、会話や買い物を楽しみましょう。</p><p>商品や作業の内容、料金を確認しながら利用してください。行き違いがあれば、まず店舗と内容を確認しましょう。</p></section>
<section id="pending-job-conditions"><h2>街の仕事と公務員について</h2><p>市民が営むお店の仕事やLife Jobなど、興味に合う働き方を探してみましょう。お店では商品やサービスを通して、市民との交流を楽しめます。</p><p>就職や採用は担当者へ相談し、兼業などの条件を確認してください。</p></section>
<section id="shop-establishment"><h2>飲食店・ジョイント店の開業相談</h2><p>飲食店・ジョイント店では、食料、飲み物、嗜好品を販売します。開業に関する相談は、公式Discordのチケットからお願いします。</p><p>現在、飲食店・ジョイント店の開業申請は受け付けていません。募集再開の案内は、公式のお知らせを確認してください。</p></section><p><a href="https://discord.gg/Fzhhp34JJy">公式Discord</a> / <a href="https://x.com/NicoGura0810">公式X</a></p><p>検索・保存機能にはJavaScriptを有効にしてください。</p></div></noscript>
