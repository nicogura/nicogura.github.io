    <noscript><div class="noscript"><h1>参加方法</h1><p>Discordから市民ロール、Rxxxxコードの申請、承認後の再接続まで。NicoGuraへの参加を10ステップで案内します。</p><p>最終更新 2026-10-10</p><nav><a href="../">NicoGura | にこぐら 公式ルール・参加ガイド</a> / <a href="../rules/">公式ルール</a> / <a href="../join/">参加方法</a> / <a href="../character/">キャラクター</a> / <a href="../economy/">経済・料金</a> / <a href="../crime/">犯罪RP</a> / <a href="../law/">法律・罰金</a> / <a href="../guides/">街ガイド</a> / <a href="../pd/">PD・警察</a> / <a href="../ems/">EMS・救急</a> / <a href="../mechanic/">メカニック</a> / <a href="../shops/">店舗</a> / <a href="../lifejobs/">Life Job</a> / <a href="../gangs/">ギャング</a> / <a href="../faq/">よくある質問</a> / <a href="../contact/">お問い合わせ</a></nav><section><h2>NicoGuraへの参加方法</h2><ul><li>Discordに参加：公式Discord https://discord.gg/Fzhhp34JJy に参加します。</li><li>公式ルールを確認：Discordの案内からNicoGuraの公式ルールを読みます。</li><li>✅を押す：ルール確認メッセージの✅リアクションを押します。</li><li>「市民」ロールを取得：ルール確認後に「市民」ロールが付与されます。</li><li>FiveMからNicoGuraへ初回接続：公式Discordの接続案内を確認して接続します。</li><li>Whitelist Request Codeを確認：未承認の場合は接続画面にR1234のようなRxxxx形式のコードが表示されます。</li><li>Discordへ申請：#ホワイトリスト申請へ、本人の画面に表示されたRxxxxコードをそのまま投稿します。例：R1234。</li><li>運営承認：運営がtxAdmin Allowlistで申請を承認します。</li><li>FiveMへ再接続：承認後、NicoGuraへ再接続します。</li><li>入国完了：NicoGuraでの生活を始めましょう。</li></ul><p>すでに承認済みの方は、接続画面の案内に従ってください。コードの表示や承認で困った場合は、Discordの「お問い合わせ窓口」へ連絡してください。</p></section>
<section><h2>Whitelistはコード申請と運営承認です</h2><p>Discord参加、ルール確認、✅リアクション、市民ロール取得の後、FiveMから初回接続します。未承認の場合は表示されたWhitelist Request Codeを#ホワイトリスト申請へ投稿してください。</p><ul><li>必ず本人の接続画面に表示されたRxxxxコードを使います。他人のコードは使わないでください。</li><li>運営のtxAdmin Allowlist承認前は入国できません。</li><li>承認されたらFiveMへ再接続してください。</li><li>問題がある場合はDiscordの「お問い合わせ窓口」へ相談してください。</li></ul></section><p><a href="https://discord.gg/Fzhhp34JJy">公式Discord</a> / <a href="https://x.com/NicoGura0810">公式X</a></p><p>検索・保存機能にはJavaScriptを有効にしてください。</p></div></noscript>
